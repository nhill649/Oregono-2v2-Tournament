<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>R6 Stream Control</title><style>*{box-sizing:border-box}body{margin:0;background:#090d12;color:#fff;font:16px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.wrap{max-width:1100px;margin:auto;padding:28px}.accent{color:#55d6c2;font-size:13px;font-weight:800;letter-spacing:.08em}.panel{background:#111820;border:1px solid #2a3743;border-radius:14px;padding:18px;margin:16px 0}.top{display:flex;justify-content:space-between;align-items:flex-start;gap:20px}.top h1{font-size:38px;margin:8px 0}.sub{color:#9aa8b5;font-size:14px}.live{border:1px solid #2a3743;border-radius:22px;padding:10px 15px;color:#9aa8b5}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:#55d6c2;margin-right:8px}.section-title{color:#9aa8b5;font-size:13px;font-weight:800;letter-spacing:.08em;margin:28px 0 10px}.hint,.small{color:#9aa8b5;font-size:13px;line-height:1.5}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.stream{background:#0d141b;border:1px solid #2a3743;border-radius:10px;padding:14px}.stream h3{margin:0 0 5px}.stream p{margin:0 0 12px;color:#9aa8b5;font-size:12px}.input{width:100%;height:44px;padding:9px 11px;background:#080d12;color:#fff;border:1px solid #3a4855;border-radius:8px;font:inherit;outline:none}.input:focus{border-color:#55d6c2}.check{display:flex;align-items:center;gap:8px;margin-top:11px;color:#9aa8b5;font-size:13px}.check input{accent-color:#55d6c2}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:18px}button{padding:11px 17px;border-radius:8px;border:1px solid #3a4855;background:#0d141b;color:#fff;font-weight:800;cursor:pointer}button.primary{background:#55d6c2;border-color:#55d6c2;color:#07111b}button.danger{background:#2b1117;border-color:#8b3949;color:#ff9aaa}.status{font-size:13px;color:#9aa8b5}.status.ok{color:#55d6c2}.status.error{color:#ff9aaa}.links{margin:18px 0}.links a{color:#55d6c2;margin-right:18px;text-decoration:none}.login{max-width:430px;margin:70px auto}.login input{margin:7px 0}.footer{text-align:center;color:#64727f;font-size:12px;margin-top:30px}@media(max-width:700px){.wrap{padding:18px}.top{display:block}.top h1{font-size:30px}.live{display:inline-block;margin-top:15px}.grid{grid-template-columns:1fr}}</style></head><body><div id="app"></div><script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';import{getAuth,signInWithEmailAndPassword,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js';import{getFirestore,doc,getDoc,setDoc,onSnapshot}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js';import{firebaseConfig}from'./firebase-config.js';import{PLAYERS}from'./players.js';
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),ref=doc(db,'tournaments','oregano-stats'),appEl=document.querySelector('#app');let state={streams:[]};
function login(){appEl.innerHTML='<div class="panel login"><div class="accent">RAINBOW SIX SIEGE • ADMIN</div><h1>R6 Stream Control</h1><p class="hint">Tournament stream management is protected by your Firebase admin login.</p><input id="email" class="input" type="email" placeholder="Email"><input id="password" class="input" type="password" placeholder="Password"><button id="login" class="primary">Log In</button><div id="err" class="status error"></div></div>';document.querySelector('#login').onclick=async()=>{try{await signInWithEmailAndPassword(auth,document.querySelector('#email').value.trim(),document.querySelector('#password').value)}catch(e){document.querySelector('#err').textContent='Login failed: '+(e.code||e.message)}}}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}function normalize(url){url=url.trim();if(!url)return'';if(!/^https?:\/\//i.test(url))url='https://'+url;try{const u=new URL(url);return u.hostname.includes('twitch.tv')?u.href:null}catch{return null}}
function render(){let saved=state.streams||[];appEl.innerHTML='<main class="wrap"><header class="top"><div><div class="accent">RAINBOW SIX SIEGE • 2V2 TOURNAMENT</div><h1>R6 Stream Control</h1><div class="sub">STREAM SOURCES • MATCH CONTROL</div></div><div class="live"><span class="dot"></span>LIVE DASHBOARD</div></header><div class="section-title">TWITCH STREAM SOURCES</div><section class="panel"><p class="hint">Add the Twitch URL for each tournament player. The player names below are the official in-game gamer tags and are fixed so the stats system always uses the correct name.</p><div class="grid">'+PLAYERS.map((p,i)=>{let s=saved.find(x=>x.slot===i+1)||{};return '<div class="stream"><h3>'+esc(p.name)+'</h3><p>Stream '+(i+1)+' • '+(p.aliases.length>1?'Aliases: '+esc(p.aliases.slice(1).join(', ')):'Official gamer tag')+'</p><input class="input url" data-i="'+i+'" value="'+esc(s.url||'')+'" placeholder="https://www.twitch.tv/channel"><label class="check"><input type="checkbox" class="enabled" data-i="'+i+'" '+(s.enabled?'checked':'')+'> Available for analysis</label></div>'}).join('')+'</div><div class="actions"><button id="save" class="primary">Save Stream URLs</button><button id="clear">Clear All</button><span id="status" class="status"></span></div></section><div class="section-title">ADMIN TOOLS</div><section class="panel"><h2>Tournament Statistics</h2><p class="hint">Reset the accumulated player and match statistics before starting a new tournament. This does not delete your stream URL configuration.</p><button id="resetStats" class="danger">Reset All Stats</button><div id="resetStatus" class="status"></div></section><div class="links"><a href="./stats.html">← Public Stats Dashboard</a><a href="./admin.html">Tournament Admin</a></div><div class="footer">R6 CUSTOM GAME TRACKING • 8 STREAM SOURCES • FIREBASE SYNCED</div></main>';document.querySelector('#save').onclick=save;document.querySelector('#clear').onclick=()=>{document.querySelectorAll('.url').forEach(x=>x.value='');document.querySelectorAll('.enabled').forEach(x=>x.checked=false)};document.querySelector('#resetStats').onclick=resetStats}
function setStatus(t,bad=false){let e=document.querySelector('#status');if(e){e.textContent=t;e.className='status '+(bad?'error':'ok')}}async function save(){let out=[];for(let i=0;i<8;i++){let url=normalize(document.querySelector('.url[data-i="'+i+'"]').value);if(url===null){setStatus('Stream '+(i+1)+' is not a valid Twitch URL.',true);return}let enabled=document.querySelector('.enabled[data-i="'+i+'"]').checked;if(url)out.push({slot:i+1,name:PLAYERS[i].name,aliases:PLAYERS[i].aliases,url,enabled})}try{await setDoc(ref,{streams:out},{merge:true});setStatus('All 8 gamer-tag stream slots saved.')}catch(e){setStatus('Could not save: '+(e.code||e.message),true)}}
async function resetStats(){if(!confirm('RESET ALL TOURNAMENT STATS? This cannot be undone. Stream URLs will be kept.'))return;let e=document.querySelector('#resetStatus');try{let current=(await getDoc(ref)).data()||{};await setDoc(ref,{...current,players:{},playerStats:{},matchStats:{},roundStats:{},events:[],mvpHistory:[],tournamentMVP:null,currentMatch:null,testMode:false,statsResetAt:new Date().toISOString()},{merge:true});e.textContent='All tournament statistics have been reset. Stream URLs were kept.';e.className='status ok'}catch(err){e.textContent='Reset failed: '+(err.code||err.message);e.className='status error'}}
onAuthStateChanged(auth,async u=>{if(!u){login();return}try{let s=await getDoc(ref);if(s.exists())state=s.data()}catch{}render();onSnapshot(ref,s=>{if(s.exists()){state=s.data();render()}})})</script></body></html>
