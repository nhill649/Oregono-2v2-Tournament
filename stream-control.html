<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>R6 Replay Center</title><style>*{box-sizing:border-box}body{margin:0;background:#090d12;color:#fff;font:16px system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}.wrap{max-width:1200px;margin:auto;padding:28px}.accent{color:#55d6c2;font-size:13px;font-weight:800;letter-spacing:.08em}.panel{background:#111820;border:1px solid #2a3743;border-radius:14px;padding:18px;margin:16px 0}.top h1{font-size:38px;margin:8px 0}.sub,.hint,.small,.status{color:#9aa8b5;font-size:13px;line-height:1.5}.section-title{color:#9aa8b5;font-size:13px;font-weight:800;letter-spacing:.08em;margin:28px 0 10px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.match{background:#0d141b;border:1px solid #2a3743;border-radius:10px;padding:16px}.match h3{margin:0 0 5px}.input{width:100%;height:44px;padding:9px 11px;background:#080d12;color:#fff;border:1px solid #3a4855;border-radius:8px;font:inherit;outline:none}.input:focus{border-color:#55d6c2}.file{padding:10px 0;color:#9aa8b5;width:100%}.actions{display:flex;gap:10px;align-items:center;flex-wrap:wrap;margin-top:18px}button{padding:11px 17px;border-radius:8px;border:1px solid #3a4855;background:#0d141b;color:#fff;font-weight:800;cursor:pointer}button.primary{background:#55d6c2;border-color:#55d6c2;color:#07111b}button.danger{background:#2b1117;border-color:#8b3949;color:#ff9aaa}.players{display:grid;grid-template-columns:repeat(2,1fr);gap:10px}.player{display:flex;gap:8px;align-items:center}.num{color:#64727f;width:25px}.links{margin:18px 0}.links a{color:#55d6c2;margin-right:18px;text-decoration:none}.login{max-width:430px;margin:70px auto}.login input{margin:7px 0}.footer{text-align:center;color:#64727f;font-size:12px;margin-top:30px}@media(max-width:700px){.wrap{padding:18px}.grid,.players{grid-template-columns:1fr}.top h1{font-size:30px}}</style></head><body><div id="app"></div><script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';import{getAuth,signInWithEmailAndPassword,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js';import{getFirestore,doc,getDoc,setDoc,onSnapshot}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js';import{firebaseConfig}from'./firebase-config.js';import{PLAYERS}from'./players.js';const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),ref=doc(db,'tournaments','oregano-stats'),appEl=document.querySelector('#app');let state={matches:[],playerList:[]};function login(){appEl.innerHTML='<div class="panel login"><div class="accent">RAINBOW SIX SIEGE • ADMIN</div><h1>R6 Replay Center</h1><p class="hint">Replay and roster management is protected by your Firebase admin login.</p><input id="email" class="input" type="email" placeholder="Email"><input id="password" class="input" type="password" placeholder="Password"><button id="login" class="primary">Log In</button><div id="err" class="status"></div></div>';document.querySelector('#login').onclick=async()=>{try{await signInWithEmailAndPassword(auth,document.querySelector('#email').value.trim(),document.querySelector('#password').value)}catch(e){document.querySelector('#err').textContent='Login failed: '+(e.code||e.message)}}}function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}const slots=[['Winner Semifinal 1',true],['Winner Semifinal 2',true],['Loser Semifinal',true],['Winner Final',true],['Loser Final',true],['First Place Match 1',true],['First Place Match 2',true]];function render(){let players=state.playerList?.length?state.playerList:PLAYERS.map(p=>({name:p.name})),matches=state.matches||[];appEl.innerHTML='<main class="wrap"><header><div class="accent">RAINBOW SIX SIEGE • 2V2 TOURNAMENT</div><h1>R6 Replay Center</h1><div class="sub">TOURNAMENT REPLAYS • PLAYER ROSTER • MATCH ANALYSIS</div></header><div class="section-title">TOURNAMENT PLAYERS • 2 PLAYERS PER TEAM</div><section class="panel"><p class="hint">Enter the 8 gamer tags exactly as they appear in-game. Each team contains exactly two players.</p><div class="players">'+Array.from({length:8},(_,i)=>'<div class="player"><span class="num">'+(i+1)+'</span><input class="input pname" value="'+esc(players[i]?.name||'')+'" placeholder="Gamer tag"></div>').join('')+'</div><div class="actions"><button id="savePlayers" class="primary">Save Gamer Tags</button><span id="playerStatus" class="status"></span></div></section><div class="section-title">PLAYOFF MATCH REPLAYS • FULL STAT TRACKING</div><p class="hint">Pool play is intentionally not shown here because it has no stat tracking. Upload replays only for the playoff matches below. The First Place Match 2 slot is optional and should only be used if a second championship match is necessary.</p><section class="grid">'+slots.map((x,i)=>matchCard(x[0],i,matches[i])).join('')+'</section><div class="section-title">ADMIN TOOLS</div><section class="panel"><button id="resetStats" class="danger">Reset All Tournament Stats</button><span id="resetStatus" class="status"></span></section><div class="links"><a href="./stats.html">← Public Stats Dashboard</a><a href="./admin.html">Tournament Bracket Admin</a></div><div class="footer">R6 CUSTOM GAME TRACKING • 7 PLAYOFF MATCH SLOTS • 2 PLAYERS PER TEAM</div></main>';document.querySelector('#savePlayers').onclick=savePlayers;document.querySelector('#resetStats').onclick=resetStats;document.querySelectorAll('.replay').forEach(e=>e.onchange=()=>{let f=e.files[0],n=document.querySelector('.replayName[data-i="'+e.dataset.i+'"]');if(n)n.textContent=f?f.name:'No replay selected'});document.querySelectorAll('.saveMatch').forEach(b=>b.onclick=()=>saveMatch(+b.dataset.i));document.querySelectorAll('.clearMatch').forEach(b=>b.onclick=()=>clearMatch(+b.dataset.i))}function matchCard(name,i,m){m=m||{};return '<div class="match"><h3>'+name+'</h3><div class="small">Match '+(i+1)+' • FULL STATS • '+(m.status||'Waiting for replay')+'</div><p><input class="input teamA" data-i="'+i+'" value="'+esc(m.teamA||'')+'" placeholder="Team A — Player 1, Player 2"></p><p><input class="input teamB" data-i="'+i+'" value="'+esc(m.teamB||'')+'" placeholder="Team B — Player 1, Player 2"></p><input class="file replay" data-i="'+i+'" type="file" accept="video/*"><div class="small replayName" data-i="'+i+'">'+esc(m.fileName||'No replay selected')+'</div><div class="actions"><button class="saveMatch primary" data-i="'+i+'">Save Match</button><button class="clearMatch" data-i="'+i+'">Clear</button></div></div>'}async function savePlayers(){let list=[...document.querySelectorAll('.pname')].map((e,i)=>({slot:i+1,name:e.value.trim()})).filter(x=>x.name);await setDoc(ref,{playerList:list},{merge:true});document.querySelector('#playerStatus').textContent='Gamer tags saved.'}async function saveMatch(i){let matches=[...(state.matches||[])];while(matches.length<7)matches.push({});let f=document.querySelector('.replay[data-i="'+i+'"]').files[0];matches[i]={...matches[i],match:i+1,name:slots[i][0],teamA:document.querySelector('.teamA[data-i="'+i+'"]').value.trim(),teamB:document.querySelector('.teamB[data-i="'+i+'"]').value.trim(),fileName:f?.name||matches[i].fileName||'',statsEnabled:true,status:f?'Replay ready for full analysis':'Waiting for replay',uploadedAt:f?new Date().toISOString():matches[i].uploadedAt||null};await setDoc(ref,{matches},{merge:true});alert(i===6?'Optional First Place Match 2 saved for analysis.':'Playoff replay saved for analysis.')}async function clearMatch(i){let matches=[...(state.matches||[])];while(matches.length<7)matches.push({});matches[i]={match:i+1,name:slots[i][0],statsEnabled:true,status:'Waiting for replay'};await setDoc(ref,{matches},{merge:true})}async function resetStats(){if(!confirm('RESET ALL TOURNAMENT STATS? Match replay assignments and gamer tags will be kept.'))return;let current=(await getDoc(ref)).data()||{};await setDoc(ref,{...current,players:{},playerStats:{},matchStats:{},roundStats:{},events:[],mvpHistory:[],tournamentMVP:null,currentMVP:null,statsResetAt:new Date().toISOString()},{merge:true});document.querySelector('#resetStatus').textContent='Statistics reset. Replays and gamer tags were kept.'}onAuthStateChanged(auth,async u=>{if(!u){login();return}try{let s=await getDoc(ref);if(s.exists())state=s.data()}catch{}render();onSnapshot(ref,s=>{if(s.exists()){state=s.data();render()}})})</script></body></html>
