<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>R6 Stream Control</title>
<style>
:root{--bg:#080c11;--panel:#121c26;--line:#293847;--text:#f4f6f9;--muted:#91a7c0;--accent:#caff32;--ok:#6dff5e;--danger:#ff687c}
*{box-sizing:border-box}html,body{margin:0;min-height:100%;background:#080c11;color:var(--text);font-family:Inter,system-ui,-apple-system,BlinkMacSystemFont,"Segoe UI",Arial,sans-serif}body{background:radial-gradient(circle at 50% -18%,#15202a 0,#0a0f15 35%,#080c11 70%)}
.wrap{width:min(1100px,calc(100% - 36px));margin:auto;padding:38px 0 70px}.top{display:flex;justify-content:space-between;gap:20px;border-bottom:1px solid #25313e;padding-bottom:24px}.eyebrow{font-size:19px;font-weight:900}.sub{margin-top:9px;color:var(--muted);font-size:13px;letter-spacing:.18em}.live{border:1px solid #344453;border-radius:28px;padding:10px 16px;color:#c7d2de;height:max-content}.dot{display:inline-block;width:8px;height:8px;border-radius:50%;background:var(--ok);margin-right:8px}
.section{margin-top:32px}.section-title{color:var(--muted);letter-spacing:.2em;font-size:13px;margin-bottom:15px}.panel{background:linear-gradient(145deg,#121c26,#0e161e);border:1px solid var(--line);border-radius:16px;padding:24px;box-shadow:0 8px 30px #0003}.hint{color:#8ea3bb;font-size:14px;line-height:1.5;margin:0 0 20px}.grid{display:grid;grid-template-columns:1fr 1fr;gap:14px}.stream{background:#0b1219;border:1px solid #253340;border-radius:12px;padding:18px}.stream h3{margin:0 0 5px;font-size:17px}.stream p{margin:0 0 13px;color:#7f94aa;font-size:12px}.input{width:100%;height:47px;background:#080d12;color:#fff;border:1px solid #3a4a5a;border-radius:10px;padding:0 13px;font:15px system-ui;outline:none}.input:focus{border-color:#7890a7}.check{display:flex;align-items:center;gap:9px;margin-top:12px;color:#b9c8d7;font-size:13px}.check input{accent-color:var(--accent)}.actions{display:flex;align-items:center;gap:12px;flex-wrap:wrap;margin-top:20px}button{border:1px solid #405162;background:#18242f;color:#fff;border-radius:10px;padding:12px 18px;font-weight:800;cursor:pointer}button.primary{background:var(--accent);border-color:var(--accent);color:#0a0e08}button:disabled{opacity:.5;cursor:not-allowed}.status{margin-top:14px;color:#8ea3bb;font-size:13px}.status.ok{color:var(--ok)}.status.error{color:var(--danger)}.login{max-width:430px;margin:70px auto}.login input{margin:7px 0}.login button{margin-top:8px}.links{margin-top:18px}.links a{color:#bcd1e5;margin-right:16px}.footer{color:#60748a;text-align:center;margin-top:30px;font-size:12px}@media(max-width:700px){.grid{grid-template-columns:1fr}.top{display:block}.live{display:inline-block;margin-top:18px}}
</style>
</head>
<body><div id="app"></div>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';
import{getAuth,signInWithEmailAndPassword,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js';
import{getFirestore,doc,getDoc,setDoc,onSnapshot}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js';
import{firebaseConfig}from'./firebase-config.js';
const app=initializeApp(firebaseConfig),auth=getAuth(app),db=getFirestore(app),ref=doc(db,'tournaments','oregano-stats'),appEl=document.querySelector('#app');
let state={streams:[]};
function login(){appEl.innerHTML='<div class="panel login"><h1>R6 Stream Control</h1><p class="hint">Tournament stream management is protected by your Firebase admin login.</p><input id="email" class="input" type="email" placeholder="Email"><input id="password" class="input" type="password" placeholder="Password"><button id="login" class="primary">Log In</button><div id="err" class="status error"></div></div>';document.querySelector('#login').onclick=async()=>{try{await signInWithEmailAndPassword(auth,document.querySelector('#email').value.trim(),document.querySelector('#password').value)}catch(e){document.querySelector('#err').textContent='Login failed: '+(e.code||e.message)}}}
function normalize(url){url=url.trim();if(!url)return'';if(!/^https?:\/\//i.test(url))url='https://'+url;try{const u=new URL(url);if(!u.hostname.includes('twitch.tv'))return null;return u.href}catch{return null}}
function render(){const streams=Array.from({length:8},(_,i)=>state.streams?.[i]||{name:'',url:'',enabled:false});appEl.innerHTML='<main class="wrap"><header class="top"><div><div class="eyebrow">R6 CUSTOM GAME TRACKING</div><div class="sub">STREAM SOURCES • MATCH CONTROL</div></div><div class="live"><span class="dot"></span>LIVE DASHBOARD</div></header><section class="section"><div class="section-title">TWITCH STREAM SOURCES</div><div class="panel"><p class="hint">Add up to <b>8 Twitch sources</b>, one for each tournament player. The analyzer can use any available perspectives, from a single stream up to all 8. More perspectives can improve event verification.</p><div class="grid">'+streams.map((s,i)=>`<div class="stream"><h3>Stream ${i+1}</h3><p>Player perspective ${i+1}</p><input class="input url" data-i="${i}" value="${esc(s.url||'')}" placeholder="https://www.twitch.tv/channel"><input class="input name" data-i="${i}" value="${esc(s.name||'')}" placeholder="Player / streamer name" style="margin-top:9px"><label class="check"><input type="checkbox" class="enabled" data-i="${i}" ${s.enabled?'checked':''}> Available for analysis</label></div>`).join('')+'</div><div class="actions"><button id="save" class="primary">Save Stream URLs</button><button id="clear">Clear All</button><span id="status" class="status"></span></div><div class="links"><a href="./stats.html">← Public Stats Dashboard</a><a href="./admin.html">Tournament Admin</a></div></div></section><div class="footer">R6 CUSTOM GAME TRACKING • 8 stream sources • Firebase synced</div></main>';document.querySelector('#save').onclick=save;document.querySelector('#clear').onclick=()=>{document.querySelectorAll('.url,.name').forEach(x=>x.value='');document.querySelectorAll('.enabled').forEach(x=>x.checked=false)}}
function esc(x){return String(x??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}
async function save(){const out=[];for(let i=0;i<8;i++){const raw=document.querySelector(`.url[data-i="${i}"]`).value;const url=normalize(raw);if(url===null){setStatus('Stream '+(i+1)+' is not a valid Twitch URL.',true);return}const name=document.querySelector(`.name[data-i="${i}"]`).value.trim();const enabled=document.querySelector(`.enabled[data-i="${i}"]`).checked;if(url)out.push({slot:i+1,name,url,enabled})}try{await setDoc(ref,{streams:out},{merge:true});setStatus('8 stream slots saved. The processing service can use any available perspectives.')}catch(e){setStatus('Could not save: '+(e.code||e.message),true)}}
function setStatus(t,bad=false){const e=document.querySelector('#status');if(e){e.textContent=t;e.className='status '+(bad?'error':'ok')}}
onAuthStateChanged(auth,async u=>{if(!u){login();return}try{const s=await getDoc(ref);if(s.exists())state=s.data()}catch{}render();onSnapshot(ref,s=>{if(s.exists()){state=s.data();render()}})})
</script></body></html>
