<style>
body{font:16px system-ui;margin:0;background:radial-gradient(circle at 50% -20%,#17232e 0,#0b1118 35%,#080c11 72%);color:#f4f6f9}.wrap{max-width:1100px;margin:auto;padding:28px}.panel{background:linear-gradient(145deg,#121d28,#0d151e);border:1px solid #293a4a;border-radius:15px;padding:18px;margin:16px 0;box-shadow:0 8px 30px #0003}h1{font-size:38px}.accent{color:#55d6c2;font-size:13px;font-weight:800;letter-spacing:.08em}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.pool-round{margin-top:20px}.pool-round:first-child{margin-top:0}.pool-round h3{margin:0 0 12px;font-size:20px}.match{background:#0d151e;border:1px solid #293a4a;border-radius:10px;padding:14px}.row{display:grid;grid-template-columns:1fr 70px;gap:8px;margin:6px 0;padding:6px;align-items:center}.row.winner-row{font-weight:900}.row.winner-row .team-name{color:#55d6c2}.role-badge{display:inline-block;font-size:11px;padding:4px 6px;border-radius:5px;margin-left:7px;font-weight:900}.role-atk{background:#ff9f43;color:#111}.role-def{background:#4da3ff;color:#07111b}.small,.status{color:#91a7c0;font-size:12px}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #293a4a;text-align:left}th{color:#91a7c0}.bracket-panel{padding:0;background:transparent;border:0;box-shadow:none}.bracket-wrap{overflow:hidden;background:#080c11}.bracket-svg{display:block;width:100%;height:auto}.match input{width:100%;box-sizing:border-box;padding:10px;border-radius:8px;border:1px solid #3a4a5a;background:#0a1118;color:#fff;font:inherit;opacity:1;-webkit-text-fill-color:#fff}.match input:disabled{background:#0a1118;color:#fff;border-color:#3a4a5a;opacity:1;-webkit-text-fill-color:#fff}.teal-accent{position:relative;overflow:visible;background:#111c27!important}.podium-panel{margin-top:16px}.podium-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:end;margin-top:18px}.podium-place{background:#0d151e;border:2px solid #293a4a;border-radius:12px;padding:18px 12px;text-align:center;min-height:105px;display:flex;flex-direction:column;justify-content:flex-end;box-sizing:border-box}.podium-place .rank{font-weight:900;font-size:16px;margin-bottom:10px}.podium-place .podium-team{font-weight:900;font-size:16px;word-break:break-word}.podium-place.first{min-height:170px;border-color:#d4af37}.podium-place.first .rank,.podium-place.first .podium-team{color:#d4af37}.podium-place.second{min-height:145px;border-color:#aeb8c2}.podium-place.second .rank,.podium-place.second .podium-team{color:#aeb8c2}.podium-place.third{min-height:125px;border-color:#cd7f32}.podium-place.third .rank,.podium-place.third .podium-team{color:#cd7f32}.podium-place.fourth{min-height:110px;border-color:#b76e79}.podium-place.fourth .rank,.podium-place.fourth .podium-team{color:#b76e79}.previous-winner{position:absolute;top:0;right:0;width:420px;box-sizing:border-box;border:1px solid #293a4a;border-radius:15px;padding:14px 18px;background:linear-gradient(145deg,#121d28,#0d151e)}.previous-winner-label{font-size:14px;font-weight:800;color:#fff;margin-bottom:8px}.previous-winner-name{font-size:28px;font-weight:900;color:#d4af37}.site-header{position:relative;padding-right:450px}.history-link,.back-link{display:inline-block;margin-top:8px;padding:11px 18px;border-radius:9px;background:#55d6c2;color:#07111b;text-decoration:none;font-weight:900}.history-link:hover,.back-link:hover{background:#6be2d0}.history-entry{display:flex;justify-content:space-between;align-items:center;gap:16px;background:#0d151e;border:1px solid #293a4a;border-radius:12px;padding:16px;margin:12px 0}.history-entry h3{margin:0 0 5px}.view-button{display:inline-block;padding:10px 16px;border-radius:9px;background:#55d6c2;color:#07111b;text-decoration:none;font-weight:900;white-space:nowrap}.history-empty{color:#91a7c0}@media(max-width:800px){.site-header{padding-right:0}.previous-winner{position:static;width:100%;margin-top:18px}.previous-winner-name{font-size:24px}.history-entry{align-items:flex-start;flex-direction:column}.view-button{width:100%;box-sizing:border-box;text-align:center}}@media(max-width:700px){.grid{grid-template-columns:1fr}.wrap{padding:18px}h1{font-size:30px}.podium-grid{grid-template-columns:repeat(2,1fr)}.podium-place.first,.podium-place.second,.podium-place.third,.podium-place.fourth{min-height:120px}}
</style>

<body>
<div id="historyHome" class="wrap"><header class="site-header"><div class="accent">RAINBOW SIX SIEGE • 2V2 TOURNAMENT</div><h1>Oregano 2v2 Tournament History</h1><a class="history-link" href="https://nhill649.github.io/Oregono-2v2-Tournament/">Current Tournament</a></header><section class="panel"><h2>Saved Tournaments</h2><div id="historyList" class="history-empty">Loading tournament history…</div></section></div>
<div id="snapshotView" class="wrap" style="display:none"></div>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';import{getFirestore,collection,onSnapshot}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js';import{firebaseConfig}from'./firebase-config.js';
const db=getFirestore(initializeApp(firebaseConfig)),teams=['Memphis & Sam','Preston & Roman','Eli & Sanath','Nolan & Xavier'];let state={};
const valid=(a,b)=>Number.isInteger(a)&&Number.isInteger(b)&&a>=0&&a<=5&&b>=0&&b<=5,final=(a,b)=>{if(!valid(a,b)||a===b)return 0;let h=Math.max(a,b),l=Math.min(a,b);return[[4,0],[4,1],[4,2],[5,3],[5,4]].some(x=>h===x[0]&&l===x[1])},isF=m=>m&&m.scoreA!=null&&m.scoreB!=null&&final(+m.scoreA,+m.scoreB),win=m=>isF(m)?(+m.scoreA>+m.scoreB?m.a:m.b):null,lose=m=>isF(m)?(+m.scoreA>+m.scoreB?m.b:m.a):null;
function standings(){let M=Object.fromEntries(teams.map(n=>[n,{name:n,w:0,l:0,rd:0,rw:0,rl:0,opp:{}}]));for(let g of state.pool||[]){if(!isF(g))continue;let a=M[g.a],b=M[g.b],x=+g.scoreA,y=+g.scoreB;if(!a||!b)continue;a.rd+=x-y;b.rd+=y-x;a.rw+=x;b.rw+=y;a.rl+=y;b.rl+=x;a.opp[g.b]=1;b.opp[g.a]=1;if(x>y){a.w++;b.l++}else{b.w++;a.l++}}let A=Object.values(M),s=t=>{let o=Object.keys(t.opp),w=0,g=0;for(let n of o){w+=M[n].w;g+=M[n].w+M[n].l}return g?w/g:0};A.sort((a,b)=>s(b)-s(a));let last=null,r=0;A.forEach((t,i)=>{let q=s(t);if(last===null||q!==last)r=i+1;t.sosRank=r;last=q});return A.sort((a,b)=>b.w-a.w||a.l-b.l||b.rd-a.rd||a.sosRank-b.sosRank||b.rw-a.rw||a.rl-b.rl||a.name.localeCompare(b.name))}
function seedMap(){let s=state.seeds?.length===4?state.seeds:standings().map(x=>x.name);return Object.fromEntries(s.map((n,i)=>[n,i+1]))}function sn(n){if(!n||n==='TBD')return'TBD';let s=seedMap()[n];return s?`${s} ${n}`:n}function m(a='TBD',b='TBD'){return{a,b,scoreA:null,scoreB:null,firstTeam:null,firstSide:null}}
function bracket(){let s=state.seeds?.length===4?state.seeds:standings().map(x=>x.name),b=state.bracket||{},same=(o,a,c)=>o&&o.a===a&&o.b===c?o:m(a,c);b.wb1=b.wb1||m(s[0]||'TBD',s[3]||'TBD');b.wb2=b.wb2||m(s[1]||'TBD',s[2]||'TBD');b.wbf=same(b.wbf,win(b.wb1)||'TBD',win(b.wb2)||'TBD');b.lb1=same(b.lb1,lose(b.wb1)||'TBD',lose(b.wb2)||'TBD');b.lb2=same(b.lb2,lose(b.wbf)||'TBD',win(b.lb1)||'TBD');b.fp1=same(b.fp1,win(b.wbf)||'TBD',win(b.lb2)||'TBD');let reset=isF(b.fp1)&&win(b.fp1)===b.fp1.b;b.fp2=reset?same(b.fp2,b.fp1.a,b.fp1.b):m();return b}
function text(x,y,t,size=18,weight=400,anchor='start',fill='#fff'){return`<text x="${x}" y="${y}" font-family="Arial" font-size="${size}" font-weight="${weight}" fill="${fill}" text-anchor="${anchor}">${t}</text>`}function box(x,y,w,h){return`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="5" fill="#101a24" stroke="#293a4a"/><path d="M${x} ${y+h/2}h${w}" stroke="#293a4a"/>`}function role(y,m,t,sx){if(!m?.firstTeam||!t||t==='TBD')return'';let a=m.firstTeam===t,bx=sx-64;return`<rect x="${bx}" y="${y}" width="42" height="28" rx="5" fill="${a?'#ff9f43':'#4da3ff'}"/><text x="${bx+21}" y="${y+19}" font-family="Arial" font-size="12" font-weight="900" fill="${a?'#111':'#07111b'}" text-anchor="middle">${a?'ATK':'DEF'}</text>`}
function drawBracket(svg){let b=bracket(),B=[];B.push(`<rect width="1536" height="1024" fill="#080c11"/><defs><pattern id="d" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.5" fill="#263442"/></pattern></defs><rect width="1536" height="1024" fill="url(#d)"/>`);B.push(text(190,55,'ROUND 1',20,700,'middle','#fff'),text(190,82,'WINNER BRACKET SEMI-FINALS',14,400,'middle','#fff'),text(190,102,'& LOSER BRACKET SEMI-FINALS',14,400,'middle','#fff'),text(615,55,'ROUND 2',20,700,'middle','#fff'),text(615,82,'WINNER BRACKET FINAL',14,400,'middle','#fff'),text(615,102,'& LOSER BRACKET FINAL',14,400,'middle','#fff'),text(1000,55,'ROUND 3',20,700,'middle','#fff'),text(1000,82,'FIRST PLACE MATCH 1',14,400,'middle','#fff'),text(1350,55,'IF NECESSARY',20,700,'middle','#fff'),text(1350,82,'FIRST PLACE MATCH 2',14,400,'middle','#fff'),text(80,145,"Winner's Bracket",18,700,'start','#91a7c0'),text(80,685,"Loser's Bracket",18,700,'start','#91a7c0'));let C=[['wb1',b.wb1,50,165,340,130,70,210,350,210],['wb2',b.wb2,50,410,340,130,70,455,350,455],['lb1',b.lb1,50,730,340,130,70,775,350,775],['wbf',b.wbf,465,290,305,130,485,340,750,340],['lb2',b.lb2,465,730,305,130,485,780,750,780],['fp1',b.fp1,870,365,305,130,890,415,1155,415],['fp2',b.fp2,1220,365,305,130,1240,415,1505,415]];let hasFp2=b.fp2?.a&&b.fp2?.b&&b.fp2.a!=='TBD'&&b.fp2.b!=='TBD';for(let c of C){let[id,q,x,y,w,h,nx,ny,sx,sy]=c,winnerName=win(q),aWin=winnerName===q.a,bWin=winnerName===q.b,nameColor=id==='fp1'&&!hasFp2||id==='fp2'&&hasFp2?'#d4af37':'#55d6c2';B.push(box(x,y,w,h),text(nx,ny,sn(q.a),18,aWin?700:400,'start',aWin?nameColor:'#fff'),text(nx,ny+65,sn(q.b),18,bWin?700:400,'start',bWin?nameColor:'#fff'),text(sx,sy,q.scoreA==null?'TBD':q.scoreA,18,aWin?700:400,'end',aWin?nameColor:'#fff'),text(sx,sy+65,q.scoreB==null?'TBD':q.scoreB,18,bWin?700:400,'end',bWin?nameColor:'#fff'));B.push(role(ny-23,q,q.a,sx),role(ny+42,q,q.b,sx));if(id!=='fp2'&&q.a!=='TBD'&&q.b!=='TBD')B.push(`<path d="M${x+w} ${y+h/2}H${x+w+38}V${id==='wb1'||id==='wb2'?340:id==='lb1'?795:415}H${x+w+38}" fill="none" stroke="#293a4a" stroke-width="2"/>`)}svg.innerHTML=B.join('')}
function renderPool(){let p=state.pool||[];for(let r=1;r<=2;r++){let el=document.querySelector(`#pool-round-${r}`),matches=p.filter(x=>Number(x.round)===r);if(!matches.length&&p.length>=4)matches=p.slice((r-1)*2,r*2);el.innerHTML=matches.map((g,i)=>`<div class="match"><b>Pool Match ${i+1}</b><div class="small">${isF(g)?'FINAL':'PENDING'}</div><div class="row ${win(g)===g.a?'winner-row':''}"><span class="team-name">${g.a} ${g.firstTeam?`<span class="role-badge ${g.firstTeam===g.a?'role-atk':'role-def'}">${g.firstTeam===g.a?'ATK':'DEF'}</span>`:''}</span><input value="${g.scoreA??''}" disabled></div><div class="row ${win(g)===g.b?'winner-row':''}"><span class="team-name">${g.b} ${g.firstTeam?`<span class="role-badge ${g.firstTeam===g.b?'role-atk':'role-def'}">${g.firstTeam===g.b?'ATK':'DEF'}</span>`:''}</span><input value="${g.scoreB??''}" disabled></div></div>`).join('')||'<div class="small">No pool matches saved.</div>'}}
function renderStandings(){document.querySelector('#standings').innerHTML=standings().map((t,i)=>`<tr><td>${i+1}</td><td>${t.name}</td><td>${t.w}-${t.l}</td><td>${t.rd>0?'+':''}${t.rd}</td><td>${t.sosRank}</td><td>${t.rw}</td><td>${t.rl}</td></tr>`).join('')}
function renderPodium(){let b=bracket(),f=b.fp2?.a&&b.fp2?.b?b.fp2:b.fp1,champ=win(f),runner=lose(f);if(!champ)return;let order=[champ,runner,lose(b.lb2),lose(b.lb1)],seen=new Set(),names=order.map(n=>n&&!seen.has(n)?(seen.add(n),n):'TBD');document.querySelector('#viewerPodiumGrid').innerHTML=names.map((n,i)=>`<div class="podium-place ${['first','second','third','fourth'][i]}"><div class="rank">${i+1}</div><div class="podium-team">${n}</div></div>`).join('');document.querySelector('#viewer-podium-panel').style.display='block'}
function showSnapshot(s){state=s;document.querySelector('#historyHome').style.display='none';let root=document.querySelector('#snapshotView');root.style.display='block';root.innerHTML=`<header class="site-header"><div class="accent">RAINBOW SIX SIEGE • 2V2 TOURNAMENT</div><h1>Oregano 2v2 Tournament</h1><p>Completed tournament snapshot</p><div class="previous-winner"><div class="previous-winner-label">Defending Champions</div><div class="previous-winner-name">${state.previousWinner||'Roman & Preston'}</div></div><a class="back-link" href="history.html">Tournament History</a></header><section class="panel"><h2>${s.title||'Oregano 2v2 Tournament'}</h2><div class="small">Saved ${s.savedAt?new Date(s.savedAt).toLocaleString():'—'}</div></section><section class="panel"><h2>Pool Play</h2><div class="pool-round"><h3>Pool Round 1</h3><div id="pool-round-1" class="grid"></div></div><div class="pool-round"><h3>Pool Round 2</h3><div id="pool-round-2" class="grid"></div></div></section><section class="panel"><h2>Pool Standings</h2><div class="tablewrap"><table><thead><tr><th>Seed</th><th>Team</th><th>Record</th><th>Round Diff</th><th>Strength of Schedule</th><th>Rounds Won</th><th>Rounds Lost</th></tr></thead><tbody id="standings"></tbody></table></div></section><section class="panel bracket-panel"><div class="bracket-wrap"><svg id="bracket" class="bracket-svg" viewBox="0 0 1536 1024" xmlns="http://www.w3.org/2000/svg"></svg></div></section><section id="viewer-podium-panel" class="panel podium-panel" style="display:none"><h2>Final Podium</h2><div class="small">Placements from the completed tournament.</div><div id="viewerPodiumGrid" class="podium-grid"></div></section>`;renderPool();renderStandings();drawBracket(document.querySelector('#bracket'));renderPodium();window.scrollTo(0,0)}
function renderList(items){let el=document.querySelector('#historyList');if(!items.length){el.textContent='No tournaments have been saved yet.';return}el.innerHTML=items.map((x,i)=>`<div class="history-entry"><div><h3>${x.title||'Oregano 2v2 Tournament'}</h3><div class="small">Saved ${x.savedAt?new Date(x.savedAt).toLocaleString():'—'}</div></div><a class="view-button" href="#${x.id}">View Tournament</a></div>`).join('');document.querySelectorAll('.view-button').forEach((a,i)=>a.onclick=e=>{e.preventDefault();showSnapshot(items[i])})}
onSnapshot(collection(db,'tournamentHistory'),snap=>{let items=snap.docs.map(d=>({id:d.id,...d.data()})).sort((a,b)=>String(b.savedAt||'').localeCompare(String(a.savedAt||'')));renderList(items);if(location.hash){let found=items.find(x=>x.id===location.hash.slice(1));if(found)showSnapshot(found)}});
</script>
