<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Oregano 2v2 Tournament History</title>
<style>
body{font:16px system-ui;margin:0;background:radial-gradient(circle at 50% -20%,#17232e 0,#0b1118 35%,#080c11 72%);color:#f4f6f9}.wrap{max-width:1100px;margin:auto;padding:28px}.panel{background:linear-gradient(145deg,#121d28,#0d151e);border:1px solid #293a4a;border-radius:15px;padding:18px;margin:16px 0;box-shadow:0 8px 30px #0003}.accent{color:#55d6c2;font-size:13px;font-weight:800;letter-spacing:.08em}h1{font-size:38px;margin:22px 0}.history-link,.back-link,.view-button{display:inline-block;margin-top:8px;padding:11px 18px;border-radius:9px;background:#55d6c2;color:#07111b;text-decoration:none;font-weight:900;border:0;cursor:pointer}.history-link:hover,.back-link:hover,.view-button:hover{background:#6be2d0}.history-entry{display:flex;justify-content:space-between;align-items:center;gap:16px;background:#0d151e;border:1px solid #293a4a;border-radius:12px;padding:16px;margin:12px 0}.history-entry h3{margin:0 0 5px}.small{color:#91a7c0;font-size:12px}.empty{color:#91a7c0}.error{color:#ff8d8d}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.match{background:#0d151e;border:1px solid #293a4a;border-radius:10px;padding:14px}.row{display:grid;grid-template-columns:1fr 70px;gap:8px;margin:6px 0;padding:6px;align-items:center}.winner-row{font-weight:900}.winner-row .team-name{color:#55d6c2}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #293a4a;text-align:left}th{color:#91a7c0}.tablewrap{overflow:auto}.bracket-panel{padding:0;background:transparent;border:0;box-shadow:none}.bracket-wrap{overflow:hidden;background:#080c11}.bracket-svg{display:block;width:100%;height:auto}.podium-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:end;margin-top:18px}.podium-place{background:#0d151e;border:2px solid #293a4a;border-radius:12px;padding:18px 12px;text-align:center;min-height:105px;display:flex;flex-direction:column;justify-content:flex-end;box-sizing:border-box}.rank{font-weight:900;font-size:16px;margin-bottom:10px}.podium-team{font-weight:900;font-size:16px;word-break:break-word}.first{min-height:170px;border-color:#d4af37}.first .rank,.first .podium-team{color:#d4af37}.second{min-height:145px;border-color:#aeb8c2}.second .rank,.second .podium-team{color:#aeb8c2}.third{min-height:125px;border-color:#cd7f32}.third .rank,.third .podium-team{color:#cd7f32}.fourth{min-height:110px;border-color:#b76e79}.fourth .rank,.fourth .podium-team{color:#b76e79}.role-badge{display:inline-block;font-size:11px;padding:4px 6px;border-radius:5px;margin-left:7px;font-weight:900}.role-atk{background:#ff9f43;color:#111}.role-def{background:#4da3ff;color:#07111b}@media(max-width:800px){.wrap{padding:18px}.history-entry{align-items:flex-start;flex-direction:column}.view-button{width:100%;box-sizing:border-box;text-align:center}.podium-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){h1{font-size:30px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="home" class="wrap">
<header><div class="accent">RAINBOW SIX SIEGE • 2V2 TOURNAMENT</div><h1>Oregano 2v2 Tournament History</h1><a class="history-link" href="https://nhill649.github.io/Oregono-2v2-Tournament/">Current Tournament</a></header>
<section class="panel"><h2>Saved Tournaments</h2><div id="list" class="empty">Loading tournament history…</div></section>
</div>
<div id="snapshot" class="wrap" style="display:none"></div>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';import{getFirestore,doc,getDoc}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js';import{firebaseConfig}from'./firebase-config.js';
const db=getFirestore(initializeApp(firebaseConfig));const teams=['Memphis & Sam','Preston & Roman','Eli & Sanath','Nolan & Xavier'];const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));const valid=(a,b)=>Number.isInteger(a)&&Number.isInteger(b)&&a>=0&&a<=5&&b>=0&&b<=5;const finalScore=(a,b)=>{if(!valid(a,b)||a===b)return false;const h=Math.max(a,b),l=Math.min(a,b);return[[4,0],[4,1],[4,2],[5,3],[5,4]].some(x=>h===x[0]&&l===x[1])};const isFinal=m=>!!m&&m.scoreA!=null&&m.scoreB!=null&&finalScore(+m.scoreA,+m.scoreB);const winner=m=>isFinal(m)?(+m.scoreA>+m.scoreB?m.a:m.b):null;const loser=m=>isFinal(m)?(+m.scoreA>+m.scoreB?m.b:m.a):null;
function standings(s){const M=Object.fromEntries(teams.map(n=>[n,{name:n,w:0,l:0,rd:0,rw:0,rl:0,opp:{}}]));for(const g of s.pool||[]){if(!isFinal(g))continue;const a=M[g.a],b=M[g.b],x=+g.scoreA,y=+g.scoreB;if(!a||!b)continue;a.rd+=x-y;b.rd+=y-x;a.rw+=x;b.rw+=y;a.rl+=y;b.rl+=x;a.opp[g.b]=1;b.opp[g.a]=1;if(x>y){a.w++;b.l++}else{b.w++;a.l++}}const A=Object.values(M);A.sort((a,b)=>b.w-a.w||a.l-b.l||b.rd-a.rd||b.rw-a.rw||a.rl-b.rl||a.name.localeCompare(b.name));return A}
function seedMap(s){const seeds=s.seeds?.length===4?s.seeds:standings(s).map(x=>x.name);return Object.fromEntries(seeds.map((n,i)=>[n,i+1]))}function sn(s,n){if(!n||n==='TBD')return'TBD';let seed=seedMap(s)[n];if(!s.poolComplete)return seed?`${seed} Seed`:'Seed';return seed?`${seed} ${esc(n)}`:esc(n)}function m(a='TBD',b='TBD'){return{a,b,scoreA:null,scoreB:null,firstTeam:null,firstSide:null}}
function bracket(s){let seeds=s.seeds?.length===4?s.seeds:standings(s).map(x=>x.name),b={...(s.bracket||{})},same=(o,a,c)=>o&&o.a===a&&o.b===c?o:m(a,c);b.wb1=b.wb1||m(seeds[0]||'TBD',seeds[3]||'TBD');b.wb2=b.wb2||m(seeds[1]||'TBD',seeds[2]||'TBD');b.wbf=same(b.wbf,winner(b.wb1)||'TBD',winner(b.wb2)||'TBD');b.lb1=same(b.lb1,loser(b.wb1)||'TBD',loser(b.wb2)||'TBD');b.lb2=same(b.lb2,loser(b.wbf)||'TBD',winner(b.lb1)||'TBD');b.fp1=same(b.fp1,winner(b.wbf)||'TBD',winner(b.lb2)||'TBD');let reset=isFinal(b.fp1)&&winner(b.fp1)===b.fp1.b;b.fp2=reset?same(b.fp2,b.fp1.a,b.fp1.b):m();return b}
function text(x,y,t,size=18,weight=400,anchor='start',fill='#fff'){return`<text x="${x}" y="${y}" font-family="Arial" font-size="${size}" font-weight="${weight}" fill="${fill}" text-anchor="${anchor}">${t}</text>`}function box(x,y,w,h){return`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="5" fill="#101a24" stroke="#293a4a"/><path d="M${x} ${y+h/2}h${w}" stroke="#293a4a"/>`}function role(x,y,m,t,sx){if(!m?.firstTeam||!t||t==='TBD')return'';let a=m.firstTeam===t,bx=sx-64;return`<rect x="${bx}" y="${y}" width="42" height="28" rx="5" fill="${a?'#ff9f43':'#4da3ff'}"/><text x="${bx+21}" y="${y+19}" font-family="Arial" font-size="12" font-weight="900" fill="${a?'#111':'#07111b'}" text-anchor="middle">${a?'ATK':'DEF'}</text>`}
function bracketSVG(s){let b=bracket(s),B=[];B.push(`<svg class="bracket-svg" viewBox="0 0 1536 1024" xmlns="http://www.w3.org/2000/svg"><rect width="1536" height="1024" fill="#080c11"/><defs><pattern id="historyDots" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.5" fill="#263442"/></pattern></defs><rect width="1536" height="1024" fill="url(#historyDots)"/>`);B.push(text(190,55,'ROUND 1',20,700,'middle','#fff'),text(190,82,'WINNER BRACKET SEMI-FINALS',14,400,'middle','#fff'),text(190,102,'& LOSER BRACKET SEMI-FINALS',14,400,'middle','#fff'),text(615,55,'ROUND 2',20,700,'middle','#fff'),text(615,82,'WINNER BRACKET FINAL',14,400,'middle','#fff'),text(615,102,'& LOSER BRACKET FINAL',14,400,'middle','#fff'),text(1000,55,'ROUND 3',20,700,'middle','#fff'),text(1000,82,'FIRST PLACE MATCH 1',14,400,'middle','#fff'),text(1350,55,'IF NECESSARY',20,700,'middle','#fff'),text(1350,82,'FIRST PLACE MATCH 2',14,400,'middle','#fff'),text(80,145,"Winner's Bracket",18,700,'start','#91a7c0'),text(80,685,"Loser's Bracket",18,700,'start','#91a7c0'));let C=[['wb1',b.wb1,50,165,340,130,70,210,350,210],['wb2',b.wb2,50,410,340,130,70,455,350,455],['lb1',b.lb1,50,730,340,130,70,775,350,775],['wbf',b.wbf,465,290,305,130,485,340,750,340],['lb2',b.lb2,465,730,305,130,485,780,750,780],['fp1',b.fp1,870,365,305,130,890,415,1155,415],['fp2',b.fp2,1220,365,305,130,1240,415,1505,415]];let hasFp2=b.fp2?.a&&b.fp2?.b&&b.fp2.a!=='TBD'&&b.fp2.b!=='TBD';for(let c of C){let[id,q,x,y,w,h,nx,ny,sx,sy]=c,winnerName=winner(q),aWin=winnerName===q.a,bWin=winnerName===q.b,nameColor=id==='fp1'&&!hasFp2||id==='fp2'&&hasFp2?'#d4af37':'#55d6c2';B.push(box(x,y,w,h),text(nx,ny,sn(s,q.a),18,aWin?700:400,'start',aWin?nameColor:'#fff'),text(nx,ny+65,sn(s,q.b),18,bWin?700:400,'start',bWin?nameColor:'#fff'),text(sx,sy,q.scoreA==null?'TBD':q.scoreA,18,aWin?700:400,'end',aWin?nameColor:'#fff'),text(sx,sy+65,q.scoreB==null?'TBD':q.scoreB,18,bWin?700:400,'end',bWin?nameColor:'#fff'));B.push(role(0,ny-23,q,q.a,sx),role(0,ny+42,q,q.b,sx));if(id!=='fp2'&&q.a!=='TBD'&&q.b!=='TBD')B.push(`<path d="M${x+w} ${y+h/2}H${x+w+38}V${id==='wb1'||id==='wb2'?340:id==='lb1'?795:id==='wbf'?415:id==='lb2'?415:415}H${x+w+38}" fill="none" stroke="#293a4a" stroke-width="2"/>`)}return B.join('')+'</svg>'}
function pool(s){return`<section class="panel"><h2>Pool Play</h2><div class="grid">${(s.pool||[]).map((m,i)=>`<div class="match"><b>Pool Match ${i+1}</b><div class="small">${isFinal(m)?'FINAL':'PENDING'}</div><div class="row ${winner(m)===m.a?'winner-row':''}"><span class="team-name">${esc(m.a)}</span><strong>${m.scoreA??'—'}</strong></div><div class="row ${winner(m)===m.b?'winner-row':''}"><span class="team-name">${esc(m.b)}</span><strong>${m.scoreB??'—'}</strong></div></div>`).join('')}</div></section>`}
function table(s){return`<section class="panel"><h2>Pool Standings</h2><div class="tablewrap"><table><thead><tr><th>Seed</th><th>Team</th><th>Record</th><th>Round Diff</th><th>Strength of Schedule</th><th>Rounds Won</th><th>Rounds Lost</th></tr></thead><tbody>${standings(s).map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.name)}</td><td>${x.w}-${x.l}</td><td>${x.rd>=0?'+':''}${x.rd}</td><td>—</td><td class="${x.w>0?'winner-stat':''}">${x.rw}</td><td>${x.rl}</td></tr>`).join('')}</tbody></table></div></section>`}
function podium(s){let b=bracket(s),f=isFinal(b.fp2)?b.fp2:isFinal(b.fp1)?b.fp1:null;if(!f)return'';let first=winner(f),second=loser(f),names=standings(s).map(x=>x.name),third=names.find(x=>x!==first&&x!==second)||'TBD',fourth=names.find(x=>x!==first&&x!==second&&x!==third)||'TBD';return`<section class="panel"><h2>Final Podium</h2><div class="podium-grid"><div class="podium-place first"><div class="rank">1ST</div><div class="podium-team">${esc(first)}</div></div><div class="podium-place second"><div class="rank">2ND</div><div class="podium-team">${esc(second)}</div></div><div class="podium-place third"><div class="rank">3RD</div><div class="podium-team">${esc(third)}</div></div><div class="podium-place fourth"><div class="rank">4TH</div><div class="podium-team">${esc(fourth)}</div></div></div></section>`}
function show(e){const s=e.state||e;document.getElementById('home').style.display='none';const v=document.getElementById('snapshot');v.style.display='block';v.innerHTML=`<a class="back-link" href="history.html">← Tournament History</a><div class="accent" style="margin-top:20px">RAINBOW SIX SIEGE • 2V2 TOURNAMENT</div><h1>${esc(e.title||'Oregano 2v2 Tournament')}</h1>${pool(s)}${table(s)}<section class="panel bracket-panel"><div class="bracket-wrap">${bracketSVG(s)}</div></section>${podium(s)}`}
async function load(){const list=document.getElementById('list');try{const snap=await getDoc(doc(db,'tournaments','oregano-2v2'));if(!snap.exists()){list.textContent='No saved tournaments yet.';return}const data=snap.data()||{};const entries=Array.isArray(data.history)?data.history.filter(x=>x&&x.state):[];if(!entries.length){list.textContent='No saved tournaments yet. Complete a tournament and use Save Current Tournament to History.';return}entries.sort((a,b)=>String(b.savedAt||'').localeCompare(String(a.savedAt||'')));list.innerHTML=entries.map((e,i)=>`<div class="history-entry"><div><h3>${esc(e.title||'Oregano 2v2 Tournament')}</h3><div class="small">${e.savedAt?new Date(e.savedAt).toLocaleString():'Saved tournament'}</div></div><button class="view-button" data-i="${i}">View Tournament</button></div>`).join('');document.querySelectorAll('.view-button').forEach(btn=>btn.onclick=()=>show(entries[+btn.dataset.i]))}catch(err){console.error(err);list.innerHTML=`<span class="error">Unable to load tournament history. ${esc(err?.code||err?.message||'Please refresh the page.')}</span>`}}
load();
</script>
</body>
</html>
