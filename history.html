<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Oregano 2v2 Tournament History</title>
<style>
body{font:16px system-ui;margin:0;background:radial-gradient(circle at 50% -20%,#17232e 0,#0b1118 35%,#080c11 72%);color:#f4f6f9}.wrap{max-width:1100px;margin:auto;padding:28px}.panel{background:linear-gradient(145deg,#121d28,#0d151e);border:1px solid #293a4a;border-radius:15px;padding:18px;margin:16px 0;box-shadow:0 8px 30px #0003}.accent{color:#55d6c2;font-size:13px;font-weight:800;letter-spacing:.08em}h1{font-size:38px;margin:22px 0}.history-link,.back-link,.view-button{display:inline-block;margin-top:8px;padding:11px 18px;border-radius:9px;background:#55d6c2;color:#07111b;text-decoration:none;font-weight:900;border:0;cursor:pointer}.history-link:hover,.back-link:hover,.view-button:hover{background:#6be2d0}.history-entry{display:flex;justify-content:space-between;align-items:center;gap:16px;background:#0d151e;border:1px solid #293a4a;border-radius:12px;padding:16px;margin:12px 0}.history-entry h3{margin:0 0 5px}.small{color:#91a7c0;font-size:12px}.empty{color:#91a7c0}.error{color:#ff8d8d}.grid{display:grid;grid-template-columns:repeat(2,minmax(0,1fr));gap:12px}.pool-round{margin-top:20px}.pool-round:first-child{margin-top:0}.pool-round h3{margin:0 0 12px;font-size:20px}.match{background:#0d151e;border:1px solid #293a4a;border-radius:10px;padding:14px}.row{display:grid;grid-template-columns:minmax(0,1fr) 70px;gap:8px;margin:6px 0;padding:6px;align-items:center}.row input{width:100%;box-sizing:border-box;padding:10px;border-radius:8px;border:1px solid #3a4a5a;background:#0a1118;color:#fff;font:inherit}.winner-row{font-weight:900}.winner-row .team-name{color:#55d6c2}.pending{color:#91a7c0}.final{color:#55d6c2;font-weight:800}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse;min-width:600px}th,td{padding:9px;border-bottom:1px solid #293a4a;text-align:left}th{color:#91a7c0}.bracket-panel{padding:0;background:transparent;border:0;box-shadow:none}.bracket-wrap{overflow:auto;background:#080c11;border-radius:10px}.bracket-svg{display:block;width:100%;height:auto;min-width:900px}.role-badge{display:inline-block;font-size:11px;padding:4px 6px;border-radius:5px;margin-left:7px;font-weight:900}.role-atk{background:#ff9f43;color:#111}.role-def{background:#4da3ff;color:#07111b}@media(max-width:800px){.wrap{padding:18px}.history-entry{align-items:flex-start;flex-direction:column}.view-button{width:100%;box-sizing:border-box;text-align:center}}@media(max-width:700px){h1{font-size:30px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="home" class="wrap"><header><div class="accent">RAINBOW SIX SIEGE • 2V2 TOURNAMENT</div><h1>Oregano 2v2 Tournament History</h1><a class="history-link" href="https://nhill649.github.io/Oregono-2v2-Tournament/">Current Tournament</a></header><section class="panel"><h2>Saved Tournaments</h2><div id="list" class="empty">Loading tournament history…</div></section></div>
<div id="snapshot" class="wrap" style="display:none"></div>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';import{getFirestore,doc,getDoc}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js';import{firebaseConfig}from'./firebase-config.js';
const db=getFirestore(initializeApp(firebaseConfig)),teams=['Memphis & Sam','Preston & Roman','Eli & Sanath','Nolan & Xavier'];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const valid=(a,b)=>Number.isInteger(a)&&Number.isInteger(b)&&a>=0&&a<=5&&b>=0&&b<=5;
const finalScore=(a,b)=>{if(!valid(a,b)||a===b)return false;const h=Math.max(a,b),l=Math.min(a,b);return[[4,0],[4,1],[4,2],[5,3],[5,4]].some(x=>h===x[0]&&l===x[1])};
const isFinal=m=>!!m&&m.scoreA!=null&&m.scoreB!=null&&finalScore(+m.scoreA,+m.scoreB),winner=m=>isFinal(m)?(+m.scoreA>+m.scoreB?m.a:m.b):null,loser=m=>isFinal(m)?(+m.scoreA>+m.scoreB?m.b:m.a):null;
function poolMatches(s){const p=Array.isArray(s?.pool)?s.pool:[];return p.slice(0,4).map((g,i)=>({...g,round:Number(g.round)===1||Number(g.round)===2?Number(g.round):(i<2?1:2)}))}
function standings(s){const M=Object.fromEntries(teams.map(n=>[n,{name:n,w:0,l:0,rd:0,rw:0,rl:0}]));for(const g of poolMatches(s)){if(!isFinal(g))continue;const a=M[g.a],b=M[g.b],x=+g.scoreA,y=+g.scoreB;if(!a||!b)continue;a.rd+=x-y;b.rd+=y-x;a.rw+=x;b.rw+=y;a.rl+=y;b.rl+=x;if(x>y){a.w++;b.l++}else{b.w++;a.l++}}return Object.values(M).sort((a,b)=>b.w-a.w||a.l-b.l||b.rd-a.rd||b.rw-a.rw||a.rl-b.rl||a.name.localeCompare(b.name))}
function role(g,t){if(!g.firstTeam)return'';return`<span class="role-badge ${g.firstTeam===t?'role-atk':'role-def'}">${g.firstTeam===t?'ATK':'DEF'}</span>`}
function poolCard(g,label){const a=g.a||'TBD',b=g.b||'TBD',w=winner(g),done=isFinal(g);return`<div class="match"><b>${label}</b><div class="small ${done?'final':'pending'}">${done?'FINAL':'PENDING'}</div><div class="row ${w===a?'winner-row':''}"><span class="team-name">${esc(a)} ${role(g,a)}</span><input value="${g.scoreA??''}" disabled></div><div class="row ${w===b?'winner-row':''}"><span class="team-name">${esc(b)} ${role(g,b)}</span><input value="${g.scoreB??''}" disabled></div></div>`}
function poolSection(s){const p=poolMatches(s),r1=p.filter(g=>g.round===1),r2=p.filter(g=>g.round===2);return`<section class="panel"><h2>Pool Play</h2><div class="pool-round"><h3>Round 1</h3><div class="grid">${r1.length?r1.map((g,i)=>poolCard(g,`Pool Match ${i+1}`)).join(''):'<div class="small">No Round 1 matches were saved.</div>'}</div></div><div class="pool-round"><h3>Round 2</h3><div class="grid">${r2.length?r2.map((g,i)=>poolCard(g,`Pool Match ${i+3}`)).join(''):'<div class="small">No Round 2 matches were saved.</div>'}</div></div></section>`}
function standingsSection(s){return`<section class="panel"><h2>Pool Standings</h2><div class="tablewrap"><table><thead><tr><th>Seed</th><th>Team</th><th>Record</th><th>Round Diff</th><th>Rounds Won</th><th>Rounds Lost</th></tr></thead><tbody>${standings(s).map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.name)}</td><td>${x.w}-${x.l}</td><td>${x.rd>=0?'+':''}${x.rd}</td><td>${x.rw}</td><td>${x.rl}</td></tr>`).join('')}</tbody></table></div></section>`}
function seedMap(s){const seeds=s.seeds?.length===4?s.seeds:standings(s).map(x=>x.name);return Object.fromEntries(seeds.map((n,i)=>[n,i+1]))}function displayTeam(s,n){if(!n||n==='TBD')return'TBD';const seed=seedMap(s)[n];return seed?`#${seed} ${esc(n)}`:esc(n)}function blank(a='TBD',b='TBD'){return{a,b,scoreA:null,scoreB:null,firstTeam:null,firstSide:null}}
function bracket(s){const seeds=s.seeds?.length===4?s.seeds:standings(s).map(x=>x.name),b={...(s.bracket||{})},same=(o,a,c)=>o&&o.a===a&&o.b===c?o:blank(a,c);b.wb1=b.wb1||blank(seeds[0]||'TBD',seeds[3]||'TBD');b.wb2=b.wb2||blank(seeds[1]||'TBD',seeds[2]||'TBD');b.wbf=same(b.wbf,winner(b.wb1)||'TBD',winner(b.wb2)||'TBD');b.lb1=same(b.lb1,loser(b.wb1)||'TBD',loser(b.wb2)||'TBD');b.lb2=same(b.lb2,loser(b.wbf)||'TBD',winner(b.lb1)||'TBD');b.fp1=same(b.fp1,winner(b.wbf)||'TBD',winner(b.lb2)||'TBD');const reset=isFinal(b.fp1)&&winner(b.fp1)===b.fp1.b;b.fp2=reset?same(b.fp2,b.fp1.a,b.fp1.b):blank();return b}
function bracketSVG(s){const b=bracket(s),B=[];const txt=(x,y,t,size=17,weight=400,anchor='start',fill='#fff')=>`<text x="${x}" y="${y}" font-family="Arial" font-size="${size}" font-weight="${weight}" fill="${fill}" text-anchor="${anchor}">${t}</text>`;const box=(x,y,w,h)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="5" fill="#101a24" stroke="#293a4a"/><path d="M${x} ${y+h/2}h${w}" stroke="#293a4a"/>`;B.push(`<svg class="bracket-svg" viewBox="0 0 1536 1024" xmlns="http://www.w3.org/2000/svg"><rect width="1536" height="1024" fill="#080c11"/>`,txt(190,55,'ROUND 1',20,700,'middle'),txt(615,55,'ROUND 2',20,700,'middle'),txt(1000,55,'ROUND 3',20,700,'middle'),txt(1350,55,'IF NECESSARY',20,700,'middle'),txt(80,125,"Winner's Bracket",18,700,'start','#91a7c0'),txt(80,675,"Loser's Bracket",18,700,'start','#91a7c0'));
 const C=[['wb1',b.wb1,50,165,340,130,70,210,350,210],['wb2',b.wb2,50,410,340,130,70,455,350,455],['lb1',b.lb1,50,720,340,130,70,765,350,765],['wbf',b.wbf,465,290,305,130,485,340,750,340],['lb2',b.lb2,465,720,305,130,485,770,750,770],['fp1',b.fp1,870,365,305,130,890,415,1155,415],['fp2',b.fp2,1220,365,305,130,1240,415,1505,415]];
 for(const [id,q,x,y,w,h,nx,ny,sx,sy] of C){const wa=winner(q),ca=wa===q.a,cb=wa===q.b;B.push(box(x,y,w,h),txt(nx,ny,displayTeam(s,q.a),17,ca?700:400,'start',ca?'#55d6c2':'#fff'),txt(nx,ny+65,displayTeam(s,q.b),17,cb?700:400,'start',cb?'#55d6c2':'#fff'),txt(sx,sy,q.scoreA==null?'TBD':q.scoreA,17,ca?700:400,'end',ca?'#55d6c2':'#fff'),txt(sx,sy+65,q.scoreB==null?'TBD':q.scoreB,17,cb?700:400,'end',cb?'#55d6c2':'#fff'))}
 B.push(`<path d="M390 230H430V355H465M390 475H430V355H465M390 785H430V785H465M770 355H815V430H870M770 785H815V430H870M1175 430H1220" fill="none" stroke="#293a4a" stroke-width="2"/>`);return B.join('')+'</svg>'}
function snapshot(s){document.querySelector('#home').style.display='none';const el=document.querySelector('#snapshot');el.style.display='block';const title=esc(s.__title||'Saved Tournament');el.innerHTML=`<header><div class="accent">RAINBOW SIX SIEGE • SAVED TOURNAMENT</div><h1>${title}</h1><a class="back-link" href="./">← Back to History</a></header>${poolSection(s)}${standingsSection(s)}<section class="panel bracket-panel"><h2>Double Elimination</h2><div class="bracket-wrap">${bracketSVG(s)}</div></section>`}
async function load(){try{const snap=await getDoc(doc(db,'tournaments','oregano-2v2'));if(!snap.exists()){document.querySelector('#list').textContent='No tournament history found.';return}const data=snap.data(),history=Array.isArray(data.history)?data.history:[];if(!history.length){document.querySelector('#list').textContent='No saved tournaments yet.';return}document.querySelector('#list').innerHTML=history.slice().reverse().map((h,i)=>`<div class="history-entry"><div><h3>${esc(h.title||'Saved Tournament')}</h3><div class="small">Saved ${esc(h.savedAt?new Date(h.savedAt).toLocaleString():'Unknown date')}</div></div><button class="view-button" data-history="${i}">View Tournament</button></div>`).join('');document.querySelectorAll('[data-history]').forEach(btn=>btn.onclick=()=>{const e=history.slice().reverse()[Number(btn.dataset.history)],s={...(e?.state||{})};s.__title=e?.title||'Saved Tournament';snapshot(s)})}catch(e){console.error(e);document.querySelector('#list').innerHTML='<p class="error">Could not load tournament history.</p>'}}
load();
</script>
</body>
</html>
