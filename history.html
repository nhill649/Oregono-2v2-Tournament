<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Oregano 2v2 Tournament History</title>
<style>
body{font:16px system-ui;margin:0;background:radial-gradient(circle at 50% -20%,#17232e 0,#0b1118 35%,#080c11 72%);color:#f4f6f9}.wrap{max-width:1100px;margin:auto;padding:28px}.panel{background:linear-gradient(145deg,#121d28,#0d151e);border:1px solid #293a4a;border-radius:15px;padding:18px;margin:16px 0;box-shadow:0 8px 30px #0003}.accent{color:#55d6c2;font-size:13px;font-weight:800;letter-spacing:.08em}h1{font-size:38px;margin:22px 0}.history-link,.back-link,.view-button{display:inline-block;margin-top:8px;padding:11px 18px;border-radius:9px;background:#55d6c2;color:#07111b;text-decoration:none;font-weight:900;border:0;cursor:pointer}.history-link:hover,.back-link:hover,.view-button:hover{background:#6be2d0}.history-entry{display:flex;justify-content:space-between;align-items:center;gap:16px;background:#0d151e;border:1px solid #293a4a;border-radius:12px;padding:16px;margin:12px 0}.history-entry h3{margin:0 0 5px}.small{color:#91a7c0;font-size:12px}.empty{color:#91a7c0}.error{color:#ff8d8d}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.match{background:#0d151e;border:1px solid #293a4a;border-radius:10px;padding:14px}.row{display:grid;grid-template-columns:1fr 70px;gap:8px;margin:6px 0;padding:6px;align-items:center}.winner-row{font-weight:900}.winner-row .team-name{color:#55d6c2}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #293a4a;text-align:left}th{color:#91a7c0}.tablewrap{overflow:auto}.bracket-wrap{overflow:auto;background:#080c11;border-radius:12px}.bracket-svg{display:block;width:100%;min-width:900px;height:auto}.podium-grid{display:grid;grid-template-columns:repeat(4,1fr);gap:14px;align-items:end;margin-top:18px}.podium-place{background:#0d151e;border:2px solid #293a4a;border-radius:12px;padding:18px 12px;text-align:center;min-height:105px;display:flex;flex-direction:column;justify-content:flex-end;box-sizing:border-box}.rank{font-weight:900;font-size:16px;margin-bottom:10px}.podium-team{font-weight:900;font-size:16px;word-break:break-word}.first{min-height:170px;border-color:#d4af37}.first .rank,.first .podium-team{color:#d4af37}.second{min-height:145px;border-color:#aeb8c2}.second .rank,.second .podium-team{color:#aeb8c2}.third{min-height:125px;border-color:#cd7f32}.third .rank,.third .podium-team{color:#cd7f32}.fourth{min-height:110px;border-color:#b76e79}.fourth .rank,.fourth .podium-team{color:#b76e79}.role-badge{display:inline-block;font-size:11px;padding:4px 6px;border-radius:5px;margin-left:7px;font-weight:900}.role-atk{background:#ff9f43;color:#111}.role-def{background:#4da3ff;color:#07111b}@media(max-width:800px){.wrap{padding:18px}.history-entry{align-items:flex-start;flex-direction:column}.view-button{width:100%;box-sizing:border-box;text-align:center}.podium-grid{grid-template-columns:repeat(2,1fr)}}@media(max-width:700px){h1{font-size:30px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="home" class="wrap">
<header><div class="accent">RAINBOW SIX SIEGE • 2V2 TOURNAMENT</div><h1>Oregano 2v2 Tournament History</h1><a class="history-link" href="https://nhill649.github.io/Oregono-2v2-Tournament/">Current Tournament</a></header>
<section class="panel"><h2>Saved Tournaments</h2><div id="list" class="empty">Loading tournament history…</div></section>
</div>
<div id="snapshot" class="wrap" style="display:none"></div>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';
import{getFirestore,doc,getDoc}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js';
import{firebaseConfig}from'./firebase-config.js';
const db=getFirestore(initializeApp(firebaseConfig));
const teams=['Memphis & Sam','Preston & Roman','Eli & Sanath','Nolan & Xavier'];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const valid=(a,b)=>Number.isInteger(a)&&Number.isInteger(b)&&a>=0&&a<=5&&b>=0&&b<=5;
const finalScore=(a,b)=>{if(!valid(a,b)||a===b)return false;const h=Math.max(a,b),l=Math.min(a,b);return[[4,0],[4,1],[4,2],[5,3],[5,4]].some(x=>h===x[0]&&l===x[1])};
const isFinal=m=>!!m&&m.scoreA!=null&&m.scoreB!=null&&finalScore(+m.scoreA,+m.scoreB);
const winner=m=>isFinal(m)?(+m.scoreA>+m.scoreB?m.a:m.b):null;
const loser=m=>isFinal(m)?(+m.scoreA>+m.scoreB?m.b:m.a):null;
function standings(s){const M=Object.fromEntries(teams.map(n=>[n,{name:n,w:0,l:0,rd:0,rw:0,rl:0,opp:{}}]));for(const g of s.pool||[]){if(!isFinal(g))continue;const a=M[g.a],b=M[g.b],x=+g.scoreA,y=+g.scoreB;if(!a||!b)continue;a.rd+=x-y;b.rd+=y-x;a.rw+=x;b.rw+=y;a.rl+=y;b.rl+=x;a.opp[g.b]=1;b.opp[g.a]=1;if(x>y){a.w++;b.l++}else{b.w++;a.l++}}const A=Object.values(M);A.sort((a,b)=>b.w-a.w||a.l-b.l||b.rd-a.rd||b.rw-a.rw||a.rl-b.rl||a.name.localeCompare(b.name));return A}
function seedMap(s){const seeds=s.seeds?.length===4?s.seeds:standings(s).map(x=>x.name);return Object.fromEntries(seeds.map((n,i)=>[n,i+1]))}
function team(s,n){if(!n||n==='TBD')return'TBD';const q=seedMap(s)[n];return q?`#${q} ${esc(n)}`:esc(n)}
function role(m,n){if(!m?.firstTeam||!n||n==='TBD')return'';const atk=m.firstTeam===n;return`<span class="role-badge ${atk?'role-atk':'role-def'}">${atk?'ATK':'DEF'}</span>`}
function pool(s){return`<section class="panel"><h2>Pool Play</h2><div class="grid">${(s.pool||[]).map((m,i)=>`<div class="match"><b>Pool Match ${i+1}</b><div class="small">${isFinal(m)?'FINAL':'PENDING'}</div><div class="row ${winner(m)===m.a?'winner-row':''}"><span class="team-name">${esc(m.a)}${role(m,m.a)}</span><strong>${m.scoreA??'—'}</strong></div><div class="row ${winner(m)===m.b?'winner-row':''}"><span class="team-name">${esc(m.b)}${role(m,m.b)}</span><strong>${m.scoreB??'—'}</strong></div></div>`).join('')}</div></section>`}
function table(s){return`<section class="panel"><h2>Pool Standings</h2><div class="tablewrap"><table><thead><tr><th>Seed</th><th>Team</th><th>Record</th><th>Round Diff</th><th>Strength of Schedule</th><th>Rounds Won</th><th>Rounds Lost</th></tr></thead><tbody>${standings(s).map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.name)}</td><td>${x.w}-${x.l}</td><td>${x.rd>=0?'+':''}${x.rd}</td><td>—</td><td>${x.rw}</td><td>${x.rl}</td></tr>`).join('')}</tbody></table></div></section>`}
function blank(a='TBD',b='TBD'){return{a,b,scoreA:null,scoreB:null,firstTeam:null}}
function bracket(s){const b=s.bracket||{},seeds=s.seeds?.length===4?s.seeds:standings(s).map(x=>x.name);b.wb1=b.wb1||blank(seeds[0]||'TBD',seeds[3]||'TBD');b.wb2=b.wb2||blank(seeds[1]||'TBD',seeds[2]||'TBD');const next=(o,a,c)=>o&&o.a===a&&o.b===c?o:blank(a,c);b.wbf=next(b.wbf,winner(b.wb1)||'TBD',winner(b.wb2)||'TBD');b.lb1=next(b.lb1,loser(b.wb1)||'TBD',loser(b.wb2)||'TBD');b.lb2=next(b.lb2,loser(b.wbf)||'TBD',winner(b.lb1)||'TBD');b.fp1=next(b.fp1,winner(b.wbf)||'TBD',winner(b.lb2)||'TBD');b.fp2=isFinal(b.fp1)&&winner(b.fp1)===b.fp1.b?next(b.fp2,b.fp1.a,b.fp1.b):blank();return b}
function bracketSVG(s){const b=bracket(s);const cells=[['wb1',b.wb1,40,100,'Winners Semi-Final 1'],['wb2',b.wb2,40,300,'Winners Semi-Final 2'],['lb1',b.lb1,400,520,'Losers Round 1'],['wbf',b.wbf,400,200,'Winners Final'],['lb2',b.lb2,760,520,'Losers Round 2'],['fp1',b.fp1,760,360,'Grand Final'],['fp2',b.fp2,1120,360,'Reset Final']];let o=[`<svg class="bracket-svg" viewBox="0 0 1460 850" xmlns="http://www.w3.org/2000/svg"><rect width="1460" height="850" fill="#080c11"/><text x="190" y="45" fill="#fff" font-size="20" font-weight="700" text-anchor="middle">ROUND 1</text><text x="550" y="45" fill="#fff" font-size="20" font-weight="700" text-anchor="middle">ROUND 2</text><text x="910" y="45" fill="#fff" font-size="20" font-weight="700" text-anchor="middle">ROUND 3</text><text x="1270" y="45" fill="#fff" font-size="20" font-weight="700" text-anchor="middle">IF NECESSARY</text>`];const line=d=>o.push(`<path d=\"${d}\" fill=\"none\" stroke=\"#293a4a\" stroke-width=\"3\" stroke-linecap=\"round\" stroke-linejoin=\"round\"/>`);line('M340 160H370V260H400');line('M340 360H370V260H400');line('M340 220H350V580H40');line('M340 420H350V580H40');line('M700 260H730V580H700');line('M340 580H400');line('M700 260H730V420H760');line('M700 580H730V420H760');line('M1060 420H1120');
for(const [id,m,x,y,label] of cells){const wa=winner(m)===m.a,wb=winner(m)===m.b;o.push(`<text x="${x}" y="${y-12}" fill="#91a7c0" font-size="12">${label}</text><rect x="${x}" y="${y}" width="300" height="120" rx="8" fill="#101a24" stroke="#293a4a"/><path d="M${x} ${y+60}h300" stroke="#293a4a"/><text x="${x+14}" y="${y+36}" fill="${wa?'#55d6c2':'#fff'}" font-size="16" font-weight="${wa?900:400}">${team(s,m.a)}</text><text x="${x+286}" y="${y+36}" fill="${wa?'#55d6c2':'#fff'}" font-size="16" text-anchor="end">${m.scoreA??'TBD'}</text><text x="${x+14}" y="${y+96}" fill="${wb?'#55d6c2':'#fff'}" font-size="16" font-weight="${wb?900:400}">${team(s,m.b)}</text><text x="${x+286}" y="${y+96}" fill="${wb?'#55d6c2':'#fff'}" font-size="16" text-anchor="end">${m.scoreB??'TBD'}</text>`);if(id!=='fp2')o.push(`<path d="M${x+300} ${y+60}H${x+340}" stroke="#293a4a" stroke-width="2"/>`)}return o.join('')+'</svg>'}
function podium(s){const b=bracket(s),f=isFinal(b.fp2)?b.fp2:isFinal(b.fp1)?b.fp1:null;if(!f)return'';const first=winner(f),second=loser(f),names=standings(s).map(x=>x.name),third=names.find(x=>x!==first&&x!==second)||'TBD',fourth=names.find(x=>x!==first&&x!==second&&x!==third)||'TBD';return`<section class="panel"><h2>Final Podium</h2><div class="podium-grid"><div class="podium-place first"><div class="rank">1ST</div><div class="podium-team">${esc(first)}</div></div><div class="podium-place second"><div class="rank">2ND</div><div class="podium-team">${esc(second)}</div></div><div class="podium-place third"><div class="rank">3RD</div><div class="podium-team">${esc(third)}</div></div><div class="podium-place fourth"><div class="rank">4TH</div><div class="podium-team">${esc(fourth)}</div></div></div></section>`}
function show(e){const s=e.state||e;document.getElementById('home').style.display='none';const v=document.getElementById('snapshot');v.style.display='block';v.innerHTML=`<a class="back-link" href="history.html">← Tournament History</a><div class="accent" style="margin-top:20px">RAINBOW SIX SIEGE • 2V2 TOURNAMENT</div><h1>${esc(e.title||'Oregano 2v2 Tournament')}</h1>${pool(s)}${table(s)}<section class="panel"><h2>Double-Elimination Bracket</h2><div class="bracket-wrap">${bracketSVG(s)}</div></section>${podium(s)}`}
async function load(){const list=document.getElementById('list');try{const snap=await getDoc(doc(db,'tournaments','oregano-2v2'));if(!snap.exists()){list.textContent='No saved tournaments yet.';return}const data=snap.data()||{};const entries=Array.isArray(data.history)?data.history.filter(x=>x&&x.state):[];if(!entries.length){list.textContent='No saved tournaments yet. Complete a tournament and use Save Current Tournament to History.';return}entries.sort((a,b)=>String(b.savedAt||'').localeCompare(String(a.savedAt||'')));list.innerHTML=entries.map((e,i)=>`<div class="history-entry"><div><h3>${esc(e.title||'Oregano 2v2 Tournament')}</h3><div class="small">${e.savedAt?new Date(e.savedAt).toLocaleString():'Saved tournament'}</div></div><button class="view-button" data-i="${i}">View Tournament</button></div>`).join('');document.querySelectorAll('.view-button').forEach(btn=>btn.onclick=()=>show(entries[+btn.dataset.i]))}catch(err){console.error(err);list.innerHTML=`<span class="error">Unable to load tournament history. ${esc(err?.code||err?.message||'Please refresh the page.')}</span>`}}
load();
</script>
</body>
</html>
