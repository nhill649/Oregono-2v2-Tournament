<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1">
<title>Oregano 2v2 Tournament History</title>
<style>
body{font:16px system-ui;margin:0;background:radial-gradient(circle at 50% -20%,#17232e 0,#0b1118 35%,#080c11 72%);color:#f4f6f9}.wrap{max-width:1100px;margin:auto;padding:28px}.panel{background:linear-gradient(145deg,#121d28,#0d151e);border:1px solid #293a4a;border-radius:15px;padding:18px;margin:16px 0;box-shadow:0 8px 30px #0003}.accent{color:#55d6c2;font-size:13px;font-weight:800;letter-spacing:.08em}h1{font-size:38px;margin:22px 0}.history-link,.back-link,.view-button{display:inline-block;margin-top:8px;padding:11px 18px;border-radius:9px;background:#55d6c2;color:#07111b;text-decoration:none;font-weight:900;border:0;cursor:pointer}.history-link:hover,.back-link:hover,.view-button:hover{background:#6be2d0}.history-entry{display:flex;justify-content:space-between;align-items:center;gap:16px;background:#0d151e;border:1px solid #293a4a;border-radius:12px;padding:16px;margin:12px 0}.history-entry h3{margin:0 0 5px}.small{color:#91a7c0;font-size:12px}.empty{color:#91a7c0}.error{color:#ff8d8d}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.pool-round{margin-top:20px}.pool-round:first-child{margin-top:0}.pool-round h3{margin:0 0 12px;font-size:20px}.match{background:#0d151e;border:1px solid #293a4a;border-radius:10px;padding:14px}.row{display:grid;grid-template-columns:1fr 70px;gap:8px;margin:6px 0;padding:6px;align-items:center}.row input{width:100%;box-sizing:border-box;padding:10px;border-radius:8px;border:1px solid #3a4a5a;background:#0a1118;color:#fff;font:inherit}.winner-row{font-weight:900}.winner-row .team-name{color:#55d6c2}.pending{color:#91a7c0}.final{color:#55d6c2;font-weight:800}.tablewrap{overflow:auto}table{width:100%;border-collapse:collapse}th,td{padding:9px;border-bottom:1px solid #293a4a;text-align:left}th{color:#91a7c0}.bracket-panel{padding:0;background:transparent;border:0;box-shadow:none}.bracket-wrap{overflow:hidden;background:#080c11}.bracket-svg{display:block;width:100%;height:auto}.role-badge{display:inline-block;font-size:11px;padding:4px 6px;border-radius:5px;margin-left:7px;font-weight:900}.role-atk{background:#ff9f43;color:#111}.role-def{background:#4da3ff;color:#07111b}@media(max-width:800px){.wrap{padding:18px}.history-entry{align-items:flex-start;flex-direction:column}.view-button{width:100%;box-sizing:border-box;text-align:center}}@media(max-width:700px){h1{font-size:30px}.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="home" class="wrap"><header><div class="accent">RAINBOW SIX SIEGE • 2V2 TOURNAMENT</div><h1>Oregano 2v2 Tournament History</h1><a class="history-link" href="https://nhill649.github.io/Oregono-2v2-Tournament/">Current Tournament</a></header><section class="panel"><h2>Saved Tournaments</h2><div id="list" class="empty">Loading tournament history…</div></section></div>
<div id="snapshot" class="wrap" style="display:none"></div>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';import{getFirestore,doc,getDoc}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js';import{firebaseConfig}from'./firebase-config.js';
const db=getFirestore(initializeApp(firebaseConfig)),teams=['Memphis & Sam','Preston & Roman','Eli & Sanath','Nolan & Xavier'];
const esc=v=>String(v??'').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]));
const valid=(a,b)=>Number.isInteger(a)&&Number.isInteger(b)&&a>=0&&a<=5&&b>=0&&b<=5;const finalScore=(a,b)=>{if(!valid(a,b)||a===b)return false;const h=Math.max(a,b),l=Math.min(a,b);return[[4,0],[4,1],[4,2],[5,3],[5,4]].some(x=>h===x[0]&&l===x[1])};const isFinal=m=>m&&m.scoreA!=null&&m.scoreB!=null&&finalScore(+m.scoreA,+m.scoreB);const winner=m=>isFinal(m)?(+m.scoreA>+m.scoreB?m.a:m.b):null;const loser=m=>isFinal(m)?(+m.scoreA>+m.scoreB?m.b:m.a):null;
function poolMatches(s){const p=Array.isArray(s?.pool)?s.pool:[];return p.slice(0,4).map((g,i)=>({...g,round:Number(g.round)===1||Number(g.round)===2?Number(g.round):(i<2?1:2)}))}
function standings(s){let M=Object.fromEntries(teams.map(n=>[n,{name:n,w:0,l:0,rd:0,rw:0,rl:0,opp:{}}]));for(const g of poolMatches(s)){if(!isFinal(g))continue;const a=M[g.a],b=M[g.b],x=+g.scoreA,y=+g.scoreB;if(!a||!b)continue;a.rd+=x-y;b.rd+=y-x;a.rw+=x;b.rw+=y;a.rl+=y;b.rl+=x;a.opp[g.b]=1;b.opp[g.a]=1;if(x>y){a.w++;b.l++}else{b.w++;a.l++}}let A=Object.values(M);const sos=t=>{const o=Object.keys(t.opp);let w=0,g=0;for(const n of o){w+=M[n].w;g+=M[n].w+M[n].l}return g?w/g:0};A.forEach(t=>t.sos=sos(t));[...A].sort((a,b)=>b.sos-a.sos||a.name.localeCompare(b.name)).forEach((t,i)=>t.sosRank=i+1);const h2h=(a,b)=>{if(!a.opp[b.name])return 0;for(const g of poolMatches(s)){if(!isFinal(g))continue;if(g.a===a.name&&g.b===b.name)return +g.scoreA>+g.scoreB?1:-1;if(g.a===b.name&&g.b===a.name)return +g.scoreB>+g.scoreA?1:-1}return 0};return A.sort((a,b)=>{if(b.w!==a.w)return b.w-a.w;if(b.l!==a.l)return a.l-b.l;const hh=h2h(a,b);if(hh)return hh>0?-1:1;if(a.sosRank!==b.sosRank)return a.sosRank-b.sosRank;if(b.rd!==a.rd)return b.rd-a.rd;return b.rw-a.rw||a.rl-b.rl||a.name.localeCompare(b.name)})}
function role(g,t){if(!g.firstTeam)return'';return`<span class="role-badge ${g.firstTeam===t?'role-atk':'role-def'}">${g.firstTeam===t?'ATK':'DEF'}</span>`}
function poolCard(g,label){const a=g.a||'TBD',b=g.b||'TBD',w=winner(g),done=isFinal(g);return`<div class="match"><b>${label}</b><div class="small ${done?'final':'pending'}">${done?'FINAL':'PENDING'}</div><div class="row ${w===a?'winner-row':''}"><span class="team-name">${esc(a)} ${role(g,a)}</span><input value="${g.scoreA??''}" disabled></div><div class="row ${w===b?'winner-row':''}"><span class="team-name">${esc(b)} ${role(g,b)}</span><input value="${g.scoreB??''}" disabled></div></div>`}
function poolSection(s){const p=poolMatches(s),r1=p.filter(g=>g.round===1),r2=p.filter(g=>g.round===2);return`<section class="panel"><h2>Pool Play</h2><div class="pool-round"><h3>Pool Round 1</h3><div class="grid">${r1.length?r1.map((g,i)=>poolCard(g,`Pool Match ${i+1}`)).join(''):'<div class="small">No Round 1 matches were saved.</div>'}</div></div><div class="pool-round"><h3>Pool Round 2</h3><div class="grid">${r2.length?r2.map((g,i)=>poolCard(g,`Pool Match ${i+3}`)).join(''):'<div class="small">No Round 2 matches were saved.</div>'}</div></div></section>`}
function standingsSection(s){return`<section class="panel"><h2>Pool Standings</h2><div class="tablewrap"><table><thead><tr><th>Seed</th><th>Team</th><th>Record</th><th>Round Diff</th><th>Strength of Schedule</th><th>Rounds Won</th><th>Rounds Lost</th></tr></thead><tbody>${standings(s).map((x,i)=>`<tr><td>${i+1}</td><td>${esc(x.name)}</td><td>${x.w}-${x.l}</td><td>${x.rd>0?'+':''}${x.rd}</td><td>${x.sosRank}</td><td>${x.rw}</td><td>${x.rl}</td></tr>`).join('')}</tbody></table></div></section>`}
function seedMap(s){const seeds=s.seeds?.length===4?s.seeds:standings(s).map(x=>x.name);return Object.fromEntries(seeds.map((n,i)=>[n,i+1]))}function sn(s,n){if(!n||n==='TBD')return'TBD';const seed=seedMap(s)[n];if(!s.poolComplete)return seed?`${seed} Seed`:'Seed';return seed?`${seed} ${esc(n)}`:esc(n)}function m(a='TBD',b='TBD'){return{a,b,scoreA:null,scoreB:null,firstTeam:null,firstSide:null}}
function bracket(s){const seeds=s.seeds?.length===4?s.seeds:standings(s).map(x=>x.name),b={...(s.bracket||{})},same=(o,a,c)=>o&&o.a===a&&o.b===c?o:m(a,c);b.wb1=b.wb1||m(seeds[0]||'TBD',seeds[3]||'TBD');b.wb2=b.wb2||m(seeds[1]||'TBD',seeds[2]||'TBD');b.wbf=same(b.wbf,winner(b.wb1)||'TBD',winner(b.wb2)||'TBD');b.lb1=same(b.lb1,loser(b.wb1)||'TBD',loser(b.wb2)||'TBD');b.lb2=same(b.lb2,loser(b.wbf)||'TBD',winner(b.lb1)||'TBD');b.fp1=same(b.fp1,winner(b.wbf)||'TBD',winner(b.lb2)||'TBD');const reset=isFinal(b.fp1)&&winner(b.fp1)===b.fp1.b;b.fp2=reset?same(b.fp2,b.fp1.a,b.fp1.b):m();return b}
function bracketSVG(s){const b=bracket(s),B=[];const text=(x,y,t,size=18,weight=400,anchor='start',fill='#fff')=>`<text x="${x}" y="${y}" font-family="Arial" font-size="${size}" font-weight="${weight}" fill="${fill}" text-anchor="${anchor}">${t}</text>`;const box=(x,y,w,h)=>`<rect x="${x}" y="${y}" width="${w}" height="${h}" rx="5" fill="#101a24" stroke="#293a4a"/><path d="M${x} ${y+h/2}h${w}" stroke="#293a4a"/>`;const roleSvg=(x,y,q,t,sx)=>{if(!q?.firstTeam||!t||t==='TBD')return'';const a=q.firstTeam===t,bx=sx-64;return`<rect x="${bx}" y="${y}" width="42" height="28" rx="5" fill="${a?'#ff9f43':'#4da3ff'}"/><text x="${bx+21}" y="${y+19}" font-family="Arial" font-size="12" font-weight="900" fill="${a?'#111':'#07111b'}" text-anchor="middle">${a?'ATK':'DEF'}</text>`};B.push(`<rect width="1536" height="1024" fill="#080c11"/><defs><pattern id="d" width="20" height="20" patternUnits="userSpaceOnUse"><circle cx="2" cy="2" r="1.5" fill="#263442"/></pattern></defs><rect width="1536" height="1024" fill="url(#d)"/>`);B.push(text(190,55,'ROUND 1',20,700,'middle','#fff'),text(190,82,'WINNER BRACKET SEMI-FINALS',14,400,'middle','#fff'),text(190,102,'& LOSER BRACKET SEMI-FINALS',14,400,'middle','#fff'),text(615,55,'ROUND 2',20,700,'middle','#fff'),text(615,82,'WINNER BRACKET FINAL',14,400,'middle','#fff'),text(615,102,'& LOSER BRACKET FINAL',14,400,'middle','#fff'),text(1000,55,'ROUND 3',20,700,'middle','#fff'),text(1000,82,'FIRST PLACE MATCH 1',14,400,'middle','#fff'),text(1350,55,'IF NECESSARY',20,700,'middle','#fff'),text(1350,82,'FIRST PLACE MATCH 2',14,400,'middle','#fff'),text(80,145,"Winner's Bracket",18,700,'start','#91a7c0'),text(80,685,"Loser's Bracket",18,700,'start','#91a7c0'));let C=[['wb1',b.wb1,50,165,340,130,70,210,350,210],['wb2',b.wb2,50,410,340,130,70,455,350,455],['lb1',b.lb1,50,730,340,130,70,775,350,775],['wbf',b.wbf,465,290,305,130,485,340,750,340],['lb2',b.lb2,465,730,305,130,485,780,750,780],['fp1',b.fp1,870,365,305,130,890,415,1155,415],['fp2',b.fp2,1220,365,305,130,1240,415,1505,415]];let hasFp2=b.fp2?.a&&b.fp2?.b&&b.fp2.a!=='TBD'&&b.fp2.b!=='TBD';for(let c of C){let[id,q,x,y,w,h,nx,ny,sx,sy]=c,winnerName=winner(q),aWin=winnerName===q.a,bWin=winnerName===q.b,nameColor=id==='fp1'&&!hasFp2||id==='fp2'&&hasFp2?'#d4af37':'#55d6c2';B.push(box(x,y,w,h),text(nx,ny,sn(s,q.a),18,aWin?700:400,'start',aWin?nameColor:'#fff'),text(nx,ny+65,sn(s,q.b),18,bWin?700:400,'start',bWin?nameColor:'#fff'),text(sx,sy,q.scoreA==null?'TBD':q.scoreA,18,aWin?700:400,'end',aWin?nameColor:'#fff'),text(sx,sy+65,q.scoreB==null?'TBD':q.scoreB,18,bWin?700:400,'end',bWin?nameColor:'#fff'));B.push(roleSvg(0,ny-23,q,q.a,sx),roleSvg(0,ny+42,q,q.b,sx));if(id==='wb1'||id==='wb2'){let targetY=355;B.push(`<path d="M${x+w} ${y+h/2}H${x+w+38}V${targetY}H465" fill="none" stroke="#293a4a" stroke-width="2"/>`)}else if(id==='lb1'){B.push(`<path d="M${x+w} ${y+h/2}H465" fill="none" stroke="#293a4a" stroke-width="2"/>`)}else if(id==='wbf'){B.push(`<path d="M${x+w} ${y+h/2}H${x+w+50}V430H870" fill="none" stroke="#293a4a" stroke-width="2"/>`)}else if(id==='lb2'){B.push(`<path d="M${x+w} ${y+h/2}H${x+w+50}V430H870" fill="none" stroke="#293a4a" stroke-width="2"/>`)}else if(id==='fp1'){B.push(`<path d="M${x+w} ${y+h/2}H1220" fill="none" stroke="#293a4a" stroke-width="2"/>`)}}return`<svg class="bracket-svg" viewBox="0 0 1536 1024" xmlns="http://www.w3.org/2000/svg">${B.join('')}</svg>`}
function snapshot(s){document.querySelector('#home').style.display='none';const el=document.querySelector('#snapshot');el.style.display='block';const title=esc(s.__title||'Saved Tournament');el.innerHTML=`<header><div class="accent">RAINBOW SIX SIEGE • 2V2 TOURNAMENT</div><h1>Oregano 2v2 Tournament</h1><p>Saved tournament: ${title}</p><a class="back-link" href="./">← Back to History</a></header>${poolSection(s)}${standingsSection(s)}<section class="panel bracket-panel"><div class="bracket-wrap">${bracketSVG(s)}</div></section>`}
async function load(){try{const snap=await getDoc(doc(db,'tournaments','oregano-2v2'));if(!snap.exists()){document.querySelector('#list').textContent='No tournament history found.';return}const data=snap.data(),history=Array.isArray(data.history)?data.history:[];if(!history.length){document.querySelector('#list').textContent='No saved tournaments yet.';return}document.querySelector('#list').innerHTML=history.slice().reverse().map((h,i)=>`<div class="history-entry"><div><h3>${esc(h.title||'Saved Tournament')}</h3><div class="small">Saved ${esc(h.savedAt?new Date(h.savedAt).toLocaleString():'Unknown date')}</div></div><button class="view-button" data-history="${i}">View Tournament</button></div>`).join('');document.querySelectorAll('[data-history]').forEach(btn=>btn.onclick=()=>{const e=history.slice().reverse()[Number(btn.dataset.history)],s={...(e?.state||{})};s.__title=e?.title||'Saved Tournament';snapshot(s)})}catch(e){console.error(e);document.querySelector('#list').innerHTML='<p class="error">Could not load tournament history.</p>'}}
load();
</script>
</body>
</html>
