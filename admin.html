<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Oregano 2v2 Tournament Scorer</title>
  <style>
    /* ==================== BASE ==================== */
    body { font: 16px system-ui; margin: 0; background: #090d12; color: #fff; }
    .wrap { max-width: 1100px; margin: auto; padding: 28px; }
    section, .login { background: #111820; border: 1px solid #2a3743; border-radius: 14px; padding: 18px; margin: 16px 0; }
    button, input, select { padding: 10px; border-radius: 8px; border: 1px solid #3a4855; }
    button { background: #55d6c2; font-weight: 800; cursor: pointer; }
    button.danger { background: #ff6b6b; color: #111; }
    input, select { background: #080d12; color: white; }
    .login { max-width: 430px; margin: 60px auto; }
    .login input { width: calc(100% - 22px); margin: 6px 0; }
    .error { color: #ff8d8d; margin-top: 8px; }
    .grid { display: grid; grid-template-columns: repeat(2, 1fr); gap: 12px; }
    .match { background: #0d141b; border: 1px solid #2a3743; border-radius: 10px; padding: 14px; }
    .row { display: grid; grid-template-columns: 1fr 70px; gap: 8px; margin: 6px 0; padding: 6px; border-radius: 8px; align-items: center; }
    .row.winner-row { font-weight: 900; }
    #pool .row.winner-row span.team-name { color: #55d6c2; font-weight: 900; }
    .small, .status { color: #9aa8b5; font-size: 12px; }
    .status { margin-top: 4px; }
    .actions { display: flex; gap: 8px; flex-wrap: wrap; }
    .role-select { width: 100%; margin-top: 10px; }
    .role-badge { display: inline-block; font-size: 11px; line-height: 1; padding: 4px 6px; border-radius: 5px; margin-left: 7px; font-weight: 900; vertical-align: middle; }
    .role-atk { background: #ff9f43; color: #111; }
    .role-def { background: #4da3ff; color: #07111b; }
    table { width: 100%; border-collapse: collapse; }
    th, td { text-align: left; padding: 9px; border-bottom: 1px solid #2a3743; }
    th:nth-child(n + 4), td:nth-child(n + 4) { text-align: center; }
    .previous-winner-control, .team-name-control, .map-pool-control { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
    .previous-winner-control input, .team-name-control input, .map-pool-control input { flex: 1; min-width: 180px; }
    .save-status { color: #55d6c2; font-size: 13px; margin-top: 8px; }
    .history-save { background: #55d6c2; color: #07111b; }
    .history-admin-entry { display: flex; justify-content: space-between; align-items: center; gap: 12px; padding: 12px; margin: 8px 0; background: #0d141b; border: 1px solid #2a3743; border-radius: 10px; }
    .history-admin-entry .history-meta { flex: 1; }
    .history-delete { background: #ff6b6b; color: #111; }
    .map-label { color: #55d6c2; font-weight: 800; margin-top: 8px; }
    @media (max-width: 700px) { .grid { grid-template-columns: 1fr; } }
    @media (max-width: 600px) { .history-admin-entry { align-items: flex-start; flex-direction: column; } .history-delete { width: 100%; } .team-name-control, .map-pool-control { display: grid; grid-template-columns: 1fr; } }
  </style>
</head>
<body>
  <div id="app"></div>

  <script type="module">
    /* ================================================================
       IMPORTS / FIREBASE
       ================================================================ */
    import { initializeApp } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js";
    import { getAuth, signInWithEmailAndPassword, signOut, onAuthStateChanged } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js";
    import { getFirestore, doc, setDoc, onSnapshot, arrayUnion, arrayRemove } from "https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js";

    let cfg;
    try { cfg = (await import("./firebase-config.js")).firebaseConfig; } catch (e) {}

    const appEl = document.querySelector("#app");
    if (!cfg) {
      appEl.innerHTML = '<div class="wrap"><section><h1>Firebase setup required</h1><p>Add firebase-config.js and deploy.</p></section></div>';
    } else {
      const app = initializeApp(cfg);
      const auth = getAuth(app);
      const db = getFirestore(app);
      const ref = doc(db, "tournaments", "oregano-2v2");

      /* ================================================================
         TOURNAMENT CONFIGURATION
         Edit these values for simple tournament-wide changes.
         ================================================================ */
      const DEFAULT_TEAMS = ["Memphis & Sam", "Preston & Roman", "Eli & Sanath", "Nolan & Xavier"];
      const DEFAULT_MAPS = ["Map 1", "Map 2", "Map 3"];
      const DEFAULT_CHAMPION = "Roman & Preston";
      const BRACKET_MATCH_KEYS = ["wb1", "wb2", "wbf", "lb1", "lb2", "fp1", "fp2"];

      let teams = [...DEFAULT_TEAMS];
      let state = {
        pool: [], poolComplete: false, bracket: null, seeds: null,
        bracketHidden: false, podiumHidden: true,
        previousWinner: DEFAULT_CHAMPION,
        teamNames: [...teams], mapPool: [...DEFAULT_MAPS], pendingBracketMaps: []
      };

      /* ================================================================
         GENERIC HELPERS
         ================================================================ */
      const shuffle = (items) => [...items].sort(() => Math.random() - 0.5);
      const scoreValid = (a, b) => Number.isInteger(a) && Number.isInteger(b) && a >= 0 && a <= 5 && b >= 0 && b <= 5;
      const finalScore = (a, b) => {
        if (!scoreValid(a, b) || a === b) return false;
        const hi = Math.max(a, b), lo = Math.min(a, b);
        return [[4, 0], [4, 1], [4, 2], [5, 3], [5, 4]].some(([h, l]) => hi === h && lo === l);
      };
      const isFinal = (m) => !!m && m.scoreA != null && m.scoreB != null && finalScore(+m.scoreA, +m.scoreB);
      const winner = (m) => isFinal(m) ? (+m.scoreA > +m.scoreB ? m.a : m.b) : null;
      const loser = (m) => isFinal(m) ? (+m.scoreA > +m.scoreB ? m.b : m.a) : null;
      const blankMatch = (a = "TBD", b = "TBD") => ({ a, b, scoreA: null, scoreB: null, firstTeam: null, firstSide: null, map: null });

      function syncTeams() {
        if (Array.isArray(state.teamNames) && state.teamNames.length === 4) {
          teams = state.teamNames.map((x, i) => String(x || `Team ${i + 1}`).trim() || `Team ${i + 1}`);
        } else state.teamNames = [...teams];
      }

      function syncMaps() {
        if (!Array.isArray(state.mapPool) || state.mapPool.length !== 3) state.mapPool = [...DEFAULT_MAPS];
        state.mapPool = state.mapPool.map((x, i) => String(x || `Map ${i + 1}`).trim() || `Map ${i + 1}`);
        if (!Array.isArray(state.pendingBracketMaps)) state.pendingBracketMaps = [];
      }

      /* ================================================================
         MAP ASSIGNMENT
         This is intentionally kept in one place so map behavior is easy
         to change later.
         ================================================================ */
      function randomizeMaps() {
        syncMaps();
        if (!state.mapPool.length) return;

        const maps = shuffle(state.mapPool);
        let index = 0;

        // Assign maps to every existing pool match.
        for (const match of state.pool || []) {
          match.map = maps[index % maps.length];
          index++;
        }

        // Prepare maps for all seven bracket matches.
        state.pendingBracketMaps = BRACKET_MATCH_KEYS.map((_, i) => maps[(index + i) % maps.length]);

        // If a bracket already exists, update it immediately too.
        if (state.bracket) {
          BRACKET_MATCH_KEYS.forEach((key, i) => {
            if (state.bracket[key]) state.bracket[key].map = state.pendingBracketMaps[i];
          });
        }
      }

      function autoPoolChoice(match) {
        if (!match || !match.a || !match.b || match.a === "TBD" || match.b === "TBD" || match.firstTeam) return false;
        match.firstTeam = Math.random() < 0.5 ? match.a : match.b;
        match.firstSide = "Attack";
        return true;
      }

      function ensurePoolChoices() {
        let changed = false;
        for (const match of state.pool || []) if (autoPoolChoice(match)) changed = true;
        return changed;
      }

      /* ================================================================
         LOGIN
         ================================================================ */
      function login() {
        appEl.innerHTML = '<div class="login"><h1>🎮 Oregano 2v2 Tournament Scorer</h1><p class="small">Scoring access requires an email and password.</p><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="loginBtn">Log In</button><p id="err" class="error"></p><p><a href="./" style="color:#55d6c2">← Public Viewer</a></p></div>';
        document.querySelector("#loginBtn").onclick = async () => {
          const email = document.querySelector("#email").value.trim();
          const password = document.querySelector("#password").value;
          if (!email || !password) { document.querySelector("#err").textContent = "Enter both email and password."; return; }
          try { await signInWithEmailAndPassword(auth, email, password); }
          catch (e) { document.querySelector("#err").textContent = "Login failed: " + (e?.code || e?.message || "unknown error").replace("auth/", "").replaceAll("-", " "); }
        };
      }

      /* ================================================================
         POOL RANDOMIZER
         ================================================================ */
      function draw() {
        const shuffledTeams = shuffle(teams);
        const round1 = [[shuffledTeams[0], shuffledTeams[1]], [shuffledTeams[2], shuffledTeams[3]]];
        const round2 = Math.random() < 0.5
          ? [[shuffledTeams[0], shuffledTeams[2]], [shuffledTeams[1], shuffledTeams[3]]]
          : [[shuffledTeams[0], shuffledTeams[3]], [shuffledTeams[1], shuffledTeams[2]]];
        const pairs = [...round1, ...round2];

        const pool = pairs.map((pair, i) => {
          const match = { id: `P${i + 1}`, round: i < 2 ? 1 : 2, a: pair[0], b: pair[1], scoreA: null, scoreB: null, firstTeam: null, firstSide: null, map: null };
          autoPoolChoice(match);
          return match;
        });

        // Build the complete new tournament state first, then assign maps to
        // both pool play and all seven bracket matches before it is saved.
        const nextState = {
          pool, poolComplete: false, bracket: null, seeds: null,
          bracketHidden: false, podiumHidden: true,
          previousWinner: state.previousWinner || DEFAULT_CHAMPION,
          teamNames: [...teams], mapPool: [...state.mapPool], pendingBracketMaps: []
        };
        state = nextState;
        randomizeMaps();
        return state;
      }

      /* ================================================================
         FIRESTORE / HISTORY
         ================================================================ */
      async function save() { await setDoc(ref, state); }

      async function saveHistory() {
        const b = state.bracket || {};
        const finalMatch = isFinal(b.fp2) ? b.fp2 : isFinal(b.fp1) ? b.fp1 : null;
        if (!state.poolComplete || !finalMatch) { alert("Finish the tournament before saving it to History."); return; }
        const champion = winner(finalMatch) || "Completed Tournament";
        if (!confirm("Save this current tournament to the History page?")) return;
        const snapshot = { ...state, teamNames: [...teams], mapPool: [...state.mapPool] };
        const id = String(Date.now());
        try {
          await setDoc(ref, { history: arrayUnion({ id, title: `Oregano 2v2 Tournament — ${champion}`, savedAt: new Date().toISOString(), state: snapshot }) }, { merge: true });
          alert("Current tournament saved to History ✓");
        } catch (e) { console.error(e); alert("Could not save the tournament to History. " + (e?.message || e)); }
      }

      async function deleteHistoryEntry(entry) {
        if (!entry || !confirm(`Delete "${entry.title || "Saved Tournament"}" from Tournament History? This cannot be undone.`)) return;
        try { await setDoc(ref, { history: arrayRemove(entry) }, { merge: true }); alert("Tournament deleted from History ✓"); }
        catch (e) { console.error(e); alert("Could not delete the tournament from History. " + (e?.message || e)); }
      }

      /* ================================================================
         STANDINGS / BRACKET
         ================================================================ */
      function standings() {
        const M = Object.fromEntries(teams.map(name => [name, { name, w: 0, l: 0, rd: 0, rw: 0, rl: 0, opp: {} }]));
        for (const game of state.pool || []) {
          if (!finalScore(+game.scoreA, +game.scoreB)) continue;
          const a = M[game.a], b = M[game.b], x = +game.scoreA, y = +game.scoreB;
          if (!a || !b) continue;
          a.rd += x - y; b.rd += y - x; a.rw += x; b.rw += y; a.rl += y; b.rl += x; a.opp[game.b] = 1; b.opp[game.a] = 1;
          if (x > y) { a.w++; b.l++; } else { b.w++; a.l++; }
        }
        const A = Object.values(M);
        const sos = t => { const opponents = Object.keys(t.opp); if (!opponents.length) return 0; let w = 0, g = 0; for (const name of opponents) { w += M[name].w; g += M[name].w + M[name].l; } return g ? w / g : 0; };
        A.sort((a, b) => sos(b) - sos(a));
        let last = null, rank = 0;
        A.forEach((team, i) => { const value = sos(team); if (last === null || value !== last) rank = i + 1; team.sosRank = rank; last = value; });
        return A.sort((a, b) => b.w - a.w || a.l - b.l || b.rd - a.rd || a.sosRank - b.sosRank || b.rw - a.rw || a.rl - b.rl || a.name.localeCompare(b.name));
      }

      function seedMap() {
        const names = state.seeds?.length === 4 ? state.seeds : standings().map(team => team.name);
        return Object.fromEntries(names.map((name, i) => [name, i + 1]));
      }

      function displayTeam(name) {
        if (!name || name === "TBD") return "TBD";
        const seed = seedMap()[name];
        return seed ? `#${seed} ${name}` : name;
      }

      function buildBracket() {
        const b = state.bracket || {};
        const seeds = state.seeds?.length === 4 ? state.seeds : standings().map(team => team.name);
        const next = (old, a, c) => old && old.a === a && old.b === c ? old : blankMatch(a, c);

        b.wb1 = b.wb1 || blankMatch(seeds[0] || "TBD", seeds[3] || "TBD");
        b.wb2 = b.wb2 || blankMatch(seeds[1] || "TBD", seeds[2] || "TBD");
        b.wbf = next(b.wbf, winner(b.wb1) || "TBD", winner(b.wb2) || "TBD");
        b.lb1 = next(b.lb1, loser(b.wb1) || "TBD", loser(b.wb2) || "TBD");
        b.lb2 = next(b.lb2, loser(b.wbf) || "TBD", winner(b.lb1) || "TBD");
        b.fp1 = next(b.fp1, winner(b.wbf) || "TBD", winner(b.lb2) || "TBD");
        const reset = isFinal(b.fp1) && winner(b.fp1) === b.fp1.b;
        b.fp2 = reset ? next(b.fp2, b.fp1.a, b.fp1.b) : blankMatch();

        // Keep the randomized bracket maps attached whenever bracket matches exist.
        BRACKET_MATCH_KEYS.forEach((key, i) => { if (state.pendingBracketMaps?.[i] && b[key]) b[key].map = state.pendingBracketMaps[i]; });
        state.bracket = b;
        return b;
      }

      /* ================================================================
         RENDERING
         ================================================================ */
      let currentPath = "";

      function roleBadge(match, team) {
        if (!match?.firstTeam || !team || team === "TBD") return "";
        const attacking = match.firstTeam === team;
        return `<span class="role-badge ${attacking ? "role-atk" : "role-def"}">${attacking ? "ATK" : "DEF"}</span>`;
      }

      function roleOptions(match) {
        if (!match?.a || !match?.b || match.a === "TBD" || match.b === "TBD") return "";
        const a = match.a, b = match.b;
        const value = match.firstTeam === a ? "A" : match.firstTeam === b ? "B" : "";
        return `<select class="role-select" data-role="${currentPath}"><option value="">Choose who attacks first...</option><option value="A" ${value === "A" ? "selected" : ""}>${displayTeam(a)} — Attack / ${displayTeam(b)} — Defend</option><option value="B" ${value === "B" ? "selected" : ""}>${displayTeam(b)} — Attack / ${displayTeam(a)} — Defend</option></select>`;
      }

      function card(match, label, path) {
        if (!match) match = blankMatch();
        const hasTeams = match.a && match.b && match.a !== "TBD" && match.b !== "TBD";
        const win = winner(match);
        const isPool = path.startsWith("pool.");
        const a = isPool ? match.a || "TBD" : displayTeam(match.a || "TBD");
        const b = isPool ? match.b || "TBD" : displayTeam(match.b || "TBD");
        currentPath = path;
        return `<div class="match"><b>${label}</b>${match.map ? `<div class="map-label">Map: ${match.map}</div>` : ""}<div class="status">${isFinal(match) ? "FINAL" : "PENDING"}</div><div class="row ${win && match.a === win ? "winner-row" : ""}"><span class="team-name">${a}${isPool ? roleBadge(match, match.a) : ""}</span><input data-score="${path}.scoreA" value="${match.scoreA ?? ""}" type="number" min="0" max="5" step="1" ${hasTeams ? "" : "disabled"}></div><div class="row ${win && match.b === win ? "winner-row" : ""}"><span class="team-name">${b}${isPool ? roleBadge(match, match.b) : ""}</span><input data-score="${path}.scoreB" value="${match.scoreB ?? ""}" type="number" min="0" max="5" step="1" ${hasTeams ? "" : "disabled"}></div>${isPool ? "" : roleOptions(match)}</div>`;
      }

      function renderHistoryAdmin() {
        const history = Array.isArray(state.history) ? state.history : [];
        const element = document.querySelector("#historyAdmin");
        if (!element) return;
        if (!history.length) { element.innerHTML = '<p class="small">No saved tournaments in History.</p>'; return; }
        element.innerHTML = history.slice().reverse().map((entry, i) => {
          const date = entry.savedAt ? new Date(entry.savedAt).toLocaleString() : "Unknown date";
          const title = String(entry.title || "Saved Tournament").replace(/[&<>"']/g, c => ({ "&": "&amp;", "<": "&lt;", ">": "&gt;", '"': "&quot;", "'": "&#39;" })[c]);
          return `<div class="history-admin-entry"><div class="history-meta"><b>${title}</b><div class="small">Saved ${date}</div></div><button class="history-delete" data-delete-history="${i}">Delete</button></div>`;
        }).join("");
        element.querySelectorAll("[data-delete-history]").forEach(button => button.onclick = async () => { const reversed = history.slice().reverse(); await deleteHistoryEntry(reversed[Number(button.dataset.deleteHistory)]); });
      }

      function render() {
        syncTeams();
        syncMaps();
        appEl.innerHTML = `
          <div class="wrap">
            <header>
              <h1>Oregano 2v2 Tournament Scorer</h1>
              <p class="small">🔒 Scoring access is protected by email and password.</p>
              <div class="actions">
                <button id="draw">Randomize Pool Matches</button>
                <button id="resetPool" class="danger">Reset / Hide Pool Play</button>
                <button id="seed">Lock Pool & Create Bracket</button>
                <button id="saveHistory" class="history-save">Save Current Tournament to History</button>
                <button id="logout">Log Out</button>
                <a href="./" style="color:#55d6c2;margin:10px">Public Viewer</a>
              </div>
            </header>

            <section><h2>Pool Play</h2><div id="pool" class="grid"></div></section>
            <section><h2>Standings</h2><div id="standings"></div></section>
            <section><h2>Double Elimination</h2><div id="bracket" class="grid"></div></section>

            <section>
              <h2>Edit Team Names</h2>
              <p class="small">Change the four tournament team names. Names are used for the current tournament and saved History entries.</p>
              <div class="team-name-control"><input id="team1Input" placeholder="Team 1"><input id="team2Input" placeholder="Team 2"><input id="team3Input" placeholder="Team 3"><input id="team4Input" placeholder="Team 4"><button id="saveTeamNames">Save Team Names</button></div>
              <div id="teamNamesStatus" class="save-status"></div>
            </section>

            <section>
              <h2>Map Pool</h2>
              <p class="small">Set the three maps for the tournament. Randomize Pool Matches automatically assigns maps to pool play and prepares the bracket maps.</p>
              <div class="map-pool-control"><input id="map1Input" placeholder="Map 1"><input id="map2Input" placeholder="Map 2"><input id="map3Input" placeholder="Map 3"><button id="saveMapPool">Save Map Pool</button><button id="randomizeMaps">Randomize Maps for Every Match</button></div>
              <div id="mapPoolStatus" class="save-status"></div>
            </section>

            <section>
              <h2>Defending Champions</h2>
              <p class="small">This name appears in the Defending Champions box on the public viewer.</p>
              <div class="previous-winner-control"><input id="previousWinnerInput" value="" placeholder="Enter previous winning team"><button id="savePreviousWinner">Save Defending Champions</button></div>
              <div id="previousWinnerStatus" class="save-status"></div>
            </section>

            <section><h2>Tournament History Admin</h2><p class="small">Delete saved tournaments from the History page. This control is only available here on the Admin page.</p><div id="historyAdmin"></div></section>
          </div>`;

        teams.forEach((name, i) => document.querySelector(`#team${i + 1}Input`).value = name);
        state.mapPool.forEach((name, i) => document.querySelector(`#map${i + 1}Input`).value = name);
        document.querySelector("#previousWinnerInput").value = state.previousWinner || DEFAULT_CHAMPION;

        bindButtons();

        document.querySelector("#pool").innerHTML = (state.pool || []).map((match, i) => card(match, `Pool Match ${i + 1}`, `pool.${i}`)).join("") || "<p>Pool Play is currently hidden. Click Randomize Pool Matches to start a new pool.</p>";
        document.querySelector("#standings").innerHTML = `<table><thead><tr><th>Seed</th><th>Team</th><th>Record</th><th>Round Diff</th><th>Strength of Schedule</th><th>Rounds Won</th><th>Rounds Lost</th></tr></thead><tbody>${standings().map((team, i) => `<tr><td>${i + 1}</td><td>${team.name}</td><td>${team.w}-${team.l}</td><td>${team.rd >= 0 ? "+" : ""}${team.rd}</td><td>${team.sosRank}</td><td>${team.rw}</td><td>${team.rl}</td></tr>`).join("")}</tbody></table>`;

        if (!state.poolComplete) {
          document.querySelector("#bracket").innerHTML = "<p>Finish pool play and click Lock Pool & Create Bracket.</p>";
        } else {
          const b = buildBracket();
          document.querySelector("#bracket").innerHTML = card(b.wb1, "Winners Semi-Final 1", "bracket.wb1") + card(b.wb2, "Winners Semi-Final 2", "bracket.wb2") + card(b.wbf, "Winners Final", "bracket.wbf") + card(b.lb1, "Losers Semi-Final", "bracket.lb1") + card(b.lb2, "Losers Final", "bracket.lb2") + card(b.fp1, "First Place Match 1", "bracket.fp1") + card(b.fp2, "First Place Match 2", "bracket.fp2");
        }
        renderHistoryAdmin();
        bindScoreAndRoleInputs();
      }

      /* ================================================================
         BUTTON ACTIONS
         ================================================================ */
      function bindButtons() {
        document.querySelector("#saveTeamNames").onclick = async () => {
          const names = [1, 2, 3, 4].map(i => document.querySelector(`#team${i}Input`).value.trim());
          if (names.some(name => !name)) { document.querySelector("#teamNamesStatus").textContent = "Enter a name for all 4 teams."; return; }
          if (new Set(names).size !== 4) { document.querySelector("#teamNamesStatus").textContent = "Team names must be unique."; return; }
          teams = [...names]; state.teamNames = [...teams]; await save();
          document.querySelector("#teamNamesStatus").textContent = "Team names saved ✓";
          render();
        };

        document.querySelector("#saveMapPool").onclick = async () => {
          const maps = [1, 2, 3].map(i => document.querySelector(`#map${i}Input`).value.trim());
          if (maps.some(map => !map)) { document.querySelector("#mapPoolStatus").textContent = "Enter all 3 map names."; return; }
          if (new Set(maps).size !== 3) { document.querySelector("#mapPoolStatus").textContent = "Map names must be unique."; return; }
          state.mapPool = [...maps]; await save();
          document.querySelector("#mapPoolStatus").textContent = "Map pool saved ✓";
          render();
        };

        // Manual map randomizer remains available.
        document.querySelector("#randomizeMaps").onclick = async () => {
          randomizeMaps();
          await save();
          document.querySelector("#mapPoolStatus").textContent = "Maps randomized for every match ✓";
          render();
        };

        document.querySelector("#savePreviousWinner").onclick = async () => {
          const value = document.querySelector("#previousWinnerInput").value.trim();
          if (!value) { document.querySelector("#previousWinnerStatus").textContent = "Enter a team name first."; return; }
          state.previousWinner = value; await save();
          document.querySelector("#previousWinnerStatus").textContent = "Defending champions saved ✓";
        };

        document.querySelector("#saveHistory").onclick = saveHistory;

        // Randomizing pool matches creates and saves all map assignments immediately.
        document.querySelector("#draw").onclick = async () => {
          draw();
          await save();
          render();
        };

        document.querySelector("#resetPool").onclick = async () => {
          if (!confirm("Reset and hide Pool Play from the viewer? This clears the current pool matches, standings data, and bracket.")) return;
          state = {
            pool: [], poolComplete: false, bracket: null, seeds: null,
            bracketHidden: true, podiumHidden: true,
            previousWinner: state.previousWinner || DEFAULT_CHAMPION,
            teamNames: [...teams], mapPool: [...state.mapPool], pendingBracketMaps: []
          };
          await save();
          render();
        };

        document.querySelector("#seed").onclick = async () => {
          if ((state.pool || []).length !== 4 || state.pool.some(match => !finalScore(+match.scoreA, +match.scoreB))) {
            alert("Finish all four pool matches with a final score: 4-0, 4-1, 4-2, 5-3, or 5-4.");
            return;
          }
          state.poolComplete = true;
          state.seeds = standings().map(team => team.name);
          state.bracket = null;
          state.bracketHidden = false;
          buildBracket();
          await save();
          render();
        };

        document.querySelector("#logout").onclick = () => signOut(auth);
      }

      /* ================================================================
         SCORE / ROLE INPUTS
         ================================================================ */
      function bindScoreAndRoleInputs() {
        document.querySelectorAll("[data-score]").forEach(input => {
          input.onchange = async () => {
            const raw = input.value.trim();
            const value = raw === "" ? null : Number(raw);
            const path = input.dataset.score.split(".");
            let object = state;
            for (let i = 0; i < path.length - 1; i++) object = object[path[i]];
            const key = path[path.length - 1];
            if (value !== null && (!Number.isInteger(value) || value < 0 || value > 5)) { alert("Enter a whole number from 0 to 5."); input.value = object[key] ?? ""; return; }
            object[key] = value;
            if (object.scoreA != null && object.scoreB != null && !scoreValid(+object.scoreA, +object.scoreB)) { alert("Scores must be whole numbers from 0 to 5."); object[key] = null; }
            if (path[0] === "bracket") buildBracket();
            ensurePoolChoices();
            await save();
            render();
          };
        });

        document.querySelectorAll("[data-role]").forEach(select => {
          select.onchange = async () => {
            const path = select.dataset.role.split(".");
            let object = state;
            for (const part of path) object = object[part];
            if (select.value === "A") { object.firstTeam = object.a; object.firstSide = "Attack"; }
            else if (select.value === "B") { object.firstTeam = object.b; object.firstSide = "Attack"; }
            else { object.firstTeam = null; object.firstSide = null; }
            await save();
            render();
          };
        });
      }

      /* ================================================================
         REAL-TIME FIREBASE STATE
         ================================================================ */
      onAuthStateChanged(auth, user => {
        if (!user) { login(); return; }
        onSnapshot(ref, async snapshot => {
          if (snapshot.exists()) state = snapshot.data();
          syncTeams();
          syncMaps();
          const choicesChanged = ensurePoolChoices();
          if (choicesChanged) await save();
          render();
        });
      });
    }
  </script>
</body>
</html>
