<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Oregano 2v2 Tournament Scorer</title><style>body{font:16px system-ui;margin:0;background:#090d12;color:#fff}.wrap{max-width:1100px;margin:auto;padding:28px}section,.login{background:#111820;border:1px solid #2a3743;border-radius:14px;padding:18px;margin:16px 0}button,input,select{padding:10px;border-radius:8px;border:1px solid #3a4855}button{background:#55d6c2;font-weight:800;cursor:pointer}button.danger{background:#ff6b6b;color:#111}button.secondary{background:#2a3743;color:#fff}input,select{background:#080d12;color:white}.login{max-width:430px;margin:60px auto}.login input{width:calc(100% - 22px);margin:6px 0}.error{color:#ff8d8d;margin-top:8px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.match{background:#0d141b;border:1px solid #2a3743;border-radius:10px;padding:14px}.row{display:grid;grid-template-columns:1fr 70px;gap:8px;margin:6px 0;padding:6px;border-radius:8px;align-items:center}.row.winner-row{font-weight:900}#pool .row.winner-row span.team-name{color:#55d6c2;font-weight:900}.small{color:#9aa8b5;font-size:12px}.status{color:#9aa8b5;font-size:12px;margin-top:4px}.actions{display:flex;gap:8px;flex-wrap:wrap}.role-select{width:100%;margin-top:10px}.role-badge{display:inline-block;font-size:11px;line-height:1;padding:4px 6px;border-radius:5px;margin-left:7px;font-weight:900;vertical-align:middle}.role-atk{background:#ff9f43;color:#111}.role-def{background:#4da3ff;color:#07111b}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid #2a3743}th:nth-child(n+4),td:nth-child(n+4){text-align:center}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div id="app"></div><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';import{getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js';import{getFirestore,doc,setDoc,onSnapshot}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js';let cfg;try{cfg=(await import('./firebase-config.js')).firebaseConfig}catch(e){}const appEl=document.querySelector('#app');if(!cfg){appEl.innerHTML='<div class="wrap"><section><h1>Firebase setup required</h1><p>Add firebase-config.js and deploy.</p></section></div>'}else{const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app),ref=doc(db,'tournaments','oregano-2v2');const teams=['Memphis & Sam','Preston & Roman','Eli & Sanath','Nolan & Xavier'];let state={pool:[],poolComplete:false,bracket:null,seeds:null,bracketHidden:false};const shuffle=a=>[...a].sort(()=>Math.random()-.5),scoreValid=(a,b)=>Number.isInteger(a)&&Number.isInteger(b)&&a>=0&&a<=5&&b>=0&&b<=5,finalScore=(a,b)=>{if(!scoreValid(a,b)||a===b)return false;const hi=Math.max(a,b),lo=Math.min(a,b);return[[4,0],[4,1],[4,2],[5,3],[5,4]].some(([h,l])=>hi===h&&lo===l)},isFinal=m=>!!m&&m.scoreA!=null&&m.scoreB!=null&&finalScore(+m.scoreA,+m.scoreB),winner=m=>isFinal(m)?(+m.scoreA>+m.scoreB?m.a:m.b):null,loser=m=>isFinal(m)?(+m.scoreA>+m.scoreB?m.b:m.a):null,blankMatch=(a='TBD',b='TBD')=>({a,b,scoreA:null,scoreB:null,firstTeam:null,firstSide:null});function autoPoolChoice(m){if(!m||!m.a||!m.b||m.a==='TBD'||m.b==='TBD'||m.firstTeam)return false;m.firstTeam=Math.random()<.5?m.a:m.b;m.firstSide='Attack';return true}function ensurePoolChoices(){let c=false;for(const m of state.pool||[])if(autoPoolChoice(m))c=true;return c}function login(){appEl.innerHTML='<div class="login"><h1>🎮 Oregano 2v2 Tournament Scorer</h1><p class="small">Scoring access requires an email and password.</p><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="loginBtn">Log In</button><p id="err" class="error"></p><p><a href="./" style="color:#55d6c2">← Public Viewer</a></p></div>';document.querySelector('#loginBtn').onclick=async()=>{const e=document.querySelector('#email').value.trim(),p=document.querySelector('#password').value;if(!e||!p){document.querySelector('#err').textContent='Enter both email and password.';return}try{await signInWithEmailAndPassword(auth,e,p)}catch(x){document.querySelector('#err').textContent='Login failed: '+(x?.code||x?.message||'unknown error').replace('auth/','').replaceAll('-',' ')}}}function draw(){const t=shuffle(teams),omit=[[t[0],t[1]],[t[2],t[3]]],p=[];for(let i=0;i<4;i++)for(let j=i+1;j<4;j++)if(!omit.some(x=>(x[0]===t[i]&&x[1]===t[j])||(x[0]===t[j]&&x[1]===t[i])))p.push([t[i],t[j]]);return{pool:p.map((x,i)=>{const m={id:'P'+(i+1),a:x[0],b:x[1],scoreA:null,scoreB:null,firstTeam:null,firstSide:null};autoPoolChoice(m);return m}),poolComplete:false,bracket:null,seeds:null,bracketHidden:false}}async function save(){await setDoc(ref,state)}function standings(){const M=Object.fromEntries(teams.map(n=>[n,{name:n,w:0,l:0,rd:0,rw:0,rl:0,opp:{}}]));for(const g of state.pool||[]){if(!finalScore(+g.scoreA,+g.scoreB))continue;const a=M[g.a],b=M[g.b],x=+g.scoreA,y=+g.scoreB;if(!a||!b)continue;a.rd+=x-y;b.rd+=y-x;a.rw+=x;b.rw+=y;a.rl+=y;b.rl+=x;a.opp[g.b]=1;b.opp[g.a]=1;if(x>y){a.w++;b.l++}else{b.w++;a.l++}}const A=Object.values(M),s=t=>{const o=Object.keys(t.opp);if(!o.length)return 0;let w=0,g=0;for(const n of o){w+=M[n].w;g+=M[n].w+M[n].l}return g?w/g:0};A.sort((a,b)=>s(b)-s(a));let last=null,r=0;A.forEach((t,i)=>{const q=s(t);if(last===null||q!==last)r=i+1;t.sosRank=r;last=q});return A.sort((a,b)=>b.w-a.w||a.l-b.l||b.rd-a.rd||a.sosRank-b.sosRank||b.rw-a.rw||a.rl-b.rl||a.name.localeCompare(b.name))}function seedMap(){const n=state.seeds?.length===4?state.seeds:standings().map(x=>x.name);return Object.fromEntries(n.map((x,i)=>[x,i+1]))}function displayTeam(n){if(!n||n==='TBD')return'TBD';const s=seedMap()[n];return s?`#${s} ${n}`:n}function buildBracket(){const b=state.bracket||{},s=state.seeds?.length===4?state.seeds:standings().map(x=>x.name),next=(o,a,c)=>o&&o.a===a&&o.b===c?o:blankMatch(a,c);b.wb1=b.wb1||blankMatch(s[0]||'TBD',s[3]||'TBD');b.wb2=b.wb2||blankMatch(s[1]||'TBD',s[2]||'TBD');b.wbf=next(b.wbf,winner(b.wb1)||'TBD',winner(b.wb2)||'TBD');b.lb1=next(b.lb1,loser(b.wb1)||'TBD',loser(b.wb2)||'TBD');b.lb2=next(b.lb2,loser(b.wbf)||'TBD',winner(b.lb1)||'TBD');b.fp1=next(b.fp1,winner(b.wbf)||'TBD',winner(b.lb2)||'TBD');const reset=isFinal(b.fp1)&&winner(b.fp1)===b.fp1.b;b.fp2=reset?next(b.fp2,b.fp1.a,b.fp1.b):blankMatch();state.bracket=b;return b}function roleBadge(m,t){if(!m?.firstTeam||!t||t==='TBD')return'';const a=m.firstTeam===t;return`<span class="role-badge ${a?'role-atk':'role-def'}">${a?'ATK':'DEF'}</span>`}let currentPath='';function roleOptions(m){if(!m?.a||!m?.b||m.a==='TBD'||m.b==='TBD')return'';const a=m.a,b=m.b,v=m.firstTeam===a?'A':m.firstTeam===b?'B':'';return`<select class="role-select" data-role="${currentPath}"><option value="">Choose who attacks first...</option><option value="A" ${v==='A'?'selected':''}>${displayTeam(a)} — Attack / ${displayTeam(b)} — Defend</option><option value="B" ${v==='B'?'selected':''}>${displayTeam(b)} — Attack / ${displayTeam(a)} — Defend</option></select>`}function card(m,label,path){if(!m)m=blankMatch();const has=m.a&&m.b&&m.a!=='TBD'&&m.b!=='TBD',w=winner(m),pool=path.startsWith('pool.'),a=pool?(m.a||'TBD'):displayTeam(m.a||'TBD'),b=pool?(m.b||'TBD'):displayTeam(m.b||'TBD');currentPath=path;return`<div class="match"><b>${label}</b><div class="status">${isFinal(m)?'FINAL':'PENDING'}</div><div class="row ${w&&m.a===w?'winner-row':''}"><span class="team-name">${a}${pool?roleBadge(m,m.a):''}</span><input data-score="${path}.scoreA" value="${m.scoreA??''}" type="number" min="0" max="5" step="1" ${has?'':'disabled'}></div><div class="row ${w&&m.b===w?'winner-row':''}"><span class="team-name">${b}${pool?roleBadge(m,m.b):''}</span><input data-score="${path}.scoreB" value="${m.scoreB??''}" type="number" min="0" max="5" step="1" ${has?'':'disabled'}></div>${pool?'':roleOptions(m)}</div>`}function render(){appEl.innerHTML='<div class="wrap"><header><h1>Oregano 2v2 Tournament Scorer</h1><p class="small">🔒 Scoring access is protected by email and password.</p><div class="actions"><button id="draw">Randomize Pool Matches</button><button id="resetPool" class="danger">Reset / Hide Pool Play</button><button id="seed">Lock Pool & Create Bracket</button><button id="hideBracket" class="secondary">'+(state.bracketHidden?'Show Bracket to Viewer':'Hide Bracket from Viewer')+'</button><button id="logout">Log Out</button><a href="./" style="color:#55d6c2;margin:10px">Public Viewer</a></div></header><section><h2>Pool Play</h2><div id="pool" class="grid"></div></section><section><h2>Standings</h2><div id="standings"></div></section><section><h2>Double Elimination</h2><div id="bracket" class="grid"></div></section></div>';document.querySelector('#draw').onclick=async()=>{state=draw();await save();render()};document.querySelector('#resetPool').onclick=async()=>{if(!confirm('Reset and hide Pool Play from the viewer? This clears the current pool matches, standings data, and bracket.'))return;state={pool:[],poolComplete:false,bracket:null,seeds:null,bracketHidden:true};await save();render()};document.querySelector('#seed').onclick=async()=>{if((state.pool||[]).length!==4||state.pool.some(x=>!finalScore(+x.scoreA,+x.scoreB))){alert('Finish all four pool matches with a final score: 4-0, 4-1, 4-2, 5-3, or 5-4.');return}state.poolComplete=true;state.seeds=standings().map(x=>x.name);state.bracket=null;state.bracketHidden=false;buildBracket();await save();render()};document.querySelector('#hideBracket').onclick=async()=>{state.bracketHidden=!state.bracketHidden;await save();render()};document.querySelector('#logout').onclick=()=>signOut(auth);document.querySelector('#pool').innerHTML=(state.pool||[]).map((m,i)=>card(m,'Pool Match '+(i+1),'pool.'+i)).join('')||'<p>Pool Play is currently hidden. Click Randomize Pool Matches to start a new pool.</p>';document.querySelector('#standings').innerHTML='<table><thead><tr><th>Seed</th><th>Team</th><th>Record</th><th>Round Diff</th><th>Strength of Schedule</th><th>Rounds Won</th><th>Rounds Lost</th></tr></thead><tbody>'+(standings().map((x,i)=>`<tr><td>${i+1}</td><td>${x.name}</td><td>${x.w}-${x.l}</td><td>${x.rd>=0?'+':''}${x.rd}</td><td>${x.sosRank}</td><td>${x.rw}</td><td>${x.rl}</td></tr>`).join(''))+'</tbody></table>';if(!state.poolComplete)document.querySelector('#bracket').innerHTML='<p>Finish pool play and click Lock Pool & Create Bracket.</p>';else if(state.bracketHidden)document.querySelector('#bracket').innerHTML='<p>Bracket is hidden from viewers, but remains available here for scoring.</p>';else{const b=buildBracket();document.querySelector('#bracket').innerHTML=card(b.wb1,'Winners Semi-Final 1','bracket.wb1')+card(b.wb2,'Winners Semi-Final 2','bracket.wb2')+card(b.wbf,'Winners Final','bracket.wbf')+card(b.lb1,'Losers Semi-Final','bracket.lb1')+card(b.lb2,'Losers Final','bracket.lb2')+card(b.fp1,'First Place Match 1','bracket.fp1')+card(b.fp2,'First Place Match 2','bracket.fp2')}bind()}function bind(){document.querySelectorAll('[data-score]').forEach(e=>e.onchange=async()=>{const raw=e.value.trim(),v=raw===''?null:Number(raw),p=e.dataset.score.split('.');let o=state;for(let i=0;i<p.length-1;i++)o=o[p[i]];const k=p[p.length-1];if(v!==null&&(!Number.isInteger(v)||v<0||v>5)){alert('Enter a whole number from 0 to 5.');e.value=o[k]??'';return}o[k]=v;if(o.scoreA!=null&&o.scoreB!=null&&!scoreValid(+o.scoreA,+o.scoreB)){alert('Scores must be whole numbers from 0 to 5.');o[k]=null}if(p[0]==='bracket')buildBracket();ensurePoolChoices();await save();render()});document.querySelectorAll('[data-role]').forEach(e=>e.onchange=async()=>{const p=e.dataset.role.split('.');let o=state;for(let i=0;i<p.length;i++)o=o[p[i]];if(e.value==='A'){o.firstTeam=o.a;o.firstSide='Attack'}else if(e.value==='B'){o.firstTeam=o.b;o.firstSide='Attack'}else{o.firstTeam=null;o.firstSide=null}await save();render()})}onAuthStateChanged(auth,u=>{if(u)onSnapshot(ref,async s=>{if(s.exists())state=s.data();const c=ensurePoolChoices();if(c)await save();render()});else login()})}</script></body></html>
