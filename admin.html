<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Oregano 2v2 Tournament Scorer</title><style>body{font:16px system-ui;margin:0;background:#090d12;color:#fff}.wrap{max-width:1100px;margin:auto;padding:28px}section,.login{background:#111820;border:1px solid #2a3743;border-radius:14px;padding:18px;margin:16px 0}button,input,select{padding:10px;border-radius:8px;border:1px solid #3a4855}button{background:#55d6c2;font-weight:800;cursor:pointer}input,select{background:#080d12;color:white}.login{max-width:430px;margin:60px auto}.login input{width:calc(100% - 22px);margin:6px 0}.error{color:#ff8d8d;margin-top:8px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.match{background:#0d141b;border:1px solid #2a3743;border-radius:10px;padding:14px}.row{display:grid;grid-template-columns:1fr 70px;gap:8px;margin:6px 0}.small{color:#9aa8b5;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}.choice{width:100%;margin-top:8px}.auto-choice{margin-top:8px;padding:10px;border:1px solid #2a3743;border-radius:8px;background:#111820}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid #2a3743}th:nth-child(4),td:nth-child(4),th:nth-child(5),td:nth-child(5),th:nth-child(6),td:nth-child(6),th:nth-child(7),td:nth-child(7){text-align:center}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div id="app"></div><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';import{getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js';import{getFirestore,doc,setDoc,onSnapshot}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js';let cfg;try{cfg=(await import('./firebase-config.js')).firebaseConfig}catch(e){}const appEl=document.querySelector('#app');if(!cfg){appEl.innerHTML='<div class="wrap"><section><h1>Firebase setup required</h1><p>Add firebase-config.js and deploy.</p></section></div>'}else{const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app),ref=doc(db,'tournaments','oregano-2v2'),teams=['Memphis & Sam','Preston & Roman','Eli & Sanath','Nolan & Xavier'];let state={pool:[],poolComplete:false,bracket:null,seeds:null};const shuffle=a=>[...a].sort(()=>Math.random()-.5),scoreValid=(a,b)=>Number.isInteger(a)&&Number.isInteger(b)&&a>=0&&a<=5&&b>=0&&b<=5,finalScore=(a,b)=>{if(!scoreValid(a,b)||a===b)return false;let hi=Math.max(a,b),lo=Math.min(a,b);return [[4,0],[4,1],[4,2],[5,3],[5,4]].some(([h,l])=>hi===h&&lo===l)};function login(){appEl.innerHTML='<div class="login"><h1>🎮 Oregano 2v2 Tournament Scorer</h1><p class="small">Scoring access requires an email and password.</p><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="loginBtn">Log In</button><p id="err" class="error"></p><p><a href="./" style="color:#55d6c2">← Public Viewer</a></p></div>';document.querySelector('#loginBtn').onclick=async()=>{const e=document.querySelector('#email').value.trim(),p=document.querySelector('#password').value;if(!e||!p){document.querySelector('#err').textContent='Enter both email and password.';return}try{await signInWithEmailAndPassword(auth,e,p)}catch(x){console.error(x);let msg=x?.code||x?.message||'unknown-error';document.querySelector('#err').textContent='Login failed: '+msg.replace('auth/','').replaceAll('-',' ')}}}function draw(){let t=shuffle(teams),omit=[[t[0],t[1]],[t[2],t[3]]],p=[];for(let i=0;i<4;i++)for(let j=i+1;j<4;j++)if(!omit.some(x=>(x[0]===t[i]&&x[1]===t[j])||(x[0]===t[j]&&x[1]===t[i])))p.push([t[i],t[j]]);return{pool:p.map((x,i)=>({id:'P'+(i+1),a:x[0],b:x[1],scoreA:null,scoreB:null,firstTeam:Math.random()<.5?x[0]:x[1],firstSide:Math.random()<.5?'Attack':'Defend'})),poolComplete:false,bracket:null,seeds:null}}async function save(){await setDoc(ref,state)}function win(m){return m&&finalScore(+m.scoreA,+m.scoreB)?(+m.scoreA>+m.scoreB?m.a:m.b):null}function lose(m){let w=win(m);return w?(w===m.a?m.b:m.a):null}function standings(){let M=Object.fromEntries(teams.map(n=>[n,{name:n,w:0,l:0,rd:0,roundsWon:0,roundsLost:0,opp:{}}]));for(const g of state.pool){if(!finalScore(+g.scoreA,+g.scoreB))continue;let a=M[g.a],b=M[g.b],x=+g.scoreA,y=+g.scoreB;a.rd+=x-y;b.rd+=y-x;a.roundsWon+=x;b.roundsWon+=y;a.roundsLost+=y;b.roundsLost+=x;a.opp[g.b]=true;b.opp[g.a]=true;if(x>y){a.w++;b.l++}else{b.w++;a.l++}}const arr=Object.values(M);const sosScore=t=>{let opp=Object.keys(t.opp);if(!opp.length)return 0;let wins=0,games=0;for(const o of opp){wins+=M[o].w;games+=M[o].w+M[o].l}return games?wins/games:0};const sosOrder=[...arr].sort((a,b)=>{let as=sosScore(a),bs=sosScore(b);if(bs!==as)return bs-as;let ard=0,brd=0;for(const o of Object.keys(a.opp))ard+=M[o].rd;for(const o of Object.keys(b.opp))brd+=M[o].rd;return brd-ard});let lastScore=null,lastRank=0;sosOrder.forEach((x,i)=>{let score=sosScore(x);if(lastScore===null||score!==lastScore)lastRank=i+1;x.sosRank=lastRank;lastScore=score});return arr.sort((a,b)=>b.w-a.w||a.l-b.l||b.rd-a.rd||a.sosRank-b.sosRank||b.roundsWon-a.roundsWon||a.roundsLost-b.roundsLost||a.name.localeCompare(b.name))}function card(m,label,path){if(!m)return`<div class="match"><b>${label}</b><p class="small">PENDING</p><div class="row"><span>TBD</span><input disabled value="—"></div><div class="row"><span>TBD</span><input disabled value="—"></div></div>`;let choices=path.startsWith('bracket.')&&m.a&&m.b?`<select class="choice" data-choice="${path}"><option value="">Choose who attacks first...</option><option value="a-attack">${m.a} — Attack / ${m.b} — Defend</option><option value="a-defend">${m.a} — Defend / ${m.b} — Attack</option><option value="b-attack">${m.b} — Attack / ${m.a} — Defend</option><option value="b-defend">${m.b} — Defend / ${m.a} — Attack</option></select>`:m.a&&m.b?`<div class="auto-choice"><b>Pool play: Attack/Defend selected automatically</b><br><span class="small">${m.firstTeam} — ${m.firstSide} first</span></div>`:'';return`<div class="match"><b>${label}</b><div class="small">${m.scoreA!=null&&m.scoreB!=null?(finalScore(+m.scoreA,+m.scoreB)?'FINAL':'PENDING'):'PENDING'}</div><div class="row"><span>${m.a||'TBD'}</span><input data-score="${path}.scoreA" value="${m.scoreA??''}" type="number" min="0" max="5"></div><div class="row"><span>${m.b||'TBD'}</span><input data-score="${path}.scoreB" value="${m.scoreB??''}" type="number" min="0" max="5"></div>${choices}</div>`}function bracket(){let b=state.bracket||{},s=state.seeds||standings().map(x=>x.name);b.wb1=b.wb1||{a:s[0],b:s[3],scoreA:null,scoreB:null,firstTeam:null,firstSide:null};b.wb2=b.wb2||{a:s[1],b:s[2],scoreA:null,scoreB:null,firstTeam:null,firstSide:null};b.wbf={...(b.wbf||{}),a:win(b.wb1),b:win(b.wb2)};b.lb1={...(b.lb1||{}),a:lose(b.wb1),b:lose(b.wb2)};b.lb2={...(b.lb2||{}),a:lose(b.wbf),b:win(b.lb1)};b.gf={...(b.gf||{}),a:win(b.wbf),b:win(b.lb2)};return b}function render(){appEl.innerHTML='<div class="wrap"><header><h1>Oregano 2v2 Tournament Scorer</h1><p class="small">🔒 Scoring access is protected by email and password.</p><div class="actions"><button id="draw">Randomize Pool Matches</button><button id="seed">Lock Pool & Create Bracket</button><button id="logout">Log Out</button><a href="./" style="color:#55d6c2;margin:10px">Public Viewer</a></div></header><section><h2>Pool Play</h2><div id="pool" class="grid"></div></section><section><h2>Standings</h2><div id="standings"></div></section><section><h2>Double Elimination</h2><div id="bracket" class="grid"></div></section></div>';document.querySelector('#draw').onclick=async()=>{state=draw();await save();render()};document.querySelector('#seed').onclick=async()=>{if(state.pool.length!==4||state.pool.some(x=>!finalScore(+x.scoreA,+x.scoreB))){alert('Finish all four pool matches with a final score: 4-0, 4-1, 4-2, 5-3, or 5-4. Tied scores remain PENDING.');return}state.poolComplete=true;state.seeds=standings().map(x=>x.name);state.bracket=null;await save()};document.querySelector('#logout').onclick=()=>signOut(auth);document.querySelector('#pool').innerHTML=state.pool.map((m,i)=>card(m,'Pool Match '+(i+1),'pool.'+i)).join('')||'<p>Click Randomize Pool Matches.</p>';document.querySelector('#standings').innerHTML='<table><thead><tr><th>Seed</th><th>Team</th><th>Record</th><th>Round Diff</th><th>Strength of Schedule</th><th>Rounds Won</th><th>Rounds Lost</th></tr></thead><tbody>'+standings().map((x,i)=>`<tr><td>${i+1}</td><td><b>${x.name}</b></td><td>${x.w}-${x.l}</td><td>${x.rd>=0?'+':''}${x.rd}</td><td>${x.sosRank}</td><td>${x.roundsWon}</td><td>${x.roundsLost}</td></tr>`).join('')+'</tbody></table>';if(!state.poolComplete)document.querySelector('#bracket').innerHTML='<p>Finish pool play and click Lock Pool & Create Bracket.</p>';else{const b=bracket();document.querySelector('#bracket').innerHTML=card(b.wb1,'Winners Semi-Final 1','bracket.wb1')+card(b.wb2,'Winners Semi-Final 2','bracket.wb2')+card(b.wbf,'Winners Final','bracket.wbf')+card(b.lb1,'Losers Semi-Final','bracket.lb1')+card(b.lb2,'Losers Final','bracket.lb2')+card(b.gf,'First Place Match 1','bracket.gf')}bind()}function bind(){document.querySelectorAll('[data-score]').forEach(e=>e.onchange=async()=>{let v=e.value===''?null:+e.value,p=e.dataset.score.split('.'),o=state;for(let i=0;i<p.length-1;i++)o=o[p[i]];if(v!==null&&(!Number.isInteger(v)||v<0||v>5)){alert('Enter a whole number from 0 to 5.');e.value=o[p[p.length-1]]??'';return}o[p[p.length-1]]=v;if(o.scoreA!=null&&o.scoreB!=null&&!scoreValid(+o.scoreA,+o.scoreB)){alert('Scores must be whole numbers from 0 to 5. Tied scores are allowed and remain PENDING.');o[p[p.length-1]]=null}await save();render()});document.querySelectorAll('[data-choice]').forEach(e=>e.onchange=async()=>{let p=e.dataset.choice.split('.'),o=state;for(let i=0;i<p.length;i++)o=o[p[i]];if(!e.value){o.firstTeam=null;o.firstSide=null}else{let [team,side]=e.value.split('-');o.firstTeam=team==='a'?o.a:o.b;o.firstSide=side==='attack'?'Attack':'Defend'}await save();render()})}onAuthStateChanged(auth,u=>{if(u){onSnapshot(ref,s=>{if(s.exists())state=s.data();render()})}else login()});}</script></body></html>
