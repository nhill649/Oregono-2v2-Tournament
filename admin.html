<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Oregano 2v2 Tournament Scorer</title><style>body{font:16px system-ui;margin:0;background:#090d12;color:#fff}.wrap{max-width:1100px;margin:auto;padding:28px}section,.login{background:#111820;border:1px solid #2a3743;border-radius:14px;padding:18px;margin:16px 0}button,input{padding:10px;border-radius:8px;border:1px solid #3a4855}button{background:#55d6c2;font-weight:800;cursor:pointer}input{background:#080d12;color:white}.login{max-width:430px;margin:60px auto}.login input{width:calc(100% - 22px);margin:6px 0}.error{color:#ff8d8d;margin-top:8px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.match{background:#0d141b;border:1px solid #2a3743;border-radius:10px;padding:14px}.row{display:grid;grid-template-columns:1fr 70px;gap:8px;margin:6px 0}.small{color:#9aa8b5;font-size:12px}.actions{display:flex;gap:8px;flex-wrap:wrap}@media(max-width:700px){.grid{grid-template-columns:1fr}}</style></head><body><div id="app"></div><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';import{getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js';import{getFirestore,doc,setDoc,onSnapshot}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js';let cfg;try{cfg=(await import('./firebase-config.js')).firebaseConfig}catch(e){}const appEl=document.querySelector('#app');if(!cfg){appEl.innerHTML='<div class="wrap"><section><h1>Firebase setup required</h1><p>Add firebase-config.js and deploy.</p></section></div>'}else{const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app),ref=doc(db,'tournaments','oregano-2v2'),teams=['Memphis & Sam','Preston & Roman','Eli & Sanath','Nolan & Xavier'];let state={pool:[],poolComplete:false,bracket:null,seeds:null};const shuffle=a=>[...a].sort(()=>Math.random()-.5),valid=(a,b)=>Number.isInteger(a)&&Number.isInteger(b)&&a>=0&&a<5&&b>=0&&b<5&&a!==b;function login(){appEl.innerHTML='<div class="login"><h1>🎮 Oregano 2v2 Tournament Scorer</h1><p class="small">Scoring access requires an email and password.</p><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="loginBtn">Log In</button><p id="err" class="error"></p><p><a href="./" style="color:#55d6c2">← Public Viewer</a></p></div>';document.querySelector('#loginBtn').onclick=async()=>{const e=document.querySelector('#email').value.trim(),p=document.querySelector('#password').value;if(!e||!p){document.querySelector('#err').textContent='Enter both email and password.';return}try{await signInWithEmailAndPassword(auth,e,p)}catch(x){console.error(x);let msg=x?.code||x?.message||'unknown-error';document.querySelector('#err').textContent='Login failed: '+msg.replace('auth/','').replaceAll('-',' ')}}}function draw(){let t=shuffle(teams),omit=[[t[0],t[1]],[t[2],t[3]]],p=[];for(let i=0;i<4;i++)for(let j=i+1;j<4;j++)if(!omit.some(x=>(x[0]===t[i]&&x[1]===t[j])||(x[0]===t[j]&&x[1]===t[i])))p.push([t[i],t[j]]);return{pool:p.map((x,i)=>({id:'P'+(i+1),a:x[0],b:x[1],scoreA:null,scoreB:null,firstTeam:Math.random()<.5?x[0]:x[1],firstSide:Math.random()<.5?'Attack':'Defend'})),poolComplete:false,bracket:null,seeds:null}}async function save(){await setDoc(ref,state)}function win(m){return m&&valid(+m.scoreA,+m.scoreB)?(+m.scoreA>+m.scoreB?m.a:m.b):null}function lose(m){let w=win(m);return w?(w===m.a?m.b:m.a):null}function standings(){let M=Object.fromEntries(teams.map(n=>[n,{name:n,w:0,l:0,rd:0,opp:{}}]));for(const g of state.pool){if(!valid(+g.scoreA,+g.scoreB))continue;let a=M[g.a],b=M[g.b],x=+g.scoreA,y=+g.scoreB;a.rd+=x-y;b.rd+=y-x;a.opp[g.b]=x;b.opp[g.a]=y;if(x>y){a.w++;b.l++}else{b.w++;a.l++}}for(const x of Object.values(M)){let sw=0,srd=0;for(const o of Object.keys(x.opp)){sw+=M[o].w;srd+=M[o].rd}x.sosW=sw;x.srd=srd}return Object.values(M).sort((a,b)=>b.w-a.w||a.l-b.l||b.rd-a.rd||b.sosW-a.sosW||b.srd-a.srd||a.name.localeCompare(b.name))}function card(m,label,path){if(!m)return`<div class="match"><b>${label}</b><p class="small">Waiting for teams to advance.</p></div>`;return`<div class="match"><b>${label}</b><div class="row"><span>${m.a||'TBD'}</span><input data-score="${path}.scoreA" value="${m.scoreA??''}" type="number" min="0" max="4"></div><div class="row"><span>${m.b||'TBD'}</span><input data-score="${path}.scoreB" value="${m.scoreB??''}" type="number" min="0" max="4"></div><p class="small">First: ${m.firstTeam||'not set'} — ${m.firstSide||''}</p>${m.a&&m.b?`<div class="actions"><button data-choice="${path}" data-t="a" data-s="Attack">${m.a}: Attack</button><button data-choice="${path}" data-t="a" data-s="Defend">${m.a}: Defend</button><button data-choice="${path}" data-t="b" data-s="Attack">${m.b}: Attack</button><button data-choice="${path}" data-t="b" data-s="Defend">${m.b}: Defend</button></div>`:''}</div>`}function bracket(){let b=state.bracket||{},s=state.seeds||standings().map(x=>x.name);b.wb1=b.wb1||{a:s[0],b:s[3],scoreA:null,scoreB:null,firstTeam:null,firstSide:null};b.wb2=b.wb2||{a:s[1],b:s[2],scoreA:null,scoreB:null,firstTeam:null,firstSide:null};b.wbf={...(b.wbf||{}),a:win(b.wb1),b:win(b.wb2)};b.lb1={...(b.lb1||{}),a:lose(b.wb1),b:lose(b.wb2)};b.lb2={...(b.lb2||{}),a:lose(b.wbf),b:win(b.lb1)};b.gf={...(b.gf||{}),a:win(b.wbf),b:win(b.lb2)};return b}function render(){appEl.innerHTML='<div class="wrap"><header><h1>Oregano 2v2 Tournament Scorer</h1><p class="small">🔒 Scoring access is protected by email and password.</p><div class="actions"><button id="draw">Randomize Pool Matches</button><button id="seed">Lock Pool & Create Bracket</button><button id="logout">Log Out</button><a href="./" style="color:#55d6c2;margin:10px">Public Viewer</a></div></header><section><h2>Pool Play</h2><div id="pool" class="grid"></div></section><section><h2>Standings</h2><div id="standings"></div></section><section><h2>Double Elimination</h2><div id="bracket" class="grid"></div></section></div>';document.querySelector('#draw').onclick=async()=>{state=draw();await save();render()};document.querySelector('#seed').onclick=async()=>{if(state.pool.length!==4||state.pool.some(x=>!valid(+x.scoreA,+x.scoreB))){alert('Enter all four valid pool scores first. Scores must be different whole numbers from 0 through 4.');return}state.poolComplete=true;state.seeds=standings().map(x=>x.name);state.bracket=null;await save()};document.querySelector('#logout').onclick=()=>signOut(auth);document.querySelector('#pool').innerHTML=state.pool.map((m,i)=>card(m,'Pool Match '+(i+1),'pool.'+i)).join('')||'<p>Click Randomize Pool Matches.</p>';document.querySelector('#standings').innerHTML=standings().map((x,i)=>`<p><b>#${i+1} ${x.name}</b> — ${x.w}-${x.l}, RD ${x.rd>=0?'+':''}${x.rd}</p>`).join('');if(!state.poolComplete)document.querySelector('#bracket').innerHTML='<p>Finish pool play and click Lock Pool & Create Bracket.</p>';else{const b=bracket();document.querySelector('#bracket').innerHTML=card(b.wb1,'Winners Semifinal 1','bracket.wb1')+card(b.wb2,'Winners Semifinal 2','bracket.wb2')+card(b.wbf,'Winners Final','bracket.wbf')+card(b.lb1,'Losers Round 1','bracket.lb1')+card(b.lb2,'Losers Final','bracket.lb2')+card(b.gf,'Grand Final','bracket.gf')}bind()}function bind(){document.querySelectorAll('[data-score]').forEach(e=>e.onchange=async()=>{let v=e.value===''?null:+e.value,p=e.dataset.score.split('.'),o=state;for(let i=0;i<p.length-1;i++)o=o[p[i]];o[p[p.length-1]]=v;if(o.scoreA!=null&&o.scoreB!=null&&!valid(+o.scoreA,+o.scoreB)){alert('Scores must be different whole numbers from 0 through 4. Ties are not allowed.');o[p[p.length-1]]=null}await save();render()});document.querySelectorAll('[data-choice]').forEach(e=>e.onclick=async()=>{let p=e.dataset.choice.split('.'),o=state;for(let i=0;i<p.length;i++)o=o[p[i]];o.firstTeam=e.dataset.t==='a'?o.a:o.b;o.firstSide=e.dataset.s;await save();render()})}onAuthStateChanged(auth,u=>{if(u){onSnapshot(ref,s=>{if(s.exists())state=s.data();render()})}else login()});}</script></body></html>
