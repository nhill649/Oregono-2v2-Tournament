<!doctype html>
<html lang="en">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1">
<title>Oregano 2v2 Tournament Scorer</title>
<style>
body{font:16px system-ui;margin:0;background:#090d12;color:#fff}.wrap{max-width:1100px;margin:auto;padding:28px}section,.login{background:#111820;border:1px solid #2a3743;border-radius:14px;padding:18px;margin:16px 0}button,input,select{padding:10px;border-radius:8px;border:1px solid #3a4855}button{background:#55d6c2;font-weight:800;cursor:pointer}input,select{background:#080d12;color:white}.login{max-width:430px;margin:60px auto}.login input{width:calc(100% - 22px);margin:6px 0}.error{color:#ff8d8d;margin-top:8px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.match{background:#0d141b;border:1px solid #2a3743;border-radius:10px;padding:14px}.row{display:grid;grid-template-columns:1fr 70px;gap:8px;margin:6px 0}.small{color:#9aa8b5;font-size:12px}.status{color:#9aa8b5;font-size:12px;margin-top:4px}.actions{display:flex;gap:8px;flex-wrap:wrap}.choice{width:100%;margin-top:8px}.auto-choice{margin-top:8px;padding:10px;border:1px solid #2a3743;border-radius:8px;background:#111820}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid #2a3743}th:nth-child(n+4),td:nth-child(n+4){text-align:center}@media(max-width:700px){.grid{grid-template-columns:1fr}}
</style>
</head>
<body>
<div id="app"></div>
<script type="module">
import{initializeApp}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';
import{getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js';
import{getFirestore,doc,setDoc,onSnapshot}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js';

let cfg;
try{cfg=(await import('./firebase-config.js')).firebaseConfig}catch(e){}
const appEl=document.querySelector('#app');

if(!cfg){
  appEl.innerHTML='<div class="wrap"><section><h1>Firebase setup required</h1><p>Add firebase-config.js and deploy.</p></section></div>';
}else{
  const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app),ref=doc(db,'tournaments','oregano-2v2');
  const teams=['Memphis & Sam','Preston & Roman','Eli & Sanath','Nolan & Xavier'];
  let state={pool:[],poolComplete:false,bracket:null,seeds:null};

  const shuffle=a=>[...a].sort(()=>Math.random()-.5);
  const scoreValid=(a,b)=>Number.isInteger(a)&&Number.isInteger(b)&&a>=0&&a<=5&&b>=0&&b<=5;
  const finalScore=(a,b)=>{
    if(!scoreValid(a,b)||a===b)return false;
    const hi=Math.max(a,b),lo=Math.min(a,b);
    return [[4,0],[4,1],[4,2],[5,3],[5,4]].some(([h,l])=>hi===h&&lo===l);
  };
  const isFinal=m=>!!m&&m.scoreA!=null&&m.scoreB!=null&&finalScore(+m.scoreA,+m.scoreB);
  const winner=m=>isFinal(m)?(+m.scoreA>+m.scoreB?m.a:m.b):null;
  const loser=m=>isFinal(m)?(+m.scoreA>+m.scoreB?m.b:m.a):null;
  const blankMatch=(a='TBD',b='TBD')=>({a,b,scoreA:null,scoreB:null,firstTeam:null,firstSide:null});

  function login(){
    appEl.innerHTML='<div class="login"><h1>🎮 Oregano 2v2 Tournament Scorer</h1><p class="small">Scoring access requires an email and password.</p><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="loginBtn">Log In</button><p id="err" class="error"></p><p><a href="./" style="color:#55d6c2">← Public Viewer</a></p></div>';
    document.querySelector('#loginBtn').onclick=async()=>{
      const e=document.querySelector('#email').value.trim(),p=document.querySelector('#password').value;
      if(!e||!p){document.querySelector('#err').textContent='Enter both email and password.';return}
      try{await signInWithEmailAndPassword(auth,e,p)}catch(x){console.error(x);let msg=x?.code||x?.message||'unknown-error';document.querySelector('#err').textContent='Login failed: '+msg.replace('auth/','').replaceAll('-',' ')}
    };
  }

  function draw(){
    const t=shuffle(teams),omit=[[t[0],t[1]],[t[2],t[3]]],p=[];
    for(let i=0;i<4;i++)for(let j=i+1;j<4;j++)if(!omit.some(x=>(x[0]===t[i]&&x[1]===t[j])||(x[0]===t[j]&&x[1]===t[i])))p.push([t[i],t[j]]);
    return{pool:p.map((x,i)=>({id:'P'+(i+1),a:x[0],b:x[1],scoreA:null,scoreB:null,firstTeam:Math.random()<.5?x[0]:x[1],firstSide:Math.random()<.5?'Attack':'Defend'})),poolComplete:false,bracket:null,seeds:null};
  }

  async function save(){await setDoc(ref,state)}

  function standings(){
    const M=Object.fromEntries(teams.map(n=>[n,{name:n,w:0,l:0,rd:0,roundsWon:0,roundsLost:0,opp:{}}]));
    for(const g of state.pool||[]){
      if(!finalScore(+g.scoreA,+g.scoreB))continue;
      const a=M[g.a],b=M[g.b],x=+g.scoreA,y=+g.scoreB;
      if(!a||!b)continue;
      a.rd+=x-y;b.rd+=y-x;a.roundsWon+=x;b.roundsWon+=y;a.roundsLost+=y;b.roundsLost+=x;a.opp[g.b]=true;b.opp[g.a]=true;
      if(x>y){a.w++;b.l++}else{b.w++;a.l++}
    }
    const arr=Object.values(M);
    const sosScore=t=>{
      const opp=Object.keys(t.opp);if(!opp.length)return 0;
      let wins=0,games=0;
      for(const o of opp){wins+=M[o].w;games+=M[o].w+M[o].l}
      return games?wins/games:0;
    };
    const sosOrder=[...arr].sort((a,b)=>{
      const as=sosScore(a),bs=sosScore(b);
      if(bs!==as)return bs-as;
      let ard=0,brd=0;
      for(const o of Object.keys(a.opp))ard+=M[o].rd;
      for(const o of Object.keys(b.opp))brd+=M[o].rd;
      return brd-ard;
    });
    let lastScore=null,lastRank=0;
    sosOrder.forEach((x,i)=>{const score=sosScore(x);if(lastScore===null||score!==lastScore)lastRank=i+1;x.sosRank=lastRank;lastScore=score});
    return arr.sort((a,b)=>b.w-a.w||a.l-b.l||b.rd-a.rd||a.sosRank-b.sosRank||b.roundsWon-a.roundsWon||a.roundsLost-b.roundsLost||a.name.localeCompare(b.name));
  }

  function buildBracket(){
    const b=state.bracket||{};
    const s=state.seeds||standings().map(x=>x.name);

    b.wb1=b.wb1||blankMatch(s[0]||'TBD',s[3]||'TBD');
    b.wb2=b.wb2||blankMatch(s[1]||'TBD',s[2]||'TBD');

    // Keep the scores already entered, but always recalculate the teams from the prior round.
    b.wbf={...(b.wbf||blankMatch()),a:winner(b.wb1)||'TBD',b:winner(b.wb2)||'TBD'};
    b.lb1={...(b.lb1||blankMatch()),a:loser(b.wb1)||'TBD',b:loser(b.wb2)||'TBD'};
    b.lb2={...(b.lb2||blankMatch()),a:loser(b.wbf)||'TBD',b:winner(b.lb1)||'TBD'};
    b.lbf={...(b.lbf||blankMatch()),a:winner(b.lb2)||'TBD',b:loser(b.wbf)||'TBD'};

    // First-place Match 1 is the championship match.
    b.fp1={...(b.fp1||blankMatch()),a:winner(b.wbf)||'TBD',b:winner(b.lbf)||'TBD'};

    // First-place Match 2 is only needed when the losers-bracket team wins Match 1.
    const resetNeeded=isFinal(b.fp1)&&winner(b.fp1)===b.fp1.b;
    if(resetNeeded){
      b.fp2={...(b.fp2||blankMatch()),a:b.fp1.a,b:b.fp1.b};
    }else{
      b.fp2={...(b.fp2||blankMatch()),a:'TBD',b:'TBD',scoreA:null,scoreB:null,firstTeam:null,firstSide:null};
    }

    state.bracket=b;
    return b;
  }

  function card(m,label,path){
    if(!m)m=blankMatch();
    const hasTeams=m.a&&m.b&&m.a!=='TBD'&&m.b!=='TBD';
    const status=isFinal(m)?'FINAL':'PENDING';
    const choices=path.startsWith('bracket.')&&hasTeams?`<select class="choice" data-choice="${path}"><option value="">Choose who attacks first...</option><option value="a-attack">${m.a} — Attack / ${m.b} — Defend</option><option value="a-defend">${m.a} — Defend / ${m.b} — Attack</option><option value="b-attack">${m.b} — Attack / ${m.a} — Defend</option><option value="b-defend">${m.b} — Defend / ${m.a} — Attack</option></select>`:m.a&&m.b&&hasTeams?`<div class="auto-choice"><b>Pool play: Attack/Defend selected automatically</b><br><span class="small">${m.firstTeam} — ${m.firstSide} first</span></div>`:'';
    const resetNote=label==='First Place Match 2'&&!hasTeams?'<p class="small">Only played if the Losers Bracket team wins First Place Match 1.</p>':'';
    return`<div class="match"><b>${label}</b><div class="status">${status}</div><div class="row"><span>${m.a||'TBD'}</span><input data-score="${path}.scoreA" value="${m.scoreA??''}" type="number" min="0" max="5" step="1" ${hasTeams?'':'disabled'}></div><div class="row"><span>${m.b||'TBD'}</span><input data-score="${path}.scoreB" value="${m.scoreB??''}" type="number" min="0" max="5" step="1" ${hasTeams?'':'disabled'}></div>${choices}${resetNote}</div>`;
  }

  function render(){
    appEl.innerHTML='<div class="wrap"><header><h1>Oregano 2v2 Tournament Scorer</h1><p class="small">🔒 Scoring access is protected by email and password.</p><div class="actions"><button id="draw">Randomize Pool Matches</button><button id="seed">Lock Pool & Create Bracket</button><button id="logout">Log Out</button><a href="./" style="color:#55d6c2;margin:10px">Public Viewer</a></div></header><section><h2>Pool Play</h2><div id="pool" class="grid"></div></section><section><h2>Standings</h2><div id="standings"></div></section><section><h2>Double Elimination</h2><div id="bracket" class="grid"></div></section></div>';

    document.querySelector('#draw').onclick=async()=>{state=draw();await save();render()};
    document.querySelector('#seed').onclick=async()=>{
      if((state.pool||[]).length!==4||state.pool.some(x=>!finalScore(+x.scoreA,+x.scoreB))){alert('Finish all four pool matches with a final score: 4-0, 4-1, 4-2, 5-3, or 5-4. Tied scores remain PENDING.');return}
      state.poolComplete=true;state.seeds=standings().map(x=>x.name);state.bracket=null;await save();render();
    };
    document.querySelector('#logout').onclick=()=>signOut(auth);

    document.querySelector('#pool').innerHTML=(state.pool||[]).map((m,i)=>card(m,'Pool Match '+(i+1),'pool.'+i)).join('')||'<p>Click Randomize Pool Matches.</p>';
    document.querySelector('#standings').innerHTML='<table><thead><tr><th>Seed</th><th>Team</th><th>Record</th><th>Round Diff</th><th>Strength of Schedule</th><th>Rounds Won</th><th>Rounds Lost</th></tr></thead><tbody>'+(standings().map((x,i)=>`<tr><td>${i+1}</td><td><b>${x.name}</b></td><td>${x.w}-${x.l}</td><td>${x.rd>=0?'+':''}${x.rd}</td><td>${x.sosRank}</td><td>${x.roundsWon}</td><td>${x.roundsLost}</td></tr>`).join(''))+'</tbody></table>';

    if(!state.poolComplete){
      document.querySelector('#bracket').innerHTML='<p>Finish pool play and click Lock Pool & Create Bracket.</p>';
    }else{
      const b=buildBracket();
      document.querySelector('#bracket').innerHTML=
        card(b.wb1,'Winners Semi-Final 1','bracket.wb1')+
        card(b.wb2,'Winners Semi-Final 2','bracket.wb2')+
        card(b.wbf,'Winners Final','bracket.wbf')+
        card(b.lb1,'Losers Semi-Final','bracket.lb1')+
        card(b.lb2,'Losers Final','bracket.lb2')+
        card(b.lbf,'Losers Bracket Final','bracket.lbf')+
        card(b.fp1,'First Place Match 1','bracket.fp1')+
        card(b.fp2,'First Place Match 2','bracket.fp2');
    }
    bind();
  }

  function bind(){
    document.querySelectorAll('[data-score]').forEach(e=>e.onchange=async()=>{
      const raw=e.value.trim();
      const v=raw===''?null:Number(raw);
      const p=e.dataset.score.split('.');
      let o=state;
      for(let i=0;i<p.length-1;i++)o=o[p[i]];
      const key=p[p.length-1];
      if(v!==null&&(!Number.isInteger(v)||v<0||v>5)){
        alert('Enter a whole number from 0 to 5.');
        e.value=o[key]??'';
        return;
      }
      o[key]=v;
      // Any 0-5 combination is allowed while being entered. Only the five
      // legal R6 final scores become FINAL; ties and other scores stay PENDING.
      if(o.scoreA!=null&&o.scoreB!=null&&!scoreValid(+o.scoreA,+o.scoreB)){
        alert('Scores must be whole numbers from 0 to 5. Tied scores are allowed and remain PENDING.');
        o[key]=null;
      }
      await save();
      render();
    });

    document.querySelectorAll('[data-choice]').forEach(e=>e.onchange=async()=>{
      const p=e.dataset.choice.split('.');
      let o=state;
      for(let i=0;i<p.length;i++)o=o[p[i]];
      if(!e.value){o.firstTeam=null;o.firstSide=null}else{
        const [team,side]=e.value.split('-');
        o.firstTeam=team==='a'?o.a:o.b;
        o.firstSide=side==='attack'?'Attack':'Defend';
      }
      await save();render();
    });
  }

  onAuthStateChanged(auth,u=>{
    if(u){
      onSnapshot(ref,s=>{if(s.exists())state=s.data();render()});
    }else login();
  });
}
</script>
</body>
</html>
