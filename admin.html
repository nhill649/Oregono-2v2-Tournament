<!doctype html><html lang="en"><head><meta charset="utf-8"><meta name="viewport" content="width=device-width,initial-scale=1"><title>Oregano 2v2 Tournament Scorer</title><style>body{font:16px system-ui;margin:0;background:#090d12;color:#fff}.wrap{max-width:1100px;margin:auto;padding:28px}section,.login{background:#111820;border:1px solid #2a3743;border-radius:14px;padding:18px;margin:16px 0}button,input,select{padding:10px;border-radius:8px;border:1px solid #3a4855}button{background:#55d6c2;font-weight:800;cursor:pointer}button.danger{background:#ff6b6b;color:#111}input,select{background:#080d12;color:white}.login{max-width:430px;margin:60px auto}.login input{width:calc(100% - 22px);margin:6px 0}.error{color:#ff8d8d;margin-top:8px}.grid{display:grid;grid-template-columns:repeat(2,1fr);gap:12px}.match{background:#0d141b;border:1px solid #2a3743;border-radius:10px;padding:14px}.row{display:grid;grid-template-columns:1fr 70px;gap:8px;margin:6px 0;padding:6px;border-radius:8px;align-items:center}.row.winner-row{font-weight:900}#pool .row.winner-row span.team-name{color:#55d6c2;font-weight:900}.small{color:#9aa8b5;font-size:12px}.status{color:#9aa8b5;font-size:12px;margin-top:4px}.actions{display:flex;gap:8px;flex-wrap:wrap}.role-select{width:100%;margin-top:10px}.role-badge{display:inline-block;font-size:11px;line-height:1;padding:4px 6px;border-radius:5px;margin-left:7px;font-weight:900;vertical-align:middle}.role-atk{background:#ff9f43;color:#111}.role-def{background:#4da3ff;color:#07111b}table{width:100%;border-collapse:collapse}th,td{text-align:left;padding:9px;border-bottom:1px solid #2a3743}th:nth-child(n+4),td:nth-child(n+4){text-align:center}@media(max-width:700px){.grid{grid-template-columns:1fr}}.previous-winner-control,.team-name-control,.map-pool-control{display:flex;gap:10px;align-items:center;flex-wrap:wrap}.previous-winner-control input,.team-name-control input,.map-pool-control input{flex:1;min-width:180px}.save-status{color:#55d6c2;font-size:13px;margin-top:8px}.history-save{background:#55d6c2;color:#07111b}.history-admin-entry{display:flex;justify-content:space-between;align-items:center;gap:12px;padding:12px;margin:8px 0;background:#0d141b;border:1px solid #2a3743;border-radius:10px}.history-admin-entry .history-meta{flex:1}.history-delete{background:#ff6b6b;color:#111}.map-label{color:#55d6c2;font-weight:800;margin-top:8px}@media(max-width:600px){.history-admin-entry{align-items:flex-start;flex-direction:column}.history-delete{width:100%}.team-name-control,.map-pool-control{display:grid;grid-template-columns:1fr}} </style></head><body><div id="app"></div><script type="module">import{initializeApp}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-app.js';import{getAuth,signInWithEmailAndPassword,signOut,onAuthStateChanged}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-auth.js';import{getFirestore,doc,setDoc,onSnapshot,arrayUnion,arrayRemove}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js';let cfg;try{cfg=(await import('./firebase-config.js')).firebaseConfig}catch(e){}const appEl=document.querySelector('#app');if(!cfg){appEl.innerHTML='<div class="wrap"><section><h1>Firebase setup required</h1><p>Add firebase-config.js and deploy.</p></section></div>'}else{const app=initializeApp(cfg),auth=getAuth(app),db=getFirestore(app),ref=doc(db,'tournaments','oregano-2v2');let teams=['Memphis & Sam','Preston & Roman','Eli & Sanath','Nolan & Xavier'];let state={pool:[],poolComplete:false,bracket:null,seeds:null,bracketHidden:false,podiumHidden:true,previousWinner:'Roman & Preston',teamNames:[...teams],mapPool:['Map 1','Map 2','Map 3'],pendingBracketMaps:[]};const shuffle=a=>[...a].sort(()=>Math.random()-.5),scoreValid=(a,b)=>Number.isInteger(a)&&Number.isInteger(b)&&a>=0&&a<=5&&b>=0&&b<=5,finalScore=(a,b)=>{if(!scoreValid(a,b)||a===b)return false;const hi=Math.max(a,b),lo=Math.min(a,b);return[[4,0],[4,1],[4,2],[5,3],[5,4]].some(([h,l])=>hi===h&&lo===l)},isFinal=m=>!!m&&m.scoreA!=null&&m.scoreB!=null&&finalScore(+m.scoreA,+m.scoreB),winner=m=>isFinal(m)?(+m.scoreA>+m.scoreB?m.a:m.b):null,loser=m=>isFinal(m)?(+m.scoreA>+m.scoreB?m.b:m.a):null,blankMatch=(a='TBD',b='TBD')=>({a,b,scoreA:null,scoreB:null,firstTeam:null,firstSide:null,map:null});function syncTeams(){if(Array.isArray(state.teamNames)&&state.teamNames.length===4)teams=state.teamNames.map((x,i)=>String(x||'Team '+(i+1)).trim()||'Team '+(i+1));else state.teamNames=[...teams]}function syncMaps(){if(!Array.isArray(state.mapPool)||state.mapPool.length!==3)state.mapPool=['Map 1','Map 2','Map 3'];state.mapPool=state.mapPool.map((x,i)=>String(x||'Map '+(i+1)).trim()||'Map '+(i+1));if(!Array.isArray(state.pendingBracketMaps))state.pendingBracketMaps=[]}function randomizeMaps(){syncMaps();const maps=shuffle(state.mapPool);let n=0;for(const m of state.pool||[]){m.map=maps[n%maps.length];n++}const keys=['wb1','wb2','wbf','lb1','lb2','fp1','fp2'];state.pendingBracketMaps=keys.map((_,i)=>maps[(n+i)%maps.length]);if(state.bracket)keys.forEach((k,i)=>{if(state.bracket[k])state.bracket[k].map=state.pendingBracketMaps[i]});}function autoPoolChoice(m){if(!m||!m.a||!m.b||m.a==='TBD'||m.b==='TBD'||m.firstTeam)return false;m.firstTeam=Math.random()<.5?m.a:m.b;m.firstSide='Attack';return true}function ensurePoolChoices(){let c=false;for(const m of state.pool||[])if(autoPoolChoice(m))c=true;return c}function login(){appEl.innerHTML='<div class="login"><h1>🎮 Oregano 2v2 Tournament Scorer</h1><p class="small">Scoring access requires an email and password.</p><input id="email" type="email" placeholder="Email"><input id="password" type="password" placeholder="Password"><button id="loginBtn">Log In</button><p id="err" class="error"></p><p><a href="./" style="color:#55d6c2">← Public Viewer</a></p></div>';document.querySelector('#loginBtn').onclick=async()=>{const e=document.querySelector('#email').value.trim(),p=document.querySelector('#password').value;if(!e||!p){document.querySelector('#err').textContent='Enter both email and password.';return}try{await signInWithEmailAndPassword(auth,e,p)}catch(x){document.querySelector('#err').textContent='Login failed: '+(x?.code||x?.message||'unknown error').replace('auth/','').replaceAll('-',' ')}}}function draw(){const t=shuffle(teams),round1=[[t[0],t[1]],[t[2],t[3]]],round2=Math.random()<.5?[[t[0],t[2]],[t[1],t[3]]]:[[t[0],t[3]],[t[1],t[2]]],pairs=[...round1,...round2];return{pool:pairs.map((x,i)=>{const m={id:'P'+(i+1),round:i<2?1:2,a:x[0],b:x[1],scoreA:null,scoreB:null,firstTeam:null,firstSide:null,map:null};autoPoolChoice(m);return m}),poolComplete:false,bracket:null,seeds:null,bracketHidden:false,podiumHidden:true,previousWinner:state.previousWinner||'Roman & Preston',teamNames:[...teams],mapPool:[...state.mapPool],pendingBracketMaps:[]}}async function save(){await setDoc(ref,state)}async function saveHistory(){const b=state.bracket||{};const finalMatch=isFinal(b.fp2)?b.fp2:isFinal(b.fp1)?b.fp1:null;if(!state.poolComplete||!finalMatch){alert('Finish the tournament before saving it to History.');return}const champion=winner(finalMatch)||'Completed Tournament';if(!confirm('Save this current tournament to the History page?'))return;const snapshot={...state,teamNames:[...teams],mapPool:[...state.mapPool]};const id=String(Date.now());try{await setDoc(ref,{history:arrayUnion({id,title:`Oregano 2v2 Tournament — ${champion}`,savedAt:new Date().toISOString(),state:snapshot})},{merge:true});alert('Current tournament saved to History ✓')}catch(e){console.error(e);alert('Could not save the tournament to History. '+(e?.message||e))}}async function deleteHistoryEntry(entry){if(!entry)return;if(!confirm(`Delete "${entry.title||'Saved Tournament'}" from Tournament History? This cannot be undone.`))return;try{await setDoc(ref,{history:arrayRemove(entry)},{merge:true});alert('Tournament deleted from History ✓')}catch(e){console.error(e);alert('Could not delete the tournament from History. '+(e?.message||e))}}function standings(){const M=Object.fromEntries(teams.map(n=>[n,{name:n,w:0,l:0,rd:0,rw:0,rl:0,opp:{}}]));for(const g of state.pool||[]){if(!finalScore(+g.scoreA,+g.scoreB))continue;const a=M[g.a],b=M[g.b],x=+g.scoreA,y=+g.scoreB;if(!a||!b)continue;a.rd+=x-y;b.rd+=y-x;a.rw+=x;b.rw+=y;a.rl+=y;b.rl+=x;a.opp[g.b]=1;b.opp[g.a]=1;if(x>y){a.w++;b.l++}else{b.w++;a.l++}}const A=Object.values(M),s=t=>{const o=Object.keys(t.opp);if(!o.length)return 0;let w=0,g=0;for(const n of o){w+=M[n].w;g+=M[n].w+M[n].l}return g?w/g:0};A.sort((a,b)=>s(b)-s(a));let last=null,r=0;A.forEach((t,i)=>{const q=s(t);if(last===null||q!==last)r=i+1;t.sosRank=r;last=q});return A.sort((a,b)=>b.w-a.w||a.l-b.l||b.rd-a.rd||a.sosRank-b.sosRank||b.rw-a.rw||a.rl-b.rl||a.name.localeCompare(b.name))}function seedMap(){const n=state.seeds?.length===4?state.seeds:standings().map(x=>x.name);return Object.fromEntries(n.map((x,i)=>[x,i+1]))}function displayTeam(n){if(!n||n==='TBD')return'TBD';const s=seedMap()[n];return s?`#${s} ${n}`:n}function buildBracket(){const b=state.bracket||{},s=state.seeds?.length===4?state.seeds:standings().map(x=>x.name),next=(o,a,c)=>o&&o.a===a&&o.b===c?o:blankMatch(a,c);b.wb1=b.wb1||blankMatch(s[0]||'TBD',s[3]||'TBD');b.wb2=b.wb2||blankMatch(s[1]||'TBD',s[2]||'TBD');b.wbf=next(b.wbf,winner(b.wb1)||'TBD',winner(b.wb2)||'TBD');b.lb1=next(b.lb1,loser(b.wb1)||'TBD',loser(b.wb2)||'TBD');b.lb2=next(b.lb2,loser(b.wbf)||'TBD',winner(b.lb1)||'TBD');b.fp1=next(b.fp1,winner(b.wbf)||'TBD',winner(b.lb2)||'TBD');const reset=isFinal(b.fp1)&&winner(b.fp1)===b.fp1.b;b.fp2=reset?next(b.fp2,b.fp1.a,b.fp1.b):blankMatch();const keys=['wb1','wb2','wbf','lb1','lb2','fp1','fp2'];keys.forEach((k,i)=>{if(state.pendingBracketMaps?.[i]&&b[k])b[k].map=state.pendingBracketMaps[i]});state.bracket=b;return b}function roleBadge(m,t){if(!m?.firstTeam||!t||t==='TBD')return'';const a=m.firstTeam===t;return`<span class="role-badge ${a?'role-atk':'role-def'}">${a?'ATK':'DEF'}</span>`}let currentPath='';function roleOptions(m){if(!m?.a||!m?.b||m.a==='TBD'||m.b==='TBD')return'';const a=m.a,b=m.b,v=m.firstTeam===a?'A':m.firstTeam===b?'B':'';return`<select class="role-select" data-role="${currentPath}"><option value="">Choose who attacks first...</option><option value="A" ${v==='A'?'selected':''}>${displayTeam(a)} — Attack / ${displayTeam(b)} — Defend</option><option value="B" ${v==='B'?'selected':''}>${displayTeam(b)} — Attack / ${displayTeam(a)} — Defend</option></select>`}function card(m,label,path){if(!m)m=blankMatch();const has=m.a&&m.b&&m.a!=='TBD'&&m.b!=='TBD',w=winner(m),pool=path.startsWith('pool.'),a=pool?(m.a||'TBD'):displayTeam(m.a||'TBD'),b=pool?(m.b||'TBD'):displayTeam(m.b||'TBD');currentPath=path;return`<div class="match"><b>${label}</b>${m.map?`<div class="map-label">Map: ${m.map}</div>`:''}<div class="status">${isFinal(m)?'FINAL':'PENDING'}</div><div class="row ${w&&m.a===w?'winner-row':''}"><span class="team-name">${a}${pool?roleBadge(m,m.a):''}</span><input data-score="${path}.scoreA" value="${m.scoreA??''}" type="number" min="0" max="5" step="1" ${has?'':'disabled'}></div><div class="row ${w&&m.b===w?'winner-row':''}"><span class="team-name">${b}${pool?roleBadge(m,m.b):''}</span><input data-score="${path}.scoreB" value="${m.scoreB??''}" type="number" min="0" max="5" step="1" ${has?'':'disabled'}></div>${pool?'':roleOptions(m)}</div>`}function renderHistoryAdmin(){const h=Array.isArray(state.history)?state.history:[];const el=document.querySelector('#historyAdmin');if(!el)return;if(!h.length){el.innerHTML='<p class="small">No saved tournaments in History.</p>';return}el.innerHTML=h.slice().reverse().map((entry,i)=>{const date=entry.savedAt?new Date(entry.savedAt).toLocaleString():'Unknown date';return`<div class="history-admin-entry"><div class="history-meta"><b>${String(entry.title||'Saved Tournament').replace(/[&<>"']/g,c=>({'&':'&amp;','<':'&lt;','>':'&gt;','"':'&quot;',"'":'&#39;'}[c]))}</b><div class="small">Saved ${date}</div></div><button class="history-delete" data-delete-history="${i}">Delete</button></div>`}).join('');el.querySelectorAll('[data-delete-history]').forEach(btn=>btn.onclick=async()=>{const reversed=h.slice().reverse(),entry=reversed[Number(btn.dataset.deleteHistory)];await deleteHistoryEntry(entry)})}function render(){syncTeams();syncMaps();appEl.innerHTML='<div class="wrap"><header><h1>Oregano 2v2 Tournament Scorer</h1><p class="small">🔒 Scoring access is protected by email and password.</p><div class="actions"><button id="draw">Randomize Pool Matches</button><button id="resetPool" class="danger">Reset / Hide Pool Play</button><button id="seed">Lock Pool & Create Bracket</button><button id="saveHistory" class="history-save">Save Current Tournament to History</button><button id="logout">Log Out</button><a href="./" style="color:#55d6c2;margin:10px">Public Viewer</a></div></header><section><h2>Pool Play</h2><div id="pool" class="grid"></div></section><section><h2>Standings</h2><div id="standings"></div></section><section><h2>Double Elimination</h2><div id="bracket" class="grid"></div></section><section><h2>Edit Team Names</h2><p class="small">Change the four tournament team names. Names are used for the current tournament and saved History entries.</p><div class="team-name-control"><input id="team1Input" placeholder="Team 1"><input id="team2Input" placeholder="Team 2"><input id="team3Input" placeholder="Team 3"><input id="team4Input" placeholder="Team 4"><button id="saveTeamNames">Save Team Names</button></div><div id="teamNamesStatus" class="save-status"></div></section><section><h2>Map Pool</h2><p class="small">Set the three maps for the next live tournament. The randomizer assigns one of these maps to every current match.</p><div class="map-pool-control"><input id="map1Input" placeholder="Map 1"><input id="map2Input" placeholder="Map 2"><input id="map3Input" placeholder="Map 3"><button id="saveMapPool">Save Map Pool</button><button id="randomizeMaps">Randomize Maps for Every Match</button></div><div id="mapPoolStatus" class="save-status"></div></section><section><h2>Defending Champions</h2><p class="small">This name appears in the Defending Champions box on the public viewer.</p><div class="previous-winner-control"><input id="previousWinnerInput" value="" placeholder="Enter previous winning team"><button id="savePreviousWinner">Save Defending Champions</button></div><div id="previousWinnerStatus" class="save-status"></div></section><section><h2>Tournament History Admin</h2><p class="small">Delete saved tournaments from the History page. This control is only available here on the Admin page.</p><div id="historyAdmin"></div></section></div>';teams.forEach((n,i)=>document.querySelector('#team'+(i+1)+'Input').value=n);state.mapPool.forEach((n,i)=>document.querySelector('#map'+(i+1)+'Input').value=n);document.querySelector('#saveTeamNames').onclick=async()=>{const names=[1,2,3,4].map(i=>document.querySelector('#team'+i+'Input').value.trim());if(names.some(n=>!n)){document.querySelector('#teamNamesStatus').textContent='Enter a name for all 4 teams.';return}if(new Set(names).size!==4){document.querySelector('#teamNamesStatus').textContent='Team names must be unique.';return}teams=[...names];state.teamNames=[...teams];await save();document.querySelector('#teamNamesStatus').textContent='Team names saved ✓';render()};document.querySelector('#saveMapPool').onclick=async()=>{const maps=[1,2,3].map(i=>document.querySelector('#map'+i+'Input').value.trim());if(maps.some(n=>!n)){document.querySelector('#mapPoolStatus').textContent='Enter all 3 map names.';return}if(new Set(maps).size!==3){document.querySelector('#mapPoolStatus').textContent='Map names must be unique.';return}state.mapPool=[...maps];await save();document.querySelector('#mapPoolStatus').textContent='Map pool saved ✓';render()};document.querySelector('#randomizeMaps').onclick=async()=>{syncMaps();randomizeMaps();await save();document.querySelector('#mapPoolStatus').textContent='Maps randomized for every match ✓';render()};document.querySelector('#previousWinnerInput').value=state.previousWinner||'Roman & Preston';document.querySelector('#savePreviousWinner').onclick=async()=>{const v=document.querySelector('#previousWinnerInput').value.trim();if(!v){document.querySelector('#previousWinnerStatus').textContent='Enter a team name first.';return}state.previousWinner=v;await save();document.querySelector('#previousWinnerStatus').textContent='Defending champions saved ✓';};document.querySelector('#saveHistory').onclick=saveHistory;document.querySelector('#draw').onclick=async()=>{state=draw();await save();render()};document.querySelector('#resetPool').onclick=async()=>{if(!confirm('Reset and hide Pool Play from the viewer? This clears the current pool matches, standings data, and bracket.'))return;state={pool:[],poolComplete:false,bracket:null,seeds:null,bracketHidden:true,podiumHidden:true,previousWinner:state.previousWinner||'Roman & Preston',teamNames:[...teams],mapPool:[...state.mapPool],pendingBracketMaps:[]};await save();render()};document.querySelector('#seed').onclick=async()=>{if((state.pool||[]).length!==4||state.pool.some(x=>!finalScore(+x.scoreA,+x.scoreB))){alert('Finish all four pool matches with a final score: 4-0, 4-1, 4-2, 5-3, or 5-4.');return}state.poolComplete=true;state.seeds=standings().map(x=>x.name);state.bracket=null;state.bracketHidden=false;buildBracket();await save();render()};document.querySelector('#logout').onclick=()=>signOut(auth);document.querySelector('#pool').innerHTML=(state.pool||[]).map((m,i)=>card(m,'Pool Match '+(i+1),'pool.'+i)).join('')||'<p>Pool Play is currently hidden. Click Randomize Pool Matches to start a new pool.</p>';document.querySelector('#standings').innerHTML='<table><thead><tr><th>Seed</th><th>Team</th><th>Record</th><th>Round Diff</th><th>Strength of Schedule</th><th>Rounds Won</th><th>Rounds Lost</th></tr></thead><tbody>'+(standings().map((x,i)=>`<tr><td>${i+1}</td><td>${x.name}</td><td>${x.w}-${x.l}</td><td>${x.rd>=0?'+':''}${x.rd}</td><td>${x.sosRank}</td><td>${x.rw}</td><td>${x.rl}</td></tr>`).join(''))+'</tbody></table>';if(!state.poolComplete)document.querySelector('#bracket').innerHTML='<p>Finish pool play and click Lock Pool & Create Bracket.</p>';else{const b=buildBracket();document.querySelector('#bracket').innerHTML=card(b.wb1,'Winners Semi-Final 1','bracket.wb1')+card(b.wb2,'Winners Semi-Final 2','bracket.wb2')+card(b.wbf,'Winners Final','bracket.wbf')+card(b.lb1,'Losers Semi-Final','bracket.lb1')+card(b.lb2,'Losers Final','bracket.lb2')+card(b.fp1,'First Place Match 1','bracket.fp1')+card(b.fp2,'First Place Match 2','bracket.fp2')}renderHistoryAdmin();bind()}function bind(){document.querySelectorAll('[data-score]').forEach(e=>e.onchange=async()=>{const raw=e.value.trim(),v=raw===''?null:Number(raw),p=e.dataset.score.split('.');let o=state;for(let i=0;i<p.length-1;i++)o=o[p[i]];const k=p[p.length-1];if(v!==null&&(!Number.isInteger(v)||v<0||v>5)){alert('Enter a whole number from 0 to 5.');e.value=o[k]??'';return}o[k]=v;if(o.scoreA!=null&&o.scoreB!=null&&!scoreValid(+o.scoreA,+o.scoreB)){alert('Scores must be whole numbers from 0 to 5.');o[k]=null}if(p[0]==='bracket')buildBracket();ensurePoolChoices();await save();render()});document.querySelectorAll('[data-role]').forEach(e=>e.onchange=async()=>{const p=e.dataset.role.split('.');let o=state;for(let i=0;i<p.length;i++)o=o[p[i]];if(e.value==='A'){o.firstTeam=o.a;o.firstSide='Attack'}else if(e.value==='B'){o.firstTeam=o.b;o.firstSide='Attack'}else{o.firstTeam=null;o.firstSide=null}await save();render()})}onAuthStateChanged(auth,u=>{if(u)onSnapshot(ref,async s=>{if(s.exists())state=s.data();syncTeams();syncMaps();const c=ensurePoolChoices();if(c)await save();render()});else login()})}</script></body></html>
