name: One-time bracket status position fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.event.head_commit.message != 'Move bracket PENDING 100px left'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move bracket status 100px left from original
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = "text(x+125,y+h+22,otStatus(q),13,700,'start','#91a7c0')"
          new = "text(x+25,y+h+22,otStatus(q),13,700,'start','#91a7c0')"
          if old not in s:
              raise SystemExit('Target bracket status code not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fix and remove workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/bracket-status-fix.yml
          git commit -m "Move bracket PENDING 100px left"
          git push
          git rm .github/workflows/bracket-status-fix.yml
          git commit -m "Remove one-time bracket status workflow"
          git push
