name: Fix viewer pool play and defending champions placement

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Fix viewer pool play and defending champions placement') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch viewer and admin
        run: |
          python3 - <<'PY'
          from pathlib import Path

          p = Path('index.html')
          s = p.read_text()

          old_css = '.previous-winner{position:static;width:100%;box-sizing:border-box;border:2px solid #293a4a;border-radius:14px;padding:14px 18px;background:#0d151e;margin:16px 0 0}.previous-winner-label{font-size:14px;font-weight:800;color:#fff;margin-bottom:8px}.previous-winner-name{font-size:28px;font-weight:900;color:#d4af37}.site-header{position:relative}@media(max-width:800px){.previous-winner-name{font-size:24px}}'
          new_css = '.previous-winner{position:absolute;top:0;right:0;width:420px;box-sizing:border-box;border:1px solid #293a4a;border-radius:15px;padding:14px 18px;background:linear-gradient(145deg,#121d28,#0d151e)}.previous-winner-label{font-size:14px;font-weight:800;color:#fff;margin-bottom:8px}.previous-winner-name{font-size:28px;font-weight:900;color:#d4af37}.site-header{position:relative;padding-right:450px}@media(max-width:800px){.site-header{padding-right:0}.previous-winner{position:static;width:100%;margin-top:18px}.previous-winner-name{font-size:24px}}'
          if old_css not in s:
              raise SystemExit('viewer previous-winner CSS not found')
          s = s.replace(old_css, new_css, 1)

          old_filter = 'p.filter(x=>x.round===r).map((g,i)=>'
          new_filter = '(()=>{let matches=p.filter(x=>x.round===r);if(!matches.length&&p.length===4)matches=p.slice((r-1)*2,r*2);return matches})().map((g,i)=>'
          if old_filter not in s:
              raise SystemExit('viewer pool filter not found')
          s = s.replace(old_filter, new_filter, 1)
          p.write_text(s)

          p = Path('admin.html')
          s = p.read_text()
          old_pool = "pool:pairs.map((x,i)=>{const m={id:'P'+(i+1),a:x[0],b:x[1],scoreA:null,scoreB:null,firstTeam:null,firstSide:null};autoPoolChoice(m);return m})"
          new_pool = "pool:pairs.map((x,i)=>{const m={id:'P'+(i+1),round:i<2?1:2,a:x[0],b:x[1],scoreA:null,scoreB:null,firstTeam:null,firstSide:null};autoPoolChoice(m);return m})"
          if old_pool not in s:
              raise SystemExit('admin pool generation not found')
          s = s.replace(old_pool, new_pool, 1)
          p.write_text(s)
          PY

          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/fix-viewer-pool.yml
          git add index.html admin.html
          git commit -m 'Fix viewer pool play and defending champions placement'
          git push
