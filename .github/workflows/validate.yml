name: Validate Tournament Site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate site structure and JavaScript syntax
        run: node scripts/validate-site.mjs

      - name: Enforce real map names everywhere
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          s = index.read_text()
          old_get = "function getMatchMap(match,index){const pending=Array.isArray(state.pendingBracketMaps)?state.pendingBracketMaps:[];const pool=Array.isArray(state.mapPool)?state.mapPool.filter(Boolean):[];return match?.map||pending[index]||match?.randomMap||(pool.length?pool[index%pool.length]:'Map TBD')}"
          new_get = "function getMatchMap(match,index){const pending=Array.isArray(state.pendingBracketMaps)?state.pendingBracketMaps:[];const pool=Array.isArray(state.mapPool)?state.mapPool.filter(Boolean):[];const clean=v=>{const x=String(v??'').trim();return x&&x.toLowerCase()!=='random map'&&x.toLowerCase()!=='map tbd'?x:''};return clean(match?.map)||clean(pending[index])||clean(match?.randomMap)||(pool.length?clean(pool[index%pool.length]):'')}"
          if old_get in s:
              s = s.replace(old_get, new_get, 1)

          old_pool = "${g.map||g.randomMap||'Random Map'}"
          new_pool = "${getPoolMap(g,(r-1)*2+i)}"
          if old_pool in s:
              s = s.replace(old_pool, new_pool, 1)

          marker = "function badge(m,t){"
          helper = "function getPoolMap(match,index){const pool=Array.isArray(state.mapPool)?state.mapPool.filter(Boolean):[];const clean=v=>{const x=String(v??'').trim();return x&&x.toLowerCase()!=='random map'&&x.toLowerCase()!=='map tbd'?x:''};return clean(match?.map)||clean(match?.randomMap)||(pool.length?clean(pool[index%pool.length]):'')}"
          if helper not in s and marker in s:
              s = s.replace(marker, helper + marker, 1)
          index.write_text(s)

          admin = Path('admin.html')
          a = admin.read_text()
          old_sync = "if (!Array.isArray(state.pendingBracketMaps)) state.pendingBracketMaps = [];"
          new_sync = "if (!Array.isArray(state.pendingBracketMaps)) state.pendingBracketMaps = []; state.mapPool = state.mapPool.map(x => String(x || '').trim()).filter(x => x && x.toLowerCase() !== 'random map');"
          if old_sync in a and new_sync not in a:
              a = a.replace(old_sync, new_sync, 1)
          admin.write_text(a)

          forbidden = []
          for p in Path('.').rglob('*'):
              if not p.is_file() or '.git' in p.parts or p.suffix.lower() not in {'.html','.js','.mjs','.css','.py'}:
                  continue
              try:
                  text = p.read_text()
              except UnicodeDecodeError:
                  continue
              if "||'Random Map'" in text or '||"Random Map"' in text:
                  forbidden.append(str(p))
          if forbidden:
              raise SystemExit('Random Map fallback remains in executable code: ' + ', '.join(forbidden))
          PY

          if git diff --quiet -- index.html admin.html; then
            echo "Map enforcement already applied"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html admin.html
          git commit -m "fix: never render Random Map placeholder [skip ci]"
          git push
