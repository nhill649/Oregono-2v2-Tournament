name: Validate Tournament Site

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Setup Node
        uses: actions/setup-node@v4
        with:
          node-version: 22

      - name: Validate site structure and JavaScript syntax
        run: node scripts/validate-site.mjs

      - name: Apply surgical map display fix
        if: github.event_name == 'push'
        env:
          GH_TOKEN: ${{ github.token }}
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          def patch_page(filename):
              p = Path(filename)
              s = p.read_text()

              # Never leave the placeholder text in the source.
              s = s.replace('Random Map', '')
              s = s.replace('random map', '')

              if filename == 'index.html':
                  # Prefer a real saved/pending/configured map and reject any
                  # stale placeholder value that may already exist in Firebase.
                  old = re.search(r'function getMatchMap\(match,index\)\{.*?\}', s)
                  new = "function getMatchMap(match,index){const pending=Array.isArray(state.pendingBracketMaps)?state.pendingBracketMaps:[];const pool=Array.isArray(state.mapPool)?state.mapPool.filter(Boolean):[];const clean=v=>{const x=String(v||'').trim();return x&&x.toLowerCase()!=='random map'?x:null};return clean(match?.map)||clean(pending[index])||clean(match?.randomMap)||(pool.length?pool[index%pool.length]:'')}"
                  if old:
                      s = s[:old.start()] + new + s[old.end():]

              # Final display guard: if old tournament data contains the stale
              # placeholder, remove it from rendered text without changing any
              # scores, teams, bracket state, or Firebase data.
              guard = "<script>const __removeRandomMapPlaceholder=()=>{const w=document.createTreeWalker(document.body,NodeFilter.SHOW_TEXT);const n=[];while(w.nextNode())n.push(w.currentNode);for(const x of n){if(x.nodeValue&&/random map/i.test(x.nodeValue))x.nodeValue=x.nodeValue.replace(/random map/gi,'')}};new MutationObserver(__removeRandomMapPlaceholder).observe(document.body,{subtree:true,childList:true,characterData:true});__removeRandomMapPlaceholder();</script>"
              if '__removeRandomMapPlaceholder' not in s:
                  s = s.replace('</body>', guard + '</body>')

              p.write_text(s)

          patch_page('index.html')
          patch_page('admin.html')
          PY

          if git diff --quiet -- index.html admin.html; then
            echo "No map display patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html admin.html
          git commit -m "fix: never display random map placeholder [skip ci]"
          git push
