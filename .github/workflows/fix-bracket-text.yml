name: Fix bracket text
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply ONLY requested bracket text changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text()
          old = "B.push(text(x,y+h+22,bracketMap,17,700,'start','#fff'),text(x+53,y+h+22,otStatus(q),17,700,'start','#fff'))"
          new = "B.push(text(x,y+h+22,bracketMap,17,700,'start','#fff'),text(x+68,y+h+22,otStatus(q),17,700,'start','#fff'))"
          if old not in s:
              raise SystemExit('Could not find exact bracket map/PENDING renderer')
          p.write_text(s.replace(old, new, 1))
          print('Map text x unchanged. PENDING/status moved from x+53 to x+68 (+15px).')
          PY
      - name: Commit and push live change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Move bracket PENDING text 15px right' || exit 0
          git push
