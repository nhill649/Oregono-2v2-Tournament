name: Fix bracket text
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move viewer bracket PENDING text 10px left
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = "text(x+158,y+h+22,otStatus(q),17,700,'start','#fff')"
          new = "text(x+148,y+h+22,otStatus(q),17,700,'start','#fff')"
          if old not in s:
              raise SystemExit('Expected viewer bracket status position was not found')
          s = s.replace(old, new, 1)
          p.write_text(s)
          PY
      - name: Commit and push
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html
          git diff --cached --quiet || git commit -m "Move viewer bracket PENDING text 10px left"
          git push
