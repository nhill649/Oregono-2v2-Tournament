name: Fix bracket text
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply ONLY the PENDING position change
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text()
          pattern = r"text\(x\+(\d+),y\+h\+22,otStatus\(q\),"
          m = re.search(pattern, s)
          if not m:
              raise SystemExit('Could not find PENDING renderer')
          current = int(m.group(1))
          if current == 65:
              raise SystemExit('PENDING already at requested position')
          replacement = f'text(x+{current+20},y+h+22,otStatus(q),'
          s2 = s[:m.start()] + replacement + s[m.end():]
          p.write_text(s2)
          PY
      - name: Commit only the PENDING position change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Move bracket PENDING text 20px right' || exit 0
          git push
