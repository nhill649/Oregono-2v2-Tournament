name: Fix bracket text
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move viewer bracket PENDING text 10px left
        run: |
          python - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          s=s.replace('PENDING', 'PENDING')
          # Viewer bracket pending labels use text-anchor="middle"; shift only those labels left by 10px.
          import re
          s=re.sub(r'(text\(\s*([0-9]+(?:\.[0-9]+)?)\s*,\s*[^,]+\s*,\s*[\'\"]PENDING[\'\"])', lambda m: m.group(1).replace(m.group(2), str(float(m.group(2))-10).rstrip('0').rstrip('.'), 1), s)
          p.write_text(s)
          PY
      - name: Commit change
        run: |
          git config user.name github-actions
          git config user.email github-actions@github.com
          git add index.html
          git diff --cached --quiet || git commit -m "Move viewer bracket PENDING text 10px left"
          git push
