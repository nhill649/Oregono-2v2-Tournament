name: Fix bracket text
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply bracket text changes
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = "text(x+100,y+h+22,bracketMap,13,700,'start','#91a7c0'),text(x+100,y+h+22,otStatus(q),13,700,'start','#91a7c0')"
          if old not in s:
              old = "text(x+100,y+h+22,bracketMap,15,700,'start','#91a7c0'),text(x+25,y+h+22,otStatus(q),15,700,'start','#91a7c0')"
          new = "text(x+100,y+h+22,bracketMap,17,700,'start','#fff'),text(x+45,y+h+22,otStatus(q),17,700,'start','#fff')"
          if old not in s:
              raise SystemExit('target text not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit actual index.html change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Apply bracket pending and map text changes' || exit 0
          git push
