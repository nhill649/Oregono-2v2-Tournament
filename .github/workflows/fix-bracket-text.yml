name: Fix bracket text
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move ONLY bracket PENDING/status 15px right
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text()
          pattern = r"text\(x\+(\d+),y\+h\+22,otStatus\(q\),17,700,'start','#fff'\)"
          m = re.search(pattern, s)
          if not m:
              raise SystemExit('Could not find the actual bracket status renderer')
          old_x = int(m.group(1))
          new_x = old_x + 15
          replacement = f"text(x+{new_x},y+h+22,otStatus(q),17,700,'start','#fff')"
          s = s[:m.start()] + replacement + s[m.end():]
          p.write_text(s)
          print(f'PENDING/status moved from x+{old_x} to x+{new_x}. Map renderer was not changed.')
          PY
      - name: Commit and push live change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Move bracket PENDING text 15px right' || exit 0
          git push
