name: Fix bracket text
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move ONLY bracket PENDING/status 15px right and center viewer standings numbers
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re
          p = Path('index.html')
          s = p.read_text()

          # Keep the bracket map text exactly where it is; move only the PENDING/status text 15px right.
          pattern = r"text\(x\+(\d+),y\+h\+22,otStatus\(q\),17,700,'start','#fff'\)"
          m = re.search(pattern, s)
          if m:
              old_x = int(m.group(1))
              new_x = old_x + 15
              replacement = f"text(x+{new_x},y+h+22,otStatus(q),17,700,'start','#fff')"
              s = s[:m.start()] + replacement + s[m.end():]
              print(f'PENDING/status moved from x+{old_x} to x+{new_x}. Map renderer was not changed.')
          else:
              print('Bracket status renderer already updated or not found; leaving it unchanged.')

          # Viewer Pool Standings: center every numeric/value column except Team.
          css = '#standings td:not(:nth-child(2)){text-align:center}'
          if css not in s:
              marker = '</style>'
              if marker not in s:
                  raise SystemExit('Could not find closing style tag')
              s = s.replace(marker, css + marker, 1)
              print('Centered Seed, Record, Round Diff, Strength of Schedule, Rounds Won, and Rounds Lost values.')
          else:
              print('Viewer standings centering rule already present.')

          p.write_text(s)
          PY
      - name: Commit and push live change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Center viewer pool standings numbers' || exit 0
          git push
