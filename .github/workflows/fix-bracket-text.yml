name: Fix bracket text
on:
  workflow_dispatch:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply bracket and viewer standings positioning
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()

          # Bracket: move ONLY the PENDING/status text 5px left from its current 15px-right position. Map position is untouched.
          old = "text(x+15,y+h+22,otStatus(q),17,700,'start','#fff')"
          new = "text(x+10,y+h+22,otStatus(q),17,700,'start','#fff')"
          if old in s:
              s = s.replace(old, new, 1)
              print('Moved viewer bracket PENDING/status text 5px left.')
          elif new in s:
              print('Viewer bracket PENDING/status text is already 5px left.')
          else:
              raise SystemExit('Could not find viewer bracket PENDING/status positioning')

          # Viewer Pool Standings: force the numeric/value cells themselves to center.
          old = '<td>${i+1}</td><td>${t.name}</td><td>${t.w}-${t.l}</td><td>${t.rd>0?\'+\':\'\'}${t.rd}</td><td>${t.sosRank}</td><td>${t.rw}</td><td>${t.rl}</td>'
          new = '<td style="text-align:center">${i+1}</td><td>${t.name}</td><td style="text-align:center">${t.w}-${t.l}</td><td style="text-align:center">${t.rd>0?\'+\':\'\'}${t.rd}</td><td style="text-align:center">${t.sosRank}</td><td style="text-align:center">${t.rw}</td><td style="text-align:center">${t.rl}</td>'
          if old in s:
              s = s.replace(old, new, 1)
              print('Applied inline centering to all viewer Pool Standings values except Team.')
          elif 'style="text-align:center">${i+1}' in s:
              print('Viewer Pool Standings inline centering already applied.')
          else:
              raise SystemExit('Could not find viewer Pool Standings row renderer')

          p.write_text(s)
          PY
      - name: Commit and push live change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Move viewer bracket PENDING text 5px left' || exit 0
          git push
