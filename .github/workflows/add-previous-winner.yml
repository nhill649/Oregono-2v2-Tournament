name: Add previous winner box

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Add previous winner box
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()

          css = '''\n.previous-winner{position:absolute;top:28px;right:28px;width:420px;box-sizing:border-box;border:2px solid #293a4a;border-radius:4px;padding:14px 18px;background:#0d151e}.previous-winner-label{font-size:14px;font-weight:800;color:#fff;margin-bottom:8px}.previous-winner-name{font-size:28px;font-weight:900;color:#d4af37}.site-header{position:relative;padding-right:470px}@media(max-width:800px){.site-header{padding-right:0}.previous-winner{position:static;width:100%;margin-top:18px}.previous-winner-name{font-size:24px}}\n'''
          if '.previous-winner{' not in s:
              s = s.replace('</style>', css + '</style>', 1)

          old = '<header><div class="accent">RAINBOW SIX SIEGE • 2V2 TOURNAMENT</div><h1>Oregano 2v2 Tournament</h1><p>Live pool play → seeded double elimination</p></header>'
          new = '<header class="site-header"><div class="accent">RAINBOW SIX SIEGE • 2V2 TOURNAMENT</div><h1>Oregano 2v2 Tournament</h1><p>Live pool play → seeded double elimination</p><div class="previous-winner"><div class="previous-winner-label">Previous Winner</div><div class="previous-winner-name">Roman &amp; Preston</div></div></header>'
          if 'class="previous-winner"' not in s:
              if old not in s:
                  raise SystemExit('Expected header not found')
              s = s.replace(old, new, 1)

          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          if git diff --cached --quiet; then exit 0; fi
          git commit -m "Add previous winner box"
          git push
