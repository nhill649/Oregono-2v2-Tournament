name: Apply history reset fix

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: github.actor != 'github-actions[bot]'
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch Reset / Hide Pool Play
        shell: python
        run: |
          from pathlib import Path
          p = Path('admin.html')
          text = p.read_text(encoding='utf-8')
          old = '''          state = {
            pool: [], poolComplete: false, bracket: null, seeds: null,
            bracketHidden: true, podiumHidden: true,
            previousWinner: state.previousWinner || DEFAULT_CHAMPION,
            teamNames: [...teams], mapPool: [...state.mapPool], pendingBracketMaps: []
          };'''
          new = '''          state = {
            ...state,
            pool: [], poolComplete: false, bracket: null, seeds: null,
            bracketHidden: true, podiumHidden: true,
            previousWinner: state.previousWinner || DEFAULT_CHAMPION,
            teamNames: [...teams], mapPool: [...state.mapPool], pendingBracketMaps: []
          };'''
          if old not in text:
              raise SystemExit('Expected Reset / Hide Pool Play block was not found.')
          p.write_text(text.replace(old, new, 1), encoding='utf-8')
      - name: Commit patched admin page and remove this workflow
        shell: bash
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html
          git rm .github/workflows/apply-history-reset-fix.yml
          git commit -m 'Fix Reset / Hide Pool Play preserving tournament history'
          git push
