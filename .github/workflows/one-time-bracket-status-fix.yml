name: One-time bracket status fix
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move bracket status left 25px
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = "text(x+125,y+h+22,otStatus(q),13,700,'start','#91a7c0')"
          new = "text(x+100,y+h+22,otStatus(q),13,700,'start','#91a7c0')"
          if old not in s:
              raise SystemExit('Target bracket status code not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit and remove temporary workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html .github/workflows/one-time-bracket-status-fix.yml
          git rm .github/workflows/one-time-bracket-status-fix.yml
          git commit -m "Move bracket status 25px left"
          git push