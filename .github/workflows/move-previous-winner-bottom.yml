name: Move previous winner box to bottom

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  patch:
    if: ${{ !contains(github.event.head_commit.message, 'Move previous winner box to bottom') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Move previous winner box
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old_css = '.previous-winner{position:absolute;top:28px;right:28px;width:420px;box-sizing:border-box;border:2px solid #293a4a;border-radius:14px;padding:14px 18px;background:#0d151e}.previous-winner-label{font-size:14px;font-weight:800;color:#fff;margin-bottom:8px}.previous-winner-name{font-size:28px;font-weight:900;color:#d4af37}.site-header{position:relative;padding-right:470px}@media(max-width:800px){.site-header{padding-right:0}.previous-winner{position:static;width:100%;margin-top:18px}.previous-winner-name{font-size:24px}}'
          new_css = '.previous-winner{position:static;width:100%;box-sizing:border-box;border:2px solid #293a4a;border-radius:14px;padding:14px 18px;background:#0d151e;margin:16px 0 0}.previous-winner-label{font-size:14px;font-weight:800;color:#fff;margin-bottom:8px}.previous-winner-name{font-size:28px;font-weight:900;color:#d4af37}.site-header{position:relative}@media(max-width:800px){.previous-winner-name{font-size:24px}}'
          if old_css not in s:
              raise SystemExit('previous winner CSS not found')
          s = s.replace(old_css, new_css, 1)
          marker = "const db=getFirestore(initializeApp(cfg)),ref=doc(db,'tournaments','oregano-2v2'),teams=['Memphis & Sam','Preston & Roman','Eli & Sanath','Nolan & Xavier'];let state={previousWinner:'Roman & Preston'};"
          replacement = marker + "\nconst previousWinnerBox=document.querySelector('.previous-winner');if(previousWinnerBox){document.querySelector('.wrap').appendChild(previousWinnerBox)}"
          if marker not in s:
              raise SystemExit('script marker not found')
          s = s.replace(marker, replacement, 1)
          p.write_text(s)
          PY
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git rm .github/workflows/move-previous-winner-bottom.yml
          git add index.html
          git commit -m 'Move previous winner box to bottom'
          git push
