name: Fix live map display

on:
  push:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch map display
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import re

          p = Path('index.html')
          s = p.read_text()

          old = re.search(r'function getMatchMap\(match,index\)\{.*?\}\nfunction getPoolMap\(match,index\)\{.*?\}function badge', s)
          new = """function cleanMap(v){const x=String(v??'').trim();return x&&x.toLowerCase()!=='random map'&&x.toLowerCase()!=='map tbd'?x:''}
function getMatchMap(match,index){const pending=Array.isArray(state.pendingBracketMaps)?state.pendingBracketMaps:[];const poolMatches=Array.isArray(state.pool)?state.pool:[];const poolAssigned=poolMatches.map(g=>cleanMap(g?.map));return cleanMap(match?.map)||cleanMap(pending[index])||cleanMap(match?.randomMap)||cleanMap(poolAssigned[index])||cleanMap(state.mapPool?.[index%Math.max((state.mapPool||[]).length,1)])||''}
function getPoolMap(match,index){const pool=Array.isArray(state.pool)?state.pool:[];return cleanMap(match?.map)||cleanMap(match?.randomMap)||cleanMap(pool[index]?.map)||cleanMap(state.mapPool?.[index%Math.max((state.mapPool||[]).length,1)])||''}function badge"""
          if old:
              s = s[:old.start()] + new + s[old.end():]

          p.write_text(s)
          PY

          if git diff --quiet -- index.html; then
            echo "No patch needed"
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "fix: show selected maps before tournament starts [skip ci]"
          git push
