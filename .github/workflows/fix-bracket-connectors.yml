name: Fix bracket connectors

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  fix:
    if: ${{ github.event.head_commit.message != 'Fix bracket connectors' }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v6
      - name: Fix bracket connector geometry
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old='''if(id!==\'fp2\'&&q.a!==\'TBD\'&&q.b!==\'TBD\')B.push(`<path d="M${x+w} ${y+h/2}H${x+w+38}V${id===\'wb1\'||id===\'wb2\'?340:id===\'lb1\'?795:id===\'wbf\'?415:id===\'lb2\'?415:415}H${x+w+38}" fill="none" stroke="#293a4a" stroke-width="2"/>`)'''
          new='''if(id==='wb1'||id==='wb2'){let targetY=355;B.push(`<path d="M${x+w} ${y+h/2}H${x+w+38}V${targetY}H465" fill="none" stroke="#293a4a" stroke-width="2"/>`)}else if(id==='lb1'){B.push(`<path d="M${x+w} ${y+h/2}H465" fill="none" stroke="#293a4a" stroke-width="2"/>`)}else if(id==='wbf'){B.push(`<path d="M${x+w} ${y+h/2}H${x+w+50}V430H870" fill="none" stroke="#293a4a" stroke-width="2"/>`)}else if(id==='lb2'){B.push(`<path d="M${x+w} ${y+h/2}H${x+w+50}V430H870" fill="none" stroke="#293a4a" stroke-width="2"/>`)}else if(id==='fp1'){B.push(`<path d="M${x+w} ${y+h/2}H1220" fill="none" stroke="#293a4a" stroke-width="2"/>`)}'''
          if old not in s:
              raise SystemExit('Target connector code was not found; no changes made.')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit fix
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git diff --cached --quiet && exit 0
          git commit -m "Fix bracket connectors"
          git push
