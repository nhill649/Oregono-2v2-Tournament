name: Make round headers white

on:
  workflow_dispatch:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Make bracket round headers white
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          replacements = {
            "text(190,55,'ROUND 1',20,700,'middle','#91a7c0')": "text(190,55,'ROUND 1',20,700,'middle','#fff')",
            "text(190,82,'WINNER BRACKET SEMI-FINALS',14,400,'middle','#91a7c0')": "text(190,82,'WINNER BRACKET SEMI-FINALS',14,400,'middle','#fff')",
            "text(190,102,'& LOSER BRACKET SEMI-FINALS',14,400,'middle','#91a7c0')": "text(190,102,'& LOSER BRACKET SEMI-FINALS',14,400,'middle','#fff')",
            "text(615,55,'ROUND 2',20,700,'middle','#91a7c0')": "text(615,55,'ROUND 2',20,700,'middle','#fff')",
            "text(615,82,'WINNER BRACKET FINAL',14,400,'middle','#91a7c0')": "text(615,82,'WINNER BRACKET FINAL',14,400,'middle','#fff')",
            "text(615,102,'& LOSER BRACKET FINAL',14,400,'middle','#91a7c0')": "text(615,102,'& LOSER BRACKET FINAL',14,400,'middle','#fff')",
            "text(1000,55,'ROUND 3',20,700,'middle','#91a7c0')": "text(1000,55,'ROUND 3',20,700,'middle','#fff')",
            "text(1000,82,'FIRST PLACE MATCH 1',14,400,'middle','#91a7c0')": "text(1000,82,'FIRST PLACE MATCH 1',14,400,'middle','#fff')",
            "text(1350,55,'IF NECESSARY',20,700,'middle','#91a7c0')": "text(1350,55,'IF NECESSARY',20,700,'middle','#fff')",
            "text(1350,82,'FIRST PLACE MATCH 2',14,400,'middle','#91a7c0')": "text(1350,82,'FIRST PLACE MATCH 2',14,400,'middle','#fff')",
          }
          for a,b in replacements.items():
              s = s.replace(a,b)
          p.write_text(s)
          PY
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add index.html
          git commit -m "Make bracket round headers white"
          git push
