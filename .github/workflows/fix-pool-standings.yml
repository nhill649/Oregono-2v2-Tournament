name: Fix pool standings centering

on:
  push:

permissions:
  contents: write

jobs:
  fix:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Apply standings centering fix
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = '#standings td:not(:nth-child(2)){text-align:center}'
          new = '#standings th:not(:nth-child(2)),#standings td:not(:nth-child(2)){text-align:center!important;vertical-align:middle}'
          if old not in s:
              raise SystemExit('Expected standings CSS was not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit fix and remove temporary workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git rm .github/workflows/fix-pool-standings.yml
          git commit -m 'Fix pool standings number centering'
          git push
