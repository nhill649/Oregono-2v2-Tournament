name: Update map status display

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  update:
    if: ${{ !contains(github.event.head_commit.message, 'Apply map name to match status display') }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update status text
        run: |
          python - <<'PY'
          from pathlib import Path
          p = Path('index.html')
          s = p.read_text()
          old = "<div class=\"small\">${otStatus(g)}</div>"
          new = "<div class=\"small\">${g.map || g.randomMap || 'Random Map'} ${otStatus(g)}</div>"
          if old not in s:
              raise SystemExit('status display pattern not found')
          p.write_text(s.replace(old, new, 1))
          PY
      - name: Commit change
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git commit -m 'Apply map name to match status display'
          git push