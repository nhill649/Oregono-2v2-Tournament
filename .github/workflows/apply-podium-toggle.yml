name: Apply podium toggle
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  apply:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch admin and viewer
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          p = Path('admin.html')
          s = p.read_text()
          s = s.replace('let state={pool:[],poolComplete:false,bracket:null,seeds:null,bracketHidden:false};','let state={pool:[],poolComplete:false,bracket:null,seeds:null,bracketHidden:false,podiumHidden:true};')
          s = s.replace("bracketHidden:false}}async function save()", "bracketHidden:false,podiumHidden:true}}async function save()")
          s = s.replace("<button id=\"seed\">Lock Pool & Create Bracket</button><button id=\"logout\">", "<button id=\"seed\">Lock Pool & Create Bracket</button><button id=\"togglePodium\">'+(state.podiumHidden?'Show Podium to Viewer':'Hide Podium from Viewer')+'</button><button id=\"logout\">")
          s = s.replace("document.querySelector('#seed').onclick=async()=>{", "document.querySelector('#togglePodium').onclick=async()=>{state.podiumHidden=!state.podiumHidden;await save();render()};document.querySelector('#seed').onclick=async()=>{")
          s = s.replace("state={pool:[],poolComplete:false,bracket:null,seeds:null,bracketHidden:true};", "state={pool:[],poolComplete:false,bracket:null,seeds:null,bracketHidden:true,podiumHidden:true};")
          p.write_text(s)

          p = Path('index.html')
          s = p.read_text()
          s = s.replace("if(!fourth){panel.style.display='none';el.innerHTML='';return}panel.style.display='block';", "if(!fourth || state.podiumHidden===true){panel.style.display='none';el.innerHTML='';return}panel.style.display='block';")
          p.write_text(s)
          PY
      - name: Commit changes and remove workflow
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html index.html
          git rm .github/workflows/apply-podium-toggle.yml
          git commit -m 'Add admin podium visibility toggle'
          git push
