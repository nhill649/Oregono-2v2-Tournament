name: Format admin page once

on:
  push:
    branches: [main]

permissions:
  contents: write

jobs:
  format:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Format admin.html
        run: npx --yes prettier@3 --write admin.html
      - name: Commit formatted file
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add admin.html
          git diff --cached --quiet && exit 0
          git commit -m 'chore: format admin page once'
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          git rm -f .github/workflows/format-admin-once.yml || true
          git diff --cached --quiet && exit 0
          git commit -m 'chore: remove temporary formatter workflow'
          git push
