name: Apply tournament styling update

on:
  push:
    paths:
      - '.github/style-update.trigger'

permissions:
  contents: write

jobs:
  update:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Update winner styling
        run: |
          python3 - <<'PY'
          from pathlib import Path

          index = Path('index.html')
          s = index.read_text()

          s = s.replace('.row.win{font-weight:900;color:#55d6c2}.winner-row{border:1px solid #55d6c2;border-radius:8px;background:rgba(85,214,194,.07)}', '.row.win{font-weight:900;color:#55d6c2}.winner-row{font-weight:900}#pool .row.winner-row>div{color:#55d6c2;font-weight:900}')

          old_rects = '<g fill="#666" stroke="#777"><rect x="50" y="165" width="340" height="130" rx="5"/><rect x="50" y="410" width="340" height="130" rx="5"/><rect x="50" y="730" width="340" height="130" rx="5"/><rect x="465" y="290" width="305" height="130" rx="5"/><rect x="465" y="730" width="305" height="130" rx="5"/><rect x="870" y="365" width="305" height="130" rx="5"/><rect x="1220" y="365" width="305" height="130" rx="5"/></g>'
          new_rects = '<g fill="#666" stroke="#777"><rect id="wb1-box" x="50" y="165" width="340" height="130" rx="5"/><rect id="wb2-box" x="50" y="410" width="340" height="130" rx="5"/><rect id="lb1-box" x="50" y="730" width="340" height="130" rx="5"/><rect id="wbf-box" x="465" y="290" width="305" height="130" rx="5"/><rect id="lbf-box" x="465" y="730" width="305" height="130" rx="5"/><rect id="fp1-box" x="870" y="365" width="305" height="130" rx="5"/><rect id="fp2-box" x="1220" y="365" width="305" height="130" rx="5"/></g>'
          s = s.replace(old_rects, new_rects)

          start = s.index('<g id="winner-highlights"')
          end = s.index('</g>', start) + 4
          s = s[:start] + s[end:]

          old_style = "function setWinnerStyle(prefix,m){const w=winner(m);['a','b'].forEach(side=>{const win=w&&m?.[side]===w;const rect=document.getElementById(`${prefix}${side==='a'?'a':'b'}-win`);if(rect)rect.setAttribute('display',win?'block':'none');['name','score'].forEach(kind=>{const e=document.getElementById(`${prefix}${side==='a'?'a':'b'}-${kind}`);if(e)e.setAttribute('font-weight',win?'900':'400')})})}"
          new_style = "function setWinnerStyle(prefix,m){const w=winner(m);const boxId={'wb1':'wb1-box','wb2':'wb2-box','lb1':'lb1-box','wbf-':'wbf-box','lbf-':'lbf-box','fp1-':'fp1-box','fp2-':'fp2-box'}[prefix];const box=document.getElementById(boxId);if(box){const won=!!w;box.setAttribute('fill',won?'#55d6c2':'#666');box.setAttribute('fill-opacity',won?'.22':'1');box.setAttribute('stroke',won?'#55d6c2':'#777')}['a','b'].forEach(side=>{const win=w&&m?.[side]===w;['name','score'].forEach(kind=>{const e=document.getElementById(`${prefix}${side}-${kind}`);if(e)e.setAttribute('font-weight',win?'900':'400')})})}"
          s = s.replace(old_style, new_style)
          index.write_text(s)

          admin = Path('admin.html')
          a = admin.read_text()
          a = a.replace('.row.winner-row{border:2px solid #55d6c2;background:rgba(85,214,194,.07);font-weight:900}', '.row.winner-row{font-weight:900}#pool .row.winner-row span{color:#55d6c2;font-weight:900}')
          admin.write_text(a)
          PY
      - name: Commit styling update
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html admin.html
          git diff --cached --quiet || git commit -m 'Adjust pool and bracket winner styling'
          git push
