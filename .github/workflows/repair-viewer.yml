name: Repair viewer
on:
  push:
    branches: [main]
    paths: [".github/workflows/repair-viewer.yml"]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch viewer and history bracket
        run: |
          python - <<'PY'
          from pathlib import Path
          import re

          # Keep the existing live-viewer repair.
          p=Path('index.html')
          s=p.read_text()
          old="const cfg={apiKey:'AIzaSyBEuP98gu80mX1J2xKSGqYsVYG8uEk-I',authDomain:'oregano-2v2-tournament.firebaseapp.com',projectId:'oregano-2v2-tournament',storageBucket:'oregano-2v2-tournament.firebasestorage.app',messagingSenderId:'921367151742',appId:'1:921367151742:web:d658598249ee300feb042f'};\nconst db=getFirestore(initializeApp(cfg)),ref=doc(db,'tournaments','oregano-2v2'),teams="
          new="const db=getFirestore(initializeApp(firebaseConfig)),ref=doc(db,'tournaments','oregano-2v2'),teams="
          if old in s:
              s=s.replace("import{getFirestore,doc,onSnapshot}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js';", "import{getFirestore,doc,onSnapshot}from'https://www.gstatic.com/firebasejs/12.1.0/firebase-firestore.js';\nimport{firebaseConfig}from'./firebase-config.js';")
              s=s.replace(old,new)
          s=s.replace("let matches=p.filter(x=>x.round===r);", "let matches=p.filter(x=>Number(x.round)===r);")
          s=s.replace("if(!matches.length&&p.length===4)matches=p.slice((r-1)*2,r*2);", "if(!matches.length&&p.length>=4)matches=p.slice((r-1)*2,r*2);")
          s=s.replace("function render(){document.querySelector('#previousWinnerName').textContent=state.previousWinner||'Roman & Preston';renderPool();renderStandings();draw();renderPodium()}\nonSnapshot(ref,s=>{if(s.exists()){state={...state,...s.data()};render()}});", "function render(){document.querySelector('#previousWinnerName').textContent=state.previousWinner||'Roman & Preston';renderPool();renderStandings();draw();renderPodium()}\nconst setup=document.querySelector('#setup');\nonSnapshot(ref,s=>{if(s.exists()){state={...state,...s.data()};setup.textContent='Live tournament connected ✓';render()}else{setup.textContent='Live tournament connected ✓';render()}},e=>{console.error(e);setup.textContent='Unable to connect to live tournament';});")
          p.write_text(s)

          # Align every history bracket connector cleanly between match boxes.
          h=Path('history.html')
          hs=h.read_text()
          new_bracket=r'''function bracketSVG(s){const b=bracket(s);const cells=[['wb1',b.wb1,40,100,'Winners Semi-Final 1'],['wb2',b.wb2,40,300,'Winners Semi-Final 2'],['lb1',b.lb1,40,520,'Losers Round 1'],['wbf',b.wbf,400,200,'Winners Final'],['lb2',b.lb2,400,520,'Losers Round 2'],['fp1',b.fp1,760,360,'Grand Final'],['fp2',b.fp2,1120,360,'Reset Final']];let o=[`<svg class="bracket-svg" viewBox="0 0 1460 760" xmlns="http://www.w3.org/2000/svg"><rect width="1460" height="760" fill="#080c11"/><text x="190" y="45" fill="#fff" font-size="20" font-weight="700" text-anchor="middle">ROUND 1</text><text x="550" y="45" fill="#fff" font-size="20" font-weight="700" text-anchor="middle">ROUND 2</text><text x="910" y="45" fill="#fff" font-size="20" font-weight="700" text-anchor="middle">ROUND 3</text><text x="1270" y="45" fill="#fff" font-size="20" font-weight="700" text-anchor="middle">IF NECESSARY</text>`];
const line=d=>o.push(`<path d="${d}" fill="none" stroke="#293a4a" stroke-width="3" stroke-linecap="round" stroke-linejoin="round"/>`);
line('M340 160H370V260H400');line('M340 360H370V260H400');
line('M340 220H350V580H40');line('M340 420H350V580H40');
line('M700 260H730V580H700');line('M340 580H400');
line('M700 260H730V420H760');line('M700 580H730V420H760');
line('M1060 420H1120');
for(const [id,m,x,y,label] of cells){const wa=winner(m)===m.a,wb=winner(m)===m.b;o.push(`<text x="${x}" y="${y-12}" fill="#91a7c0" font-size="12">${label}</text><rect x="${x}" y="${y}" width="300" height="120" rx="8" fill="#101a24" stroke="#293a4a"/><path d="M${x} ${y+60}h300" stroke="#293a4a"/><text x="${x+14}" y="${y+36}" fill="${wa?'#55d6c2':'#fff'}" font-size="16" font-weight="${wa?900:400}">${team(s,m.a)}</text><text x="${x+286}" y="${y+36}" fill="${wa?'#55d6c2':'#fff'}" font-size="16" text-anchor="end">${m.scoreA??'TBD'}</text><text x="${x+14}" y="${y+96}" fill="${wb?'#55d6c2':'#fff'}" font-size="16" font-weight="${wb?900:400}">${team(s,m.b)}</text><text x="${x+286}" y="${y+96}" fill="${wb?'#55d6c2':'#fff'}" font-size="16" text-anchor="end">${m.scoreB??'TBD'}</text>`)}return o.join('')+'</svg>'}'''
          hs=re.sub(r'function bracketSVG\(s\)\{.*?\}\nfunction podium', new_bracket+'\nfunction podium', hs, count=1, flags=re.S)
          h.write_text(hs)
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          if git diff --quiet; then exit 0; fi
          git add index.html history.html
          git commit -m "Align history bracket connectors"
          git push
