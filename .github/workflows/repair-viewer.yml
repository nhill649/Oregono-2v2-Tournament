name: Repair viewer
on:
  push:
    branches: [main]
    paths: [".github/workflows/repair-viewer.yml"]
permissions:
  contents: write
jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Align history bracket
        run: |
          python - <<'PY'
          from pathlib import Path
          h=Path('history.html')
          s=h.read_text()
          old="const line=d=>o.push(`<path d=\\\"${d}\\\" fill=\\\"none\\\" stroke=\\\"#293a4a\\\" stroke-width=\\\"3\\\" stroke-linecap=\\\"round\\\" stroke-linejoin=\\\"round\\\"/>`);line('M340 160H370V260H400');line('M340 360H370V260H400');line('M340 220H350V580H40');line('M340 420H350V580H40');line('M700 260H730V580H700');line('M340 580H400');line('M700 260H730V420H760');line('M700 580H730V420H760');line('M1060 420H1120');"
          new="const line=d=>o.push(`<path d=\\\"${d}\\\" fill=\\\"none\\\" stroke=\\\"#293a4a\\\" stroke-width=\\\"3\\\" stroke-linecap=\\\"round\\\" stroke-linejoin=\\\"round\\\"/>`);line('M340 160H370V260H400');line('M340 360H390V580H400');line('M340 220H370V580H400');line('M340 420H390V580H400');line('M700 260H730V420H760');line('M700 260H730V580H760');line('M700 580H760');line('M1060 580H1090V420H1060');line('M1060 420H1120');"
          s=s.replace(old,new)
          s=s.replace("if(id!=='fp2')o.push(`<path d=\\\"M${x+300} ${y+60}H${x+340}\\\" stroke=\\\"#293a4a\\\" stroke-width=\\\"2\\\"/>`)", '')
          s=s.replace('viewBox=\\\"0 0 1460 850\\\"','viewBox=\\\"0 0 1460 760\\\"')
          h.write_text(s)
          PY
          git config user.name github-actions
          git config user.email github-actions@github.com
          if git diff --quiet; then exit 0; fi
          git add history.html
          git commit -m "Fix history bracket connector paths"
          git push
