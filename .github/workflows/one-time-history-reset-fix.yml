name: One-time history reset fix

on:
  push:
    branches:
      - main

permissions:
  contents: write

jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Patch reset handler
        shell: python
        run: |
          from pathlib import Path

          path = Path("admin.html")
          text = path.read_text(encoding="utf-8")

          old = '''          state = {
            pool: [], poolComplete: false, bracket: null, seeds: null,
            bracketHidden: true, podiumHidden: true,
            previousWinner: state.previousWinner || DEFAULT_CHAMPION,
            teamNames: [...teams], mapPool: [...state.mapPool], pendingBracketMaps: []
          };'''

          new = '''          state = {
            ...state,
            pool: [], poolComplete: false, bracket: null, seeds: null,
            bracketHidden: true, podiumHidden: true,
            previousWinner: state.previousWinner || DEFAULT_CHAMPION,
            teamNames: [...teams], mapPool: [...state.mapPool], pendingBracketMaps: []
          };'''

          if old not in text:
              raise SystemExit("Expected Reset / Hide Pool Play block was not found.")

          path.write_text(text.replace(old, new, 1), encoding="utf-8")

      - name: Commit fix and remove one-time workflow
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add admin.html .github/workflows/one-time-history-reset-fix.yml
          git commit -m "Fix Reset / Hide Pool Play preserving history"
          git push
