name: Fix bracket map display
on:
  push:
    branches: [main]
permissions:
  contents: write
jobs:
  patch:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Patch bracket map fallback
        run: |
          python3 - <<'PY'
          from pathlib import Path
          p=Path('index.html')
          s=p.read_text()
          old="let bracketMap=getMatchMap(q,i);B.push(text(x,y+h+22,bracketMap,13,700,'start','#91a7c0'),text(x+150,y+h+22,otStatus(q),13,700,'start','#91a7c0'));"
          new="let bracketMap=getMatchMap(q,i);if(!bracketMap){const fallbackPool=(Array.isArray(state.mapPool)?state.mapPool:[]).filter(v=>{const x=String(v??'').trim().toLowerCase();return x&&x!=='random map'&&x!=='map tbd'});bracketMap=fallbackPool[i%fallbackPool.length]||['Chalet','Oregon','Clubhouse'][i%3]||'';}B.push(text(x,y+h+22,bracketMap,13,700,'start','#91a7c0'),text(x+150,y+h+22,otStatus(q),13,700,'start','#91a7c0'));"
          if old not in s:
              raise SystemExit('target code not found; no change made')
          p.write_text(s.replace(old,new,1))
          PY
      - name: Commit patch
        run: |
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add index.html
          git diff --cached --quiet || git commit -m 'fix bracket map fallback display'
          git push
      - name: Remove temporary workflow
        if: always()
        run: |
          rm -f .github/workflows/fix-bracket-map.yml
          git config user.name 'github-actions[bot]'
          git config user.email '41898282+github-actions[bot]@users.noreply.github.com'
          git add -A
          git diff --cached --quiet || git commit -m 'remove temporary map fix workflow'
          git push || true
